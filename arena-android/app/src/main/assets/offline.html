<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>연결할 수 없음</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         font-family: system-ui, sans-serif; background: Canvas; color: CanvasText; }
  main { text-align: center; padding: 24px; max-width: 360px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { opacity: .7; margin: 0 0 24px; line-height: 1.5; }
  button { font: inherit; padding: 12px 28px; border-radius: 10px; border: 0;
           background: CanvasText; color: Canvas; }
</style>
</head>
<body>
<main>
  <h1>arena.ai에 연결할 수 없어요</h1>
  <p>인터넷 연결을 확인한 뒤 다시 시도해 주세요.<br>연결되면 자동으로 다시 열려요.</p>
  <button id="retry">다시 시도</button>
</main>
<script>
  var target = decodeURIComponent(location.hash.slice(1));
  if (!/^https:\/\//.test(target)) target = 'https://arena.ai/';
  function go() { location.replace(target); }
  document.getElementById('retry').onclick = go;
  window.addEventListener('online', go);
</script>
</body>
</html>
