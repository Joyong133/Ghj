plugins {
    id 'com.android.application'
}

android {
    namespace 'com.joyong.mutetimer'
    compileSdk 34

    defaultConfig {
        applicationId 'com.joyong.mutetimer'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // 개인 설치용 고정 서명키 (업데이트 시 덮어쓰기 설치 가능하도록 저장소에 포함)
    signingConfigs {
        fixed {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixed
        }
        debug {
            signingConfig signingConfigs.fixed
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
