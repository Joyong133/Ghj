name: Community Detox APK

on:
  push:
    paths:
      - 'community-detox/**'
      - '.github/workflows/community-detox-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: community-detox-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: community-detox
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Every build must be signed with the SAME key, or Android refuses to install it as an update.
      # Preferred: a keystore in the DETOX_KEYSTORE_BASE64 repository secret.
      # Otherwise: a key generated once and kept in the Actions cache (reused by every build).
      - name: Use signing key from repository secret
        id: secret_key
        env:
          KEYSTORE_B64: ${{ secrets.DETOX_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.DETOX_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DETOX_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.DETOX_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/detox.jks"
            {
              echo "DETOX_KEYSTORE_PATH=$RUNNER_TEMP/detox.jks"
              echo "DETOX_KEYSTORE_PASSWORD=$KS_PASS"
              echo "DETOX_KEY_ALIAS=$KEY_ALIAS"
              echo "DETOX_KEY_PASSWORD=$KEY_PASS"
            } >> "$GITHUB_ENV"
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore cached signing key
        if: steps.secret_key.outputs.found != 'true'
        id: cached_key
        uses: actions/cache/restore@v4
        with:
          path: ~/detox-signing/detox.jks
          key: community-detox-signing-v1

      - name: Create signing key (first build only)
        if: steps.secret_key.outputs.found != 'true' && steps.cached_key.outputs.cache-hit != 'true'
        working-directory: .
        run: |
          mkdir -p ~/detox-signing
          keytool -genkeypair -noprompt -keystore ~/detox-signing/detox.jks \
            -storepass detox-signing -keypass detox-signing -alias detox \
            -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=Community Detox"

      - name: Save signing key
        if: steps.secret_key.outputs.found != 'true' && steps.cached_key.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/detox-signing/detox.jks
          key: community-detox-signing-v1

      - name: Use cached signing key
        if: steps.secret_key.outputs.found != 'true'
        working-directory: .
        run: |
          {
            echo "DETOX_KEYSTORE_PATH=$HOME/detox-signing/detox.jks"
            echo "DETOX_KEYSTORE_PASSWORD=detox-signing"
            echo "DETOX_KEY_ALIAS=detox"
            echo "DETOX_KEY_PASSWORD=detox-signing"
          } >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/phone/release/app-phone-release.apk CommunityDetox.apk
          cp app/build/outputs/apk/vr/release/app-vr-release.apk CommunityDetox-VR.apk
          ls -la CommunityDetox.apk CommunityDetox-VR.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CommunityDetox-apk
          path: |
            community-detox/CommunityDetox.apk
            community-detox/CommunityDetox-VR.apk

      - name: Publish download link (GitHub Release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=community-detox-latest
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" CommunityDetox.apk CommunityDetox-VR.apk \
            --target "$GITHUB_SHA" \
            --title "커뮤니티 디톡스 APK (최신 빌드)" \
            --notes "브랜치 \`${GITHUB_REF_NAME}\` / 커밋 ${GITHUB_SHA::7} 에서 자동으로 빌드한 APK입니다.

          **설치 방법**
          1. 휴대폰에서 아래 \`CommunityDetox.apk\`를 내려받아 엽니다. (출처를 알 수 없는 앱 설치 허용 필요)
          2. 앱을 열고 **접근성 설정 열기** → '커뮤니티 디톡스 차단'을 켭니다.
          3. '제한된 설정'이라며 켜지지 않으면: 앱 정보 → 오른쪽 위 ⋮ → **제한된 설정 허용** 후 다시 켭니다.

          **VR 헤드셋 (메타 퀘스트 · 피코)** 은 \`CommunityDetox-VR.apk\`를 개발자 모드 + SideQuest(또는 adb install)로 설치하고, 앱에서 **네트워크 차단**을 켜세요."
