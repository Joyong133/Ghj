name: Community Detox APK

on:
  push:
    paths:
      - 'community-detox/**'
      - '.github/workflows/community-detox-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: community-detox-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: community-detox
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Keep the same debug signing key between builds so new APKs install as updates.
      - name: Restore signing key cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: community-detox-debug-keystore

      - name: Use release signing key (optional, from repository secrets)
        env:
          KEYSTORE_B64: ${{ secrets.DETOX_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/detox.jks"
            echo "DETOX_KEYSTORE_PATH=$RUNNER_TEMP/detox.jks" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        env:
          DETOX_KEYSTORE_PASSWORD: ${{ secrets.DETOX_KEYSTORE_PASSWORD }}
          DETOX_KEY_ALIAS: ${{ secrets.DETOX_KEY_ALIAS }}
          DETOX_KEY_PASSWORD: ${{ secrets.DETOX_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk CommunityDetox.apk
          ls -la CommunityDetox.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CommunityDetox-apk
          path: community-detox/CommunityDetox.apk

      - name: Publish download link (GitHub Release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=community-detox-latest
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" CommunityDetox.apk \
            --target "$GITHUB_SHA" \
            --title "커뮤니티 디톡스 APK (최신 빌드)" \
            --notes "브랜치 \`${GITHUB_REF_NAME}\` / 커밋 ${GITHUB_SHA::7} 에서 자동으로 빌드한 APK입니다.

          **설치 방법**
          1. 휴대폰에서 아래 \`CommunityDetox.apk\`를 내려받아 엽니다. (출처를 알 수 없는 앱 설치 허용 필요)
          2. 앱을 열고 **접근성 설정 열기** → '커뮤니티 디톡스 차단'을 켭니다.
          3. '제한된 설정'이라며 켜지지 않으면: 앱 정보 → 오른쪽 위 ⋮ → **제한된 설정 허용** 후 다시 켭니다."
