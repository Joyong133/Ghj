name: Community AppLock APK

on:
  push:
    paths:
      - 'community-applock/**'
      - '.github/workflows/community-applock-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: community-applock-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: community-applock
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Every build must be signed with the SAME key, or Android refuses to install it as an update.
      # Preferred: a keystore in the DETOX_KEYSTORE_BASE64 repository secret.
      # Otherwise: a key generated once and kept in the Actions cache (reused by every build).
      - name: Use signing key from repository secret
        id: secret_key
        env:
          KEYSTORE_B64: ${{ secrets.DETOX_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.DETOX_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DETOX_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.DETOX_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            # Only DETOX_KEYSTORE_BASE64 is required; the keystore file itself is the secret.
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/detox.jks"
            {
              echo "DETOX_KEYSTORE_PATH=$RUNNER_TEMP/detox.jks"
              echo "DETOX_KEYSTORE_PASSWORD=${KS_PASS:-detox-signing}"
              echo "DETOX_KEY_ALIAS=${KEY_ALIAS:-detox}"
              echo "DETOX_KEY_PASSWORD=${KEY_PASS:-detox-signing}"
            } >> "$GITHUB_ENV"
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore cached signing key
        if: steps.secret_key.outputs.found != 'true'
        id: cached_key
        uses: actions/cache/restore@v4
        with:
          path: ~/detox-signing/detox.jks
          key: community-applock-signing-v1

      - name: Create signing key (first build only)
        if: steps.secret_key.outputs.found != 'true' && steps.cached_key.outputs.cache-hit != 'true'
        working-directory: .
        run: |
          mkdir -p ~/detox-signing
          keytool -genkeypair -noprompt -keystore ~/detox-signing/detox.jks \
            -storepass detox-signing -keypass detox-signing -alias detox \
            -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=Community AppLock"

      - name: Save signing key
        if: steps.secret_key.outputs.found != 'true' && steps.cached_key.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/detox-signing/detox.jks
          key: community-applock-signing-v1

      - name: Use cached signing key
        if: steps.secret_key.outputs.found != 'true'
        working-directory: .
        run: |
          {
            echo "DETOX_KEYSTORE_PATH=$HOME/detox-signing/detox.jks"
            echo "DETOX_KEYSTORE_PASSWORD=detox-signing"
            echo "DETOX_KEY_ALIAS=detox"
            echo "DETOX_KEY_PASSWORD=detox-signing"
          } >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk AppLock.apk
          ls -la AppLock.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AppLock-apk
          path: community-applock/AppLock.apk

      - name: Publish download link (GitHub Release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=community-applock-latest
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" AppLock.apk \
            --target "$GITHUB_SHA" \
            --latest=false \
            --title "커뮤니티 앱 잠금 APK (최신 빌드)" \
            --notes "누가 만든 앱이든 커뮤니티 앱이면 잠그는 앱입니다 (휴대폰·메타 퀘스트 공용).
          설치 후 앱을 열고 **접근성 설정 열기** → '커뮤니티 앱 잠금'을 켜세요."
