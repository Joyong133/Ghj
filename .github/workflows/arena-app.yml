name: Arena 앱 빌드

on:
  workflow_dispatch:
  push:
    paths:
      - 'arena-app/**'
      - '.github/workflows/arena-app.yml'
    tags:
      - 'arena-v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: arena-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: arena-app/package-lock.json

      - run: npm ci

      - name: 설치 파일 만들기
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: Arena-${{ runner.os }}
          path: |
            arena-app/dist/*.exe
            arena-app/dist/*.dmg
            arena-app/dist/*.AppImage
            arena-app/dist/*.deb
          if-no-files-found: error

      - name: 릴리스에 올리기 (태그일 때만)
        if: startsWith(github.ref, 'refs/tags/arena-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            arena-app/dist/*.exe
            arena-app/dist/*.dmg
            arena-app/dist/*.AppImage
            arena-app/dist/*.deb
