name: 일본 TV 앱 APK 빌드

on:
  push:
    paths:
      - 'japan-tv-app/**'
      - '.github/workflows/japan-tv-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: APK 빌드
        working-directory: japan-tv-app
        run: |
          chmod +x gradlew
          # Gradle 내려받기가 일시적으로 실패할 때를 대비해 몇 번 다시 시도합니다.
          for i in 1 2 3 4 5; do ./gradlew --version --no-daemon && break; echo "retry $i"; sleep $((i * 20)); done
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../japan-tv.apk

      - uses: actions/upload-artifact@v4
        with:
          name: japan-tv-apk
          path: japan-tv.apk

      - name: 릴리스에 APK 올리기 (휴대폰에서 바로 받기용)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: japan-tv-latest
          target_commitish: ${{ github.sha }}
          name: 일본TV 앱 (최신 빌드)
          prerelease: true
          files: japan-tv.apk
          body: |
            일본 방송(유튜브 공식 라이브)을 TV처럼 틀어 두고 일본어 듣기를 연습하는 앱입니다.

            설치 방법
            1. 휴대폰에서 아래 japan-tv.apk 를 눌러 받습니다.
            2. 받은 파일을 열어 설치합니다. (처음이면 '출처를 알 수 없는 앱 설치'를 허용해 주세요.)
            3. 새 버전이 나오면 같은 방법으로 받아서 설치하면 기존 앱 위에 업데이트됩니다.
