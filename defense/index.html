<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="영웅을 소환·합성해 진형을 짜고 30스테이지 동안 성벽을 지키는 자동 전투 방어 게임">
<title>성벽 방어전</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* Layout: 세로 한 화면 모바일 게임. 상단 HUD(스테이지 메달·성벽·유물·골드) → 밝은 전장 캔버스 → 시너지 → 선택 정보 → 대기석 4x2 → 소환 버튼 줄 + 큰 전투 버튼.
   전투 중에는 아래 영역이 스킬 바로 바뀜. 모든 시트는 금테 패널. */
:root {
  --bg0: #0a0f1e;
  --bg1: #111a31;
  --bg2: #182441;
  --bg3: #213056;
  --rim: #31437a;
  --gold1: #ffe9a8;
  --gold2: #f7c255;
  --gold3: #de8d20;
  --gold4: #7a4a10;
  --ink: #f5efe0;
  --muted: #a3b2d6;
  --dim: #6d7ca8;
  --red: #f25a50;
  --green: #5bd68a;
  --font-display: "Bagel Fat One", "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: radial-gradient(120% 60% at 50% 0%, #1c2b56 0%, var(--bg0) 60%) var(--bg0);
  background-attachment: fixed;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 14px;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--gold2); outline-offset: 2px; }
.app { max-width: 520px; margin: 0 auto; padding-inline: 16px; padding-block: 8px 16px; display: flex; flex-direction: column; gap: 8px; }
.stack { display: flex; flex-direction: column; gap: 8px; }
.disp { font-family: var(--font-display); font-weight: 400; letter-spacing: 0.01em; }
.ico { width: 1em; height: 1em; display: inline-block; vertical-align: -0.14em; flex: none; }

/* ---------- 게임 버튼 ---------- */
.btn {
  --top: #3a4c80; --bot: #26355e; --edge: #141d38; --fg: var(--ink);
  position: relative; border: 0; border-radius: 14px; color: var(--fg);
  background: linear-gradient(180deg, var(--top), var(--bot));
  box-shadow: inset 0 2px 0 rgba(255,255,255,0.28), inset 0 -3px 0 rgba(0,0,0,0.18), 0 4px 0 var(--edge), 0 7px 14px rgba(0,0,0,0.4);
  font-family: var(--font-display); font-weight: 400; transition: transform 0.06s, box-shadow 0.06s, filter 0.15s;
  text-shadow: 0 1.5px 0 rgba(0,0,0,0.35);
}
.btn:active:not(:disabled) { transform: translateY(3px); box-shadow: inset 0 2px 0 rgba(255,255,255,0.28), inset 0 -2px 0 rgba(0,0,0,0.18), 0 1px 0 var(--edge), 0 3px 8px rgba(0,0,0,0.4); }
.btn:disabled { filter: grayscale(0.85) brightness(0.62); cursor: default; }
.btn.gold { --top: #ffd877; --bot: #f2a22f; --edge: #94540f; --fg: #3d2104; text-shadow: 0 1px 0 rgba(255,255,255,0.45); }
.btn.blue { --top: #63a8ff; --bot: #2f66d8; --edge: #193a88; }
.btn.purple { --top: #c197ff; --bot: #7c4fe2; --edge: #43248f; }
.btn.green { --top: #6ee09a; --bot: #27a35c; --edge: #135c31; }
.btn.red { --top: #ff8a7a; --bot: #d9433a; --edge: #7d1d17; }
.btn.dark { --top: #2c3b66; --bot: #1d2a4b; --edge: #0e1529; }

.pill {
  display: inline-flex; align-items: center; gap: 3px; border-radius: 999px; padding: 1px 7px 1px 4px;
  background: rgba(0,0,0,0.28); font-family: var(--font-display); font-size: 12px; line-height: 1.5; text-shadow: none; color: #fff;
}
.btn.gold .pill { color: #3d2104; background: rgba(255,255,255,0.35); }
.coin {
  width: 14px; height: 14px; border-radius: 50%; flex: none; display: inline-block;
  background: radial-gradient(circle at 35% 32%, #fff3bf 0 18%, #ffd25a 34%, #e59a1f 70%, #a8600f);
  box-shadow: inset 0 0 0 1.2px #a8600f, 0 1px 0 rgba(0,0,0,0.35);
}
.honor-ico {
  width: 15px; height: 15px; display: inline-block; flex: none;
  background: linear-gradient(180deg, #e3d1ff, #8b5cf0); clip-path: polygon(50% 0, 100% 35%, 82% 100%, 18% 100%, 0 35%);
}

/* ---------- HUD ---------- */
.hud { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; }
.medal {
  width: 58px; height: 58px; border-radius: 50%; border: 0; padding: 0; position: relative;
  background: radial-gradient(circle at 50% 35%, #2f4682, #15204a 70%);
  box-shadow: 0 0 0 2.5px var(--gold3), 0 0 0 4.5px #3a250a, inset 0 0 0 2px rgba(255,233,168,0.35), 0 6px 14px rgba(0,0,0,0.5);
  display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1;
}
.medal small { font-size: 8.5px; letter-spacing: 0.14em; color: var(--gold1); font-weight: 700; }
.medal b { font-family: var(--font-display); font-weight: 400; font-size: 25px; color: #fff; text-shadow: 0 2px 0 #0b1330; margin-top: 2px; }
.medal.boss { box-shadow: 0 0 0 2.5px var(--red), 0 0 0 4.5px #3a0f0a, inset 0 0 0 2px rgba(255,160,150,0.35), 0 0 18px rgba(242,90,80,0.55); }
.medal .boss-flag {
  position: absolute; bottom: -7px; left: 50%; transform: translateX(-50%); background: var(--red); color: #fff;
  font-family: var(--font-display); font-size: 10px; padding: 1px 6px; border-radius: 6px; box-shadow: 0 2px 0 #7d1d17;
}
.medal .menu-badge {
  position: absolute; top: -3px; right: -5px; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center;
  background: linear-gradient(180deg, #ffd877, #f2a22f); color: #3d2104; box-shadow: 0 2px 0 #94540f;
}
.medal .menu-badge svg { width: 12px; height: 12px; }
.hud-mid { min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.wall { display: flex; align-items: center; gap: 6px; }
.wall .ico { width: 18px; height: 18px; color: #c9cfe0; }
.bar {
  flex: 1; height: 14px; border-radius: 7px; background: #0b1124; position: relative; overflow: hidden;
  box-shadow: inset 0 1px 2px rgba(0,0,0,0.6), 0 0 0 1px #2a3866;
}
.bar i {
  position: absolute; inset: 0 auto 0 0; border-radius: 7px; transition: width 0.5s;
  background: linear-gradient(180deg, #ff9b7f, #e8463c 55%, #b72c25);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.4);
}
.bar span {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--font-display);
  font-size: 10.5px; color: #fff; text-shadow: 0 1px 0 #000, 0 0 3px #000; font-variant-numeric: tabular-nums;
}
.relics { display: flex; gap: 4px; flex-wrap: wrap; min-height: 22px; align-items: center; }
.relic-dot {
  width: 22px; height: 22px; border-radius: 7px; border: 0; padding: 3px; color: var(--gold1);
  background: linear-gradient(180deg, #3b2a5e, #241a40); box-shadow: inset 0 0 0 1px #8b6bd6, 0 2px 0 #120c22;
}
.relic-dot svg { width: 100%; height: 100%; display: block; }
.relic-empty { font-size: 11px; color: var(--dim); }
.hud-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.gold-pill {
  display: flex; align-items: center; gap: 6px; padding: 3px 10px 3px 5px; border-radius: 999px;
  background: linear-gradient(180deg, #1b2546, #10182f); box-shadow: inset 0 0 0 1px #3b4c84, 0 2px 0 rgba(0,0,0,0.4);
  font-family: var(--font-display); font-size: 19px; line-height: 1.1; font-variant-numeric: tabular-nums; min-width: 74px; justify-content: space-between;
}
.gold-pill .coin { width: 20px; height: 20px; }
.gold-pill.bump { animation: bump 0.35s; }
@keyframes bump { 40% { transform: scale(1.12); } }
.hud-btns { display: flex; gap: 5px; }
.ibtn { width: 34px; height: 30px; border-radius: 10px; font-size: 13px; padding: 0; display: flex; align-items: center; justify-content: center; }
.ibtn .ico { width: 17px; height: 17px; }

/* ---------- 전장 ---------- */
.field { position: relative; border-radius: 16px; padding: 3px; background: linear-gradient(180deg, #c49440, #6b440f); box-shadow: 0 8px 22px rgba(0,0,0,0.5); }
#field { display: block; width: 100%; max-width: 100%; aspect-ratio: 480 / 330; border-radius: 13px; background: #6a9d4a; touch-action: manipulation; cursor: pointer; }
.banner {
  position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); pointer-events: none; white-space: nowrap; text-align: center;
  font-family: var(--font-display); font-size: 42px; line-height: 1.05; color: #fff;
  -webkit-text-stroke: 2px #2a1407; paint-order: stroke fill; text-shadow: 0 4px 0 #2a1407, 0 0 24px rgba(0,0,0,0.45);
  animation: pop 0.35s cubic-bezier(.2,1.6,.4,1);
}
.banner small { display: block; font-size: 17px; -webkit-text-stroke: 1.2px #2a1407; margin-top: 6px; }
.banner.win { color: var(--gold2); }
.banner.lose { color: #ff7d72; }
.banner.hidden-hero { color: #fff1b3; }
@keyframes pop { from { transform: translate(-50%, -50%) scale(0.4); opacity: 0; } }

/* ---------- 시너지 ---------- */
.syn { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
.chip {
  border: 0; border-radius: 10px; padding: 4px; display: flex; align-items: center; justify-content: center; gap: 4px;
  background: var(--bg1); box-shadow: inset 0 0 0 1px #26365f; color: var(--dim); min-width: 0;
}
.chip .tic { width: 20px; height: 20px; border-radius: 6px; display: grid; place-items: center; background: #26355e; color: #8090b8; flex: none; }
.chip .tic svg { width: 13px; height: 13px; }
.chip .cnt { font-family: var(--font-display); font-size: 14px; line-height: 1; font-variant-numeric: tabular-nums; }
.chip .pips { display: flex; gap: 2px; }
.chip .pips i { width: 5px; height: 5px; border-radius: 50%; background: #2d3c66; }
.chip .col { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; }
.chip.part { color: var(--ink); }
.chip.part .tic { background: color-mix(in srgb, var(--c) 35%, #1a2544); color: #fff; }
.chip.on { background: linear-gradient(180deg, color-mix(in srgb, var(--c) 40%, #172241), color-mix(in srgb, var(--c) 16%, #121a31)); box-shadow: inset 0 0 0 1.5px var(--c), 0 0 12px color-mix(in srgb, var(--c) 35%, transparent); color: #fff; }
.chip.on .tic { background: var(--c); color: #fff; }
.chip .pips i.lit { background: var(--c); box-shadow: 0 0 4px var(--c); }

/* ---------- 정보 카드 ---------- */
.info {
  min-height: 70px; border-radius: 14px; padding: 8px 10px; display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center;
  background: linear-gradient(180deg, var(--bg2), var(--bg1)); box-shadow: inset 0 0 0 1px #2a3a68, inset 0 1px 0 rgba(255,255,255,0.05);
}
.info.plain { grid-template-columns: 1fr; }
.portrait {
  --g: #a4afc2; width: 54px; height: 54px; border-radius: 12px; position: relative; flex: none;
  background: radial-gradient(circle at 50% 30%, color-mix(in srgb, var(--c, #5470b8) 55%, #1d2a4d), #121a31 75%);
  box-shadow: inset 0 0 0 2px var(--g), 0 2px 0 rgba(0,0,0,0.4);
}
.portrait canvas { width: 100%; height: 100%; display: block; border-radius: 12px; }
.info-main { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.info-title { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.info-title b { font-family: var(--font-display); font-weight: 400; font-size: 17px; }
.tbadge {
  display: inline-flex; align-items: center; gap: 3px; font-size: 10.5px; font-weight: 700; padding: 1px 6px 1px 4px; border-radius: 6px;
  background: color-mix(in srgb, var(--c) 28%, transparent); color: var(--c);
}
.tbadge svg { width: 11px; height: 11px; }
.stars { color: var(--gold2); font-size: 12px; letter-spacing: -1.5px; text-shadow: 0 1px 0 #5a3405; }
.info-stat { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; display: flex; gap: 10px; flex-wrap: wrap; }
.info-skill { font-size: 12px; line-height: 1.45; color: #dfe6f7; }
.info-skill em { font-style: normal; font-weight: 700; color: var(--gold2); margin-right: 4px; }
.hint { font-size: 12.5px; line-height: 1.5; color: #dfe6f7; }
.hint b { color: var(--gold2); }
.odds { display: flex; flex-wrap: wrap; gap: 3px 8px; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: 2px; }
.odds span b { font-weight: 700; }
.sell-btn { padding: 7px 9px 6px; font-size: 13px; display: flex; flex-direction: column; align-items: center; gap: 2px; line-height: 1.1; border-radius: 11px; }

/* ---------- 대기석 ---------- */
.bench-head { display: flex; align-items: center; gap: 8px; }
.bench-head .lbl { font-family: var(--font-display); font-size: 14px; color: var(--muted); }
.bench-head .lbl b { color: var(--ink); font-weight: 400; }
.bench-head .sp { flex: 1; }
.mini-btn { font-size: 12px; padding: 5px 10px 4px; border-radius: 10px; }
.bench { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.card { position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 0; cursor: pointer; border-radius: 12px; transition: transform 0.12s; }
.card .frame {
  --g: #a4afc2; width: 100%; aspect-ratio: 1; border-radius: 12px; position: relative; overflow: hidden;
  background: radial-gradient(circle at 50% 28%, color-mix(in srgb, var(--c) 60%, #1d2a4d), #111a31 78%);
  box-shadow: inset 0 0 0 2px var(--g), inset 0 0 0 3.5px rgba(0,0,0,0.35), 0 3px 0 rgba(0,0,0,0.45);
}
.card canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.card .strip {
  position: absolute; left: 2px; right: 2px; bottom: 2px; height: 17px; border-radius: 0 0 10px 10px;
  background: linear-gradient(180deg, transparent, rgba(0,0,0,0.75)); display: flex; align-items: flex-end; justify-content: center; padding-bottom: 2px;
  font-size: 10px; color: var(--gold2); letter-spacing: -1.5px; text-shadow: 0 1px 0 #3a2203;
}
.card .tb {
  position: absolute; top: 4px; left: 4px; width: 18px; height: 18px; border-radius: 6px; display: grid; place-items: center;
  background: var(--c); color: #fff; box-shadow: 0 1px 0 rgba(0,0,0,0.5);
}
.card .tb svg { width: 11px; height: 11px; }
.card .nm { font-size: 11px; font-weight: 700; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #dfe6f7; }
.card.hiddenhero .frame { box-shadow: inset 0 0 0 2px #ffe08a, inset 0 0 0 3.5px rgba(0,0,0,0.35), 0 0 14px rgba(255,214,110,0.55), 0 3px 0 rgba(0,0,0,0.45); }
.card.empty .frame { background: rgba(17,26,49,0.55); box-shadow: inset 0 0 0 1.5px #24345e; }
.card.empty .frame::after { content: ""; position: absolute; inset: 34%; border-radius: 50%; border: 2px dashed #2b3d6b; }
.card.empty { cursor: default; }
.card.empty.target { cursor: pointer; }
.card.empty.target .frame { box-shadow: inset 0 0 0 2px var(--gold2); }
.card.sel .frame { box-shadow: inset 0 0 0 2.5px #fff, 0 0 0 2px var(--gold2), 0 0 14px rgba(247,194,85,0.6); }
.card.sel { transform: translateY(-3px); }
.card.can .frame { animation: glow 0.9s ease-in-out infinite; }
.card .merge-tag {
  position: absolute; top: -6px; right: -4px; background: var(--gold2); color: #3d2104; font-family: var(--font-display); font-size: 10px;
  padding: 1px 5px; border-radius: 6px; box-shadow: 0 2px 0 #94540f; z-index: 1;
}
@keyframes glow { 50% { box-shadow: inset 0 0 0 2.5px #ffe08a, 0 0 16px rgba(255,214,110,0.75), 0 3px 0 rgba(0,0,0,0.45); } }

/* ---------- 행동 버튼 ---------- */
.actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 2px; }
.act { padding: 7px 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; line-height: 1.05; font-size: 15px; }
.act .row { display: flex; align-items: center; gap: 5px; white-space: nowrap; }
.act .row .ico { width: 17px; height: 17px; }
.fight { margin-top: 4px; padding: 12px 10px 11px; font-size: 22px; display: flex; align-items: center; justify-content: center; gap: 10px; border-radius: 16px; }
.fight .ico { width: 22px; height: 22px; }
.fight small { font-family: var(--font-body); font-weight: 700; font-size: 12px; opacity: 0.75; text-shadow: none; }

/* ---------- 전투 스킬 바 ---------- */
.battle-ui { display: flex; flex-direction: column; gap: 10px; }
.battle-top { display: flex; align-items: center; gap: 8px; }
.battle-top .note { flex: 1; font-size: 12px; color: var(--muted); line-height: 1.4; }
.auto-btn { padding: 7px 12px 6px; font-size: 14px; border-radius: 12px; display: flex; align-items: center; gap: 6px; }
.auto-btn .dot { width: 9px; height: 9px; border-radius: 50%; background: #1d2a4b; box-shadow: inset 0 0 0 1.5px rgba(0,0,0,0.3); }
.auto-btn.on .dot { background: #8dff9e; box-shadow: 0 0 8px #8dff9e; }
.skillbar { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.sk { border: 0; background: none; padding: 0; display: flex; flex-direction: column; align-items: center; gap: 5px; min-width: 0; }
.sk .ring {
  --p: 0; --c: #fff; width: 100%; max-width: 64px; aspect-ratio: 1; border-radius: 50%; padding: 4px; position: relative;
  background: conic-gradient(var(--c) calc(var(--p) * 1%), #1a2544 0);
  box-shadow: 0 0 0 2px #0b1124, 0 4px 0 rgba(0,0,0,0.45);
}
.sk .ring .in { width: 100%; height: 100%; border-radius: 50%; overflow: hidden; position: relative; background: radial-gradient(circle at 50% 30%, color-mix(in srgb, var(--c) 45%, #1d2a4d), #111a31 75%); }
.sk canvas { width: 100%; height: 100%; display: block; }
.sk .hp { width: 100%; max-width: 64px; height: 6px; border-radius: 3px; background: #0b1124; overflow: hidden; }
.sk .hp i { display: block; height: 100%; background: linear-gradient(180deg, #8af0ac, #2fb862); }
.sk .nm { font-size: 10.5px; font-weight: 700; color: #dfe6f7; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sk.ready .ring { box-shadow: 0 0 0 2px #fff, 0 0 18px var(--c), 0 4px 0 rgba(0,0,0,0.45); animation: ready 0.7s ease-in-out infinite; }
.sk.ready .ring::after {
  content: "TAP"; position: absolute; left: 50%; bottom: -4px; transform: translateX(-50%); font-family: var(--font-display); font-size: 10px;
  background: #fff; color: #1d1526; padding: 0 5px; border-radius: 5px;
}
.sk.dead { filter: grayscale(1) brightness(0.5); }
.sk.empty { visibility: hidden; }
@keyframes ready { 50% { transform: scale(1.06); } }

/* ---------- 토스트 ---------- */
.toast {
  position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 80;
  background: linear-gradient(180deg, #26355f, #18233f); box-shadow: inset 0 0 0 1px #4b62a3, 0 10px 28px rgba(0,0,0,0.5);
  color: var(--ink); padding: 9px 16px; border-radius: 12px; font-size: 13px; font-weight: 700; max-width: calc(100% - 32px); text-align: center; pointer-events: none;
}

/* ---------- 시트 ---------- */
.sheet {
  position: fixed; inset: 0; z-index: 70; display: flex; align-items: center; justify-content: center; padding: 16px;
  background: rgba(4, 7, 16, 0.72); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
}
.panel {
  width: 100%; max-width: 440px; max-height: calc(100% - 8px); overflow: auto; border-radius: 20px; padding: 0 16px 16px;
  background: linear-gradient(180deg, #1c2a4f, #111a31 60%);
  box-shadow: 0 0 0 2px var(--gold3), 0 0 0 4px #2a1a05, inset 0 0 0 1px rgba(255,233,168,0.25), 0 20px 50px rgba(0,0,0,0.6);
  display: flex; flex-direction: column; gap: 12px; animation: rise 0.25s ease-out;
}
@keyframes rise { from { transform: translateY(18px) scale(0.97); opacity: 0; } }
.panel-head {
  position: sticky; top: 0; z-index: 2; margin: 0 -16px; padding: 14px 16px 10px; display: flex; align-items: center; gap: 10px;
  background: linear-gradient(180deg, #24376a, #1c2a4f); border-bottom: 1px solid rgba(255,233,168,0.18);
}
.panel-head h2 { margin: 0; flex: 1; font-family: var(--font-display); font-weight: 400; font-size: 23px; color: var(--gold1); text-shadow: 0 2px 0 #3a250a; text-wrap: balance; }
.panel-head .x { width: 32px; height: 32px; border-radius: 10px; font-size: 16px; padding: 0; }
.panel h3 { margin: 4px 0 0; font-family: var(--font-display); font-weight: 400; font-size: 16px; color: var(--gold2); }
.panel p, .panel li { margin: 0; font-size: 13.5px; line-height: 1.6; color: #dfe6f7; }
.panel ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 3px; }
.panel .muted { color: var(--muted); }
.syn-table { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; font-size: 13px; margin: 0; }
.syn-table dt { color: var(--c); font-weight: 700; display: flex; align-items: center; gap: 4px; }
.syn-table dt svg { width: 13px; height: 13px; }
.syn-table dd { margin: 0; line-height: 1.55; }
.syn-table dd b { color: var(--muted); font-weight: 500; margin-right: 4px; }
.big { padding: 13px; font-size: 20px; border-radius: 16px; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; }
.btn-col { display: flex; flex-direction: column; gap: 10px; }
.btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.stat-grid div { background: rgba(0,0,0,0.25); border-radius: 12px; padding: 9px 11px; box-shadow: inset 0 0 0 1px #2a3a68; }
.stat-grid small { display: block; font-size: 11px; color: var(--muted); }
.stat-grid b { font-family: var(--font-display); font-weight: 400; font-size: 24px; }

/* 결과 */
.result-title { text-align: center; font-family: var(--font-display); font-size: 44px; line-height: 1; margin-top: 10px; -webkit-text-stroke: 2px #2a1407; paint-order: stroke fill; text-shadow: 0 4px 0 #2a1407; }
.result-title.win { color: var(--gold2); }
.result-title.lose { color: #ff7d72; }
.result-sub { text-align: center; font-size: 13px; color: var(--muted); margin-top: -4px; }
.reward { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
.reward > span { display: inline-flex; align-items: center; gap: 5px; background: rgba(0,0,0,0.28); border-radius: 999px; padding: 4px 11px 4px 6px; font-family: var(--font-display); font-size: 15px; box-shadow: inset 0 0 0 1px #2a3a68; }
.reward > span.bad { color: #ff8f86; padding-left: 11px; }
.meter { display: flex; flex-direction: column; gap: 8px; }
.meter-row { display: grid; grid-template-columns: 34px 1fr; gap: 9px; align-items: center; }
.meter-row .portrait { width: 34px; height: 34px; border-radius: 9px; }
.meter-row .portrait canvas { border-radius: 9px; }
.meter-line { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.meter-name { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; gap: 6px; }
.meter-name > span:last-child { font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 500; white-space: nowrap; }
.meter-bars { height: 8px; border-radius: 4px; background: rgba(0,0,0,0.35); overflow: hidden; display: flex; }
.meter-bars i { display: block; height: 100%; }
.mvp { font-family: var(--font-display); font-size: 10px; color: #3d2104; background: var(--gold2); padding: 0 5px; border-radius: 5px; margin-left: 5px; }

/* 유물 */
.relic-cards { display: grid; gap: 10px; }
.relic-card {
  border: 0; text-align: left; display: grid; grid-template-columns: 52px 1fr; gap: 12px; align-items: center; padding: 12px; border-radius: 16px;
  background: linear-gradient(180deg, #2e2257, #1d1640); box-shadow: inset 0 0 0 1.5px #8b6bd6, 0 4px 0 #120c22; color: var(--ink); transition: transform 0.1s;
}
.relic-card:active { transform: translateY(2px); }
.relic-card .ricon { width: 52px; height: 52px; border-radius: 14px; padding: 9px; color: var(--gold1); background: radial-gradient(circle at 50% 35%, #5a42a0, #2a1d55); box-shadow: inset 0 0 0 1.5px rgba(255,233,168,0.45); }
.relic-card .ricon svg { width: 100%; height: 100%; display: block; }
.relic-card b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 17px; color: var(--gold1); }
.relic-card span span { font-size: 13px; color: #dfe6f7; }

/* 마스터리 */
.mastery-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 14px; background: rgba(0,0,0,0.25); box-shadow: inset 0 0 0 1px #2a3a68; }
.mastery-row b { font-family: var(--font-display); font-weight: 400; font-size: 16px; }
.mastery-row .lv { font-size: 12px; color: var(--muted); }
.mastery-row .eff { font-size: 12.5px; color: var(--gold1); }
.mpips { display: flex; gap: 3px; margin-top: 4px; }
.mpips i { width: 10px; height: 5px; border-radius: 2px; background: #2a3a68; }
.mpips i.lit { background: linear-gradient(180deg, #ffe08a, #e59a1f); }
.mbtn { padding: 8px 10px 7px; font-size: 14px; border-radius: 12px; display: flex; align-items: center; gap: 4px; min-width: 64px; justify-content: center; }
.honor-big { display: flex; align-items: center; justify-content: center; gap: 8px; font-family: var(--font-display); font-size: 26px; padding: 4px 0; }
.honor-big .honor-ico { width: 24px; height: 24px; }

/* 도감 */
.dex { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px 8px; }
.dex .card.unknown .frame { background: #0e1528; }
.dex-detail { min-height: 64px; }

/* 로비 */
.lobby { position: fixed; inset: 0; z-index: 50; overflow: auto; background: radial-gradient(120% 60% at 50% 0%, #1c2b56 0%, var(--bg0) 60%) var(--bg0); }
.lobby-inner { max-width: 520px; min-height: 100%; margin: 0 auto; padding-inline: 16px; padding-block: 18px 24px; display: flex; flex-direction: column; justify-content: center; gap: 14px; }
.lobby-art { position: relative; border-radius: 20px; overflow: hidden; padding: 3px; background: linear-gradient(180deg, #c49440, #6b440f); box-shadow: 0 12px 30px rgba(0,0,0,0.55); }
.lobby-art canvas { display: block; width: 100%; max-width: 100%; aspect-ratio: 480 / 330; border-radius: 17px; }
.logo { position: absolute; left: 0; right: 0; top: 6%; text-align: center; pointer-events: none; }
.logo h1 {
  margin: 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(40px, 12vw, 62px); line-height: 1.05; letter-spacing: 0.01em;
  background: linear-gradient(180deg, #fff8dc 0%, #ffd56a 45%, #f09a24 75%, #c9661a 100%); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 3px 0 #3a1f05) drop-shadow(0 0 1.5px #3a1f05) drop-shadow(0 8px 14px rgba(0,0,0,0.45));
}
.logo p { margin: 4px 0 0; font-size: 12px; font-weight: 900; letter-spacing: 0.1em; color: #fff; text-shadow: 0 1px 0 #000, 0 0 8px rgba(0,0,0,0.7); }
.lobby-meta { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
.lobby-meta span.m { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px 5px 9px; border-radius: 999px; background: var(--bg1); box-shadow: inset 0 0 0 1px #2a3a68; font-family: var(--font-display); font-size: 14px; }
.lobby-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.lobby-grid .btn { padding: 11px 4px 10px; font-size: 15px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.lobby-grid .btn .ico { width: 22px; height: 22px; }
.lobby-grid .btn small { font-family: var(--font-body); font-size: 11px; font-weight: 700; opacity: 0.85; text-shadow: none; }
.continue { flex-direction: column; gap: 2px; }
.continue small { display: block; font-family: var(--font-body); font-size: 12px; font-weight: 700; opacity: 0.8; text-shadow: none; }
.type-pick { display: grid; grid-template-columns: 1fr; gap: 9px; }
.type-pick .btn { display: grid; grid-template-columns: 32px 1fr auto; align-items: center; gap: 10px; text-align: left; padding: 10px 12px; font-size: 16px; border-radius: 14px; }
.type-pick .btn .tic { width: 32px; height: 32px; border-radius: 9px; background: var(--c); display: grid; place-items: center; color: #fff; box-shadow: inset 0 -2px 0 rgba(0,0,0,0.25); }
.type-pick .btn .tic svg { width: 18px; height: 18px; }
.type-pick .btn small { display: block; font-family: var(--font-body); font-size: 11.5px; font-weight: 500; color: var(--muted); text-shadow: none; }

@media (max-width: 370px) {
  .act { font-size: 13.5px; }
  .medal { width: 52px; height: 52px; }
  .medal b { font-size: 22px; }
}
@media (prefers-reduced-motion: reduce) {
  .card.can .frame, .sk.ready .ring { animation: none; }
  .banner, .panel { animation: none; }
}
</style>
</head>

<div class="app" id="app">
  <header class="hud">
    <button class="medal" id="menuBtn" type="button" aria-label="메뉴 열기">
      <small>STAGE</small><b id="stageNum">1</b>
      <span class="menu-badge"><svg><use href="#i-menu"/></svg></span>
      <span class="boss-flag" id="bossFlag" hidden>BOSS</span>

    <div class="hud-mid">

        <div class="bar"><i id="wallFill" style="width:100%"></i><span id="wallNum">100 / 100</span></div>

      <div class="relics" id="relics"></div>
    </div>
    <div class="hud-right">
      <div class="gold-pill" id="goldPill" title="골드"><span class="coin"></span><span id="goldNum">20</span></div>

  atk: { tiers: [2, 4], desc: ['아군 공격력 +20%', '아군 공격력 +50%, 치명타 +15%'] },

// ===== 난수 =====
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const pick = (arr, r) => arr[Math.floor(r() * arr.length)];

// ===== 스테이지 =====
const GROWTH = [1.21, 1.15, 1.09];
const GROWTH_BREAK = [12, 22];
function enemyMult(s) {
  let m = 1;
  for (let i = 2; i <= s; i++) {
    const g = i <= GROWTH_BREAK[0] ? GROWTH[0] : i <= GROWTH_BREAK[1] ? GROWTH[1] : i <= FINAL_STAGE ? GROWTH[2] : 1.12;
    m *= g;
  }
  return m * ENEMY_SCALE;
}
let ENEMY_SCALE = 1.18;
const isBossStage = s => s % 5 === 0;
function stagePlan(s) {
  const r = mulberry32(s * 7919 + 13);
  const list = [];
  const frontPool = ['goblin', 'goblin'];
  if (s >= 3) frontPool.push('orc');
  if (s >= 6) frontPool.push('wolf');
  const backPool = ['archer'];
  if (s >= 3) backPool.push('mage');
  if (s >= 4) backPool.push('shaman');
  if (s >= 12) backPool.push('mage');
  if (isBossStage(s)) {
    const bi = (s / 5 - 1) % BOSSES.length;
    list.push({ boss: bi, row: 0, lane: 1 });
    const minions = s <= 5 ? 2 : s <= 15 ? 3 : 4;
    const spots = [[0, 0], [0, 2], [1, 1], [1, 0], [1, 2]];
    for (let i = 0; i < minions; i++) {
      const [row, lane] = spots[i];
      list.push({ mob: row === 0 ? pick(frontPool, r) : pick(backPool, r), row, lane });
    }
    return list;
  }
  const count = s <= 1 ? 2 : s <= 3 ? 3 : s <= 7 ? 4 : s <= 14 ? 5 : 6;
  const frontN = Math.min(3, Math.ceil(count / 2));
  const lanes = [1, 0, 2];
  for (let i = 0; i < frontN; i++) list.push({ mob: pick(frontPool, r), row: 0, lane: lanes[i] });
  for (let i = 0; i < count - frontN; i++) list.push({ mob: pick(backPool, r), row: 1, lane: lanes[i] });
  return list;
}

function canvasTap(ev) {
  if (phase !== 'prep') return;
  const rect = canvas.getBoundingClientRect();
  const x = (ev.clientX - rect.left) * W / rect.width;
  const y = (ev.clientY - rect.top) * H / rect.height;
  for (let i = 0; i < BOARD_SIZE; i++) {
    const p = slotXY(i);
    if (Math.abs(x - p.x) < 32 && y > p.y - 66 && y < p.y + 16) { tapLoc({ z: 'board', i }); return; }
  }
  if (battle) {
    const hit = battle.units.filter(u => u.side === 1).find(u => {
      const p = basePos(u);
      return Math.abs(x - p.x) < 26 * p.s && y > p.y - 60 * p.s && y < p.y + 10;

  }

  sel = null; fx = []; parts = [];
  phase = 'battle';
  battle = makeBattle(G, (G.rngState ^ Math.imul(G.stage, 2654435761)) >>> 0, meta);
  battle.manual = !settings.auto;
  simAcc = 0; endTimer = 0;
  buildSkillbar();
  refresh();
  if (isBossStage(G.stage)) { banner(`BOSS<small>${battle.units.find(u => u.boss).name}</small>`, 'lose', 1300); sfx('boss'); }
  else banner(`STAGE ${G.stage}`, 'win', 900);
}
function finishBattle() {
  const res = battle.result;
  const allies = battle.units.filter(u => u.side === 0);
  const last = applyResult(G, res);
  meta.best = Math.max(meta.best, G.stage);
  if (last.clear) meta.clears++;
  saveMeta();
  phase = 'result';
  sfx(res.win ? 'win' : 'lose');
  bumpGold();
  if (!G.over) save();
  refresh();
  showResult(res, last, allies);
}
function showResult(res, last, allies) {
  const max = Math.max(1, ...allies.map(u => u.dealt + u.healed));
  const mvp = allies.reduce((a, b) => (b.dealt + b.healed > a.dealt + a.healed ? b : a), allies[0]);
  const sub = res.win ? `${last.stage}스테이지를 지켰습니다` : res.timeout ? `시간 초과 · 성벽 -${last.wallDmg}` : `영웅이 모두 쓰러졌습니다 · 성벽 -${last.wallDmg}`;
  const next = G.over ? '결과 보기' : last.clear ? '계속' : last.relic ? '유물 고르기' : '다음 스테이지';
  const p = openSheet(`STAGE ${last.stage} 결과`, `
    <div class="result-title ${res.win ? 'win' : 'lose'}">${res.win ? '승리!' : '방어 실패'}</div>
    <div class="result-sub">${sub}</div>
    <div class="reward">
      <span><span class="coin"></span>보상 +${last.reward}</span>
      ${last.interest ? `<span><span class="coin"></span>이자 +${last.interest}</span>` : ''}
      ${last.wallDmg ? `<span class="bad">성벽 -${last.wallDmg}</span>` : ''}
    </div>
    <h3>전투 기록</h3>
    <div class="meter" id="meter"></div>
    <button class="btn gold big" type="button" id="resultNext">${next}</button>`, { noClose: true });
  const meter = p.querySelector('#meter');
  allies.slice().sort((a, b) => (b.dealt + b.healed) - (a.dealt + a.healed)).forEach(u => {
    const row = document.createElement('div');
    row.className = 'meter-row';
    const port = makePortrait({ look: 'hero', kind: u.kind, hair: u.hair, hs: u.hs, eye: u.eye, beard: u.beard, hidden: u.hidden, side: 0 }, 72);
    port.style.cssText = typeVar(u.kind) + ';' + gradeVar(u.star, u.hidden);
    row.appendChild(port);
    const line = document.createElement('div');
    line.className = 'meter-line';
    line.innerHTML = `<div class="meter-name"><span>${u.name}${u === mvp ? '<span class="mvp">MVP</span>' : ''}${u.alive ? '' : ' <span style="color:#ff8f86;font-weight:500">쓰러짐</span>'}</span><span>피해 ${Math.round(u.dealt).toLocaleString()}${u.healed ? ` · 회복 ${Math.round(u.healed).toLocaleString()}` : ''}</span></div>
      <div class="meter-bars"><i style="width:${100 * u.dealt / max}%;background:${TYPE_INFO[u.kind].color}"></i><i style="width:${100 * u.healed / max}%;background:#5bd68a"></i></div>`;
    row.appendChild(line);
    meter.appendChild(row);
  });
  p.querySelector('#resultNext').addEventListener('click', () => {
    closeSheet();
    if (G.over) { endRun('over'); return; }
    if (last.clear) { showClear(); return; }
    continueAfterResult();
  });
}
function continueAfterResult() {
  if (G.relicOffer) { showRelicPick(); return; }
  backToPrep();
}
function backToPrep() {
  phase = 'prep';
  sel = null;
  previewBattle();
  save();
  refresh();
}
function showRelicPick() {
  phase = 'result';
  const p = openSheet('유물 선택', `<p class="muted">하나를 골라 이번 판이 끝날 때까지 효과를 받습니다.</p><div class="relic-cards">${G.relicOffer.ids.map(id => `<button class="relic-card" type="button" data-id="${id}"><span class="ricon">${relicIcon(id)}</span><span><b>${RELIC[id].name}</b><span>${RELIC[id].desc}</span></span></button>`).join('')}</div>`, { noClose: true });
  p.querySelectorAll('[data-id]').forEach(b => b.addEventListener('click', () => {
    takeRelic(G, b.dataset.id);
    sfx('relic');
    closeSheet();
    toast(`${RELIC[b.dataset.id].name} 획득`);
    backToPrep();
  }));
}
function showClear() {
  const honor = honorFor(G);
  const p = openSheet('방어 성공!', `<div class="result-title win">CLEAR</div>
    <p style="text-align:center">마왕을 쓰러뜨리고 성벽을 지켰습니다. 계속하면 점점 강해지는 적과 끝없이 싸웁니다.</p>
    <div class="btn-col">
      <button class="btn gold big" type="button" id="goOn">무한 방어 계속</button>
      <button class="btn dark big" type="button" id="stopHere">여기서 마치기 <span class="pill"><span class="honor-ico"></span>+${honor}</span></button>
    </div>`, { noClose: true });
  p.querySelector('#goOn').addEventListener('click', () => { closeSheet(); continueAfterResult(); });
  p.querySelector('#stopHere').addEventListener('click', () => { closeSheet(); endRun('quit'); });
}
function endRun(reason) {
  const honor = honorFor(G);
  meta.honor += honor;
  meta.runs++;
  meta.best = Math.max(meta.best, G.stage);
  saveMeta();
  store.del(KEYS.run);
  const stage = G.stage, kills = G.kills, bosses = G.bossKills;
  G = null; battle = null;
  phase = 'lobby';
  const p = openSheet(reason === 'over' ? '성벽이 무너졌습니다' : '방어를 마쳤습니다', `
    <div class="honor-big"><span class="honor-ico"></span>+${honor} 명예</div>
    <div class="stat-grid">
      <div><small>도달 스테이지</small><b>${stage}</b></div>
      <div><small>최고 기록</small><b>${meta.best}</b></div>
      <div><small>쓰러뜨린 적</small><b>${kills}</b></div>
      <div><small>보스 처치</small><b>${bosses}</b></div>
    </div>
    <p class="muted">명예로 마스터리를 올리면 다음 판부터 영웅이 더 강해집니다.</p>
    <button class="btn gold big" type="button" id="toLobby">로비로</button>`, { noClose: true });
  p.querySelector('#toLobby').addEventListener('click', () => { closeSheet(); openLobby(); });
}

// ---------- 로비 ----------
const lctx = $('lobbyArt').getContext('2d');
const lobbyCast = [
  { look: 'hero', kind: 'mag', hair: '#e2683c', hs: 'long', eye: '#e08a1e', x: 92, y: 296, s: 1.45 },
  { look: 'hero', kind: 'def', hair: '#c9a34a', hs: 'spiky', eye: '#2980b9', hidden: true, x: 165, y: 304, s: 1.75 },
  { look: 'hero', kind: 'atk', hair: '#3a2a22', hs: 'spiky', eye: '#c0392b', x: 242, y: 300, s: 1.55 },
  { look: 'hero', kind: 'sup', hair: '#f0a6c8', hs: 'pony', eye: '#e84393', x: 312, y: 302, s: 1.4 },
  { look: 'hero', kind: 'rng', hair: '#2e4a3a', hs: 'short', eye: '#16a085', x: 60, y: 318, s: 1.3 },
];
function renderLobby() {
  const c = lctx;
  c.setTransform(DPR, 0, 0, DPR, 0, 0);
  c.drawImage(bg, 0, 0, W, H);
  c.fillStyle = 'rgba(10,12,30,0.15)'; c.fillRect(0, 0, W, H);
  c.save(); c.translate(418, 236 + Math.sin(time * 1.5) * 4); c.scale(-1.5, 1.5); MOB_DRAW.dragon(c, time); c.restore();
  lobbyCast.slice().sort((a, b) => a.y - b.y).forEach(u => {
    c.save(); c.translate(u.x, u.y);
    ell(c, 0, 0, 17 * u.s, 5 * u.s); c.fillStyle = 'rgba(20,30,10,0.35)'; c.fill();
    c.translate(0, Math.sin(time * 2 + u.x) * 1.2);
    c.scale(u.s, u.s); drawHero(c, u, time, null); c.restore();
  });
}
function loadRun(data) {
  try {
    const g = data || loadJSON(KEYS.run);
    if (g && g.v === 2 && Array.isArray(g.board) && g.board.length === BOARD_SIZE && Array.isArray(g.bench) && !g.over) {
      const valid = u => !u || (HERO[u.hid] && u.star >= 1 && u.star <= MAX_STAR);
      if (g.board.every(valid) && g.bench.every(valid) && Array.isArray(g.relics) && g.relics.every(id => RELIC[id])) return g;
    }
  } catch (e) { /* 저장된 판이 없거나 손상됨 */ }
  return null;
}
function openLobby() {
  if (G && phase === 'prep') save();
  const running = G || loadRun();
  $('continueBtn').hidden = !running;
  if (running) $('continueSub').textContent = `${running.stage}스테이지 · 성벽 ${running.wall}/${running.wallMax} · 골드 ${running.gold}${phase === 'battle' ? ' · 전투 일시정지' : ''}`;
  $('lobbyHonor').textContent = meta.honor;
  $('lobbyBest').textContent = meta.best;
  $('lobbyClears').textContent = meta.clears;
  $('masterySub').textContent = `명예 ${meta.honor}`;
  $('dexSub').textContent = `${HEROES.filter(h => meta.dex[h.id]).length}/${HEROES.length}`;
  $('newBtn').className = running ? 'btn blue big' : 'btn gold big';
  $('lobby').hidden = false;
}
function closeLobby() { $('lobby').hidden = true; }
function continueRun() {
  if (!G) {
    const g = loadRun();
    if (!g) { openLobby(); return; }
    G = g; phase = 'prep'; sel = null; lastGold = G.gold;
  }
  closeLobby();
  if (phase === 'battle') return;
  if (G.relicOffer) { previewBattle(); refresh(); showRelicPick(); return; }
  backToPrep();
}
function newRun() {
  const begin = () => {
    G = newGame((Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0, meta);
    phase = 'prep'; sel = null; fx = []; parts = []; lastGold = G.gold;
    closeLobby();
    backToPrep();
    if (!settings.helpSeen) showHelp();
  };
  const running = G || loadRun();
  if (!running) { begin(); return; }
  const honor = honorFor(running);
  const p = openSheet('새 게임', `<p>진행 중인 판(${running.stage}스테이지)을 끝내고 새로 시작할까요? 끝낸 판의 명예 <b>+${honor}</b>을 받습니다.</p>
    <div class="btn-row"><button class="btn dark big" type="button" id="cNo">취소</button><button class="btn gold big" type="button" id="cYes">새로 시작</button></div>`);
  p.querySelector('#cNo').addEventListener('click', closeSheet);
  p.querySelector('#cYes').addEventListener('click', () => {
    meta.honor += honor; meta.runs++; meta.best = Math.max(meta.best, running.stage); saveMeta();
    store.del(KEYS.run); G = null; battle = null;
    closeSheet(); begin();
  });
}
function showMastery() {
  const draw = () => {
    const p = openSheet('마스터리', `<div class="honor-big"><span class="honor-ico"></span>${meta.honor} 명예</div>
      <p class="muted">판이 끝날 때 받은 명예로 올립니다. 효과는 앞으로의 모든 판에 적용됩니다.</p>
      ${MASTERY.map(m => {
        const lv = meta.mastery[m.id] || 0, maxed = lv >= m.max, cost = masteryCost(lv);
        const sign = m.id === 'def' ? '-' : '+';
        return `<div class="mastery-row"><div><b>${m.name}</b> <span class="lv">Lv.${lv}/${m.max}</span>
          <div class="eff">${m.desc} ${sign}${lv * m.per}${m.unit}${maxed ? '' : ` → ${sign}${(lv + 1) * m.per}${m.unit}`}</div>
          <div class="mpips">${Array.from({ length: m.max }, (_, i) => `<i class="${i < lv ? 'lit' : ''}"></i>`).join('')}</div></div>
          <button class="btn ${maxed ? 'dark' : 'purple'} mbtn" type="button" data-m="${m.id}" ${maxed || meta.honor < cost ? 'disabled' : ''}>${maxed ? 'MAX' : `<span class="honor-ico"></span>${cost}`}</button></div>`;
      }).join('')}`);
    p.querySelectorAll('[data-m]').forEach(b => b.addEventListener('click', () => {
      const m = MASTERY.find(x => x.id === b.dataset.m);
      const lv = meta.mastery[m.id] || 0, cost = masteryCost(lv);
      if (lv >= m.max || meta.honor < cost) return;
      meta.honor -= cost; meta.mastery[m.id] = lv + 1; saveMeta();
      sfx('relic');
      const st = p.scrollTop; draw(); $('panel').scrollTop = st;
      if (!$('lobby').hidden) openLobby();
    }));
  };
  draw();
}
function showDex() {
  const found = HEROES.filter(h => meta.dex[h.id]).length;
  const p = openSheet(`영웅 도감 ${found}/${HEROES.length}`, `<div class="info plain dex-detail" id="dexInfo"><div class="hint">영웅을 누르면 스킬을 봅니다. 아직 만나지 못한 영웅은 그림자로 보입니다.</div></div><div class="dex" id="dexGrid"></div>`);
  const grid = p.querySelector('#dexGrid');
  HEROES.forEach(h => {
    const known = !!meta.dex[h.id];
    let card;
    if (known) card = heroCard({ hid: h.id, star: meta.dex[h.id] });
    else {
      card = document.createElement('div');
      card.className = 'card unknown'; card.tabIndex = 0; card.style.cssText = typeVar(h.type);
      const frame = document.createElement('div'); frame.className = 'frame'; frame.style.cssText = '--g:#2b3d6b';
      const cv = document.createElement('canvas'); cv.width = 128; cv.height = 128;
      frame.appendChild(cv); card.appendChild(frame);
      card.insertAdjacentHTML('beforeend', `<span class="nm">${h.hidden ? '히든 ???' : '???'}</span>`);
      paintPortrait(cv, Object.assign(heroLike({ hid: h.id }), { silhouette: true }));
    }
    const show = () => {
      p.querySelector('#dexInfo').innerHTML = known
        ? `<div class="info-main"><div class="info-title"><b>${h.name}</b><span class="tbadge" style="${typeVar(h.type)}">${ticon(h.type)}${TYPE_INFO[h.type].name}</span>${h.hidden ? '<span class="tbadge" style="--c:#ffe08a">히든</span>' : ''}<span class="stars">최고 ${starsText(meta.dex[h.id])}</span></div><div class="info-skill"><em>${h.skill}</em>${h.desc}</div></div>`
        : `<div class="hint">${h.hidden ? `★5 ${TYPE_INFO[h.type].name} 둘을 합성하면 30% 확률로 만날 수 있습니다.` : `아직 소환하지 못한 ${TYPE_INFO[h.type].name} 영웅입니다.`}</div>`;
    };
    card.addEventListener('click', show);
    card.addEventListener('keydown', e => { if (e.key === 'Enter') show(); });
    grid.appendChild(card);
  });
}

// ---------- 저장 ----------
function save() {
  if (!G || G.over || phase === 'battle') return;
  store.set(KEYS.run, JSON.stringify(G));
}

// ---------- 루프 ----------
let lastT = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  time += dt;
  const lobbyOpen = !$('lobby').hidden;
  if (phase === 'battle' && battle && !sheetOpen && !lobbyOpen) {
    if (!battle.result) {
      battle.manual = !settings.auto;
      simAcc += dt * settings.speed;
      const STEP = 1 / 60;
      let n = 0;
      while (simAcc >= STEP && !battle.result && n++ < 400) {
        battle.step(STEP); simAcc -= STEP;
        if (battle.events.length) { battle.events.forEach(onEvent); battle.events.length = 0; }
      }
    } else if (endTimer > 0) {
      endTimer -= dt;
      if (endTimer <= 0) finishBattle();
    }
    updateSkillbar();
  }
  if (lobbyOpen) renderLobby();
  else if (G) render(dt);
  requestAnimationFrame(frame);
}

// ---------- 이벤트 연결 ----------
$('summonBtn').addEventListener('click', () => doSummon(null));
$('typeBtn').addEventListener('click', openTypeSummon);
$('guardBtn').addEventListener('click', doGuard);
$('fightBtn').addEventListener('click', startBattle);
$('mergeAllBtn').addEventListener('click', doMergeAll);
$('arrangeBtn').addEventListener('click', doArrange);
$('speedBtn').addEventListener('click', () => { settings.speed = settings.speed % 3 + 1; saveSettings(); renderHud(); sfx('tap'); });
$('soundBtn').addEventListener('click', () => { settings.sound = !settings.sound; saveSettings(); renderHud(); sfx('tap'); });
$('helpBtn').addEventListener('click', () => showHelp());
$('autoBtn').addEventListener('click', () => {
  settings.auto = !settings.auto; saveSettings();
  $('autoBtn').classList.toggle('on', settings.auto);
  if (battle) battle.manual = !settings.auto;
  toast(settings.auto ? 'AUTO 켜짐 · 스킬을 자동으로 씁니다' : 'AUTO 꺼짐 · 빛나는 영웅을 눌러 스킬을 쓰세요');
});
$('menuBtn').addEventListener('click', () => { sfx('tap'); openLobby(); });
$('continueBtn').addEventListener('click', () => { sfx('tap'); continueRun(); });
$('newBtn').addEventListener('click', () => { sfx('tap'); newRun(); });
$('masteryBtn').addEventListener('click', () => { sfx('tap'); showMastery(); });
$('dexBtn').addEventListener('click', () => { sfx('tap'); showDex(); });
$('lobbyHelpBtn').addEventListener('click', () => { sfx('tap'); showHelp(); });
canvas.addEventListener('click', canvasTap);
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (sheetOpen && $('sheetX')) closeSheet();
  else if (sel) { sel = null; refresh(); }
});

function boot(hot) {
  const g = hot && hot.G ? loadRun(hot.G) : null;
  if (g) { G = g; phase = 'prep'; lastGold = G.gold; continueRun(); }
  else openLobby();
  requestAnimationFrame(t => { lastT = t; frame(t); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (G && phase !== 'battle') refresh(); });
}
window.claude?.hot?.snapshot?.(() => (G && !G.over ? { G: JSON.parse(JSON.stringify(G)) } : {}));
if (window.claude?.hot?.ready) window.claude.hot.ready(boot);
else boot(window.claude?.hot?.data ?? {});
})();
</script>
