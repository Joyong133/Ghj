plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ghj.aireplace'
    compileSdk 34

    defaultConfig {
        applicationId 'com.ghj.aireplace'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // 사이드로딩용: 디버그 키로 서명 (스토어 배포 시 자체 키로 교체)
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
