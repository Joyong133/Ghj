plugins {
    id 'com.android.application'
}

// Release signing is optional: put keystore.properties (storeFile, storePassword,
// keyAlias, keyPassword) next to this project's settings.gradle to sign releases.
def ksFile = rootProject.file('keystore.properties')
def ks = new Properties()
if (ksFile.exists()) ksFile.withInputStream { ks.load(it) }

android {
    namespace 'com.joyong.jlock'
    compileSdk 35

    defaultConfig {
        applicationId 'com.joyong.jlock'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '2.1'
    }

    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile rootProject.file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (ksFile.exists()) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// The study UI is the repository's root index.html, shared with the web version.
abstract class CopyWebTask extends DefaultTask {
    @InputFile abstract RegularFileProperty getSource()
    @OutputDirectory abstract DirectoryProperty getOutputDir()

    @TaskAction
    void run() {
        def out = outputDir.get().asFile
        out.mkdirs()
        new File(out, 'index.html').bytes = source.get().asFile.bytes
    }
}

def copyWeb = tasks.register('copyWeb', CopyWebTask) {
    source = rootProject.file('../index.html')
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.sources.assets?.addGeneratedSourceDirectory(copyWeb) { it.outputDir }
    }
}
