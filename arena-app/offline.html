<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>연결할 수 없음</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; height: 100vh; display: grid; place-items: center;
         font-family: system-ui, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
         background: Canvas; color: CanvasText; }
  main { text-align: center; padding: 24px; max-width: 420px; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { opacity: .7; margin: 0 0 20px; line-height: 1.5; }
  button { font: inherit; padding: 10px 20px; border-radius: 8px; border: 1px solid; cursor: pointer;
           background: CanvasText; color: Canvas; }
  small { display: block; margin-top: 16px; opacity: .5; }
</style>
</head>
<body>
<main>
  <h1>arena.ai에 연결할 수 없어요</h1>
  <p>인터넷 연결을 확인한 뒤 다시 시도해 주세요.</p>
  <button id="retry">다시 시도</button>
  <small id="reason"></small>
</main>
<script>
  const q = new URLSearchParams(location.search);
  const target = q.get('url') || 'https://arena.ai/';
  document.getElementById('reason').textContent = q.get('reason') || '';
  const go = () => { location.href = /^https:\/\//.test(target) ? target : 'https://arena.ai/'; };
  document.getElementById('retry').onclick = go;
  window.addEventListener('online', go);
</script>
</body>
</html>
