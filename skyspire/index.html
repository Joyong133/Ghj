<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Skyspire</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="100층 부유성을 오르는 1인칭 검술 액션 RPG. 브라우저와 WebXR VR에서 플레이.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;700&family=Marcellus+SC&display=swap">
<style>
/* Layout: 화면 전체를 3D 캔버스가 채우고, HUD는 네 모서리에 얇은 금속판처럼 얹힌다. 메뉴는 가운데 한 장의 각인판. */
:root {
  color-scheme: dark;
  --ink: #0b0f15;
  --plate: rgba(13, 19, 28, 0.84);
  --plate-solid: #111925;
  --line: rgba(206, 220, 236, 0.2);
  --line-strong: rgba(232, 197, 116, 0.55);
  --text: #e8edf4;
  --muted: #95a3b4;
  --brass: #e3c070;
  --brass-dim: #9c8247;
  --hp: #5fd27a;
  --hp-mid: #e4c64a;
  --hp-low: #e0554a;
  --exp: #7cc4ff;
  --danger: #ff6a5c;
  --font-display: "Marcellus SC", "Gowun Batang", Georgia, serif;
  --font-title-ko: "Gowun Batang", "Nanum Myeongjo", "Apple SD Gothic Neo", serif;
  --font-ui: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --cut: 10px;
  --gut-l: max(16px, env(safe-area-inset-left, 0px));
  --gut-r: max(16px, env(safe-area-inset-right, 0px));
  --gut-t: max(12px, env(safe-area-inset-top, 0px));
  --gut-b: max(12px, env(safe-area-inset-bottom, 0px));
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; background: var(--ink); color: var(--text); overflow: hidden; }
body { font-family: var(--font-ui); font-size: 14px; -webkit-user-select: none; user-select: none; touch-action: none; }
#app { position: fixed; inset: 0; }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }

.plate {
  background: var(--plate);
  border: 1px solid var(--line);
  clip-path: polygon(var(--cut) 0, 100% 0, 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, 0 100%, 0 var(--cut));
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
}

/* ---------- HUD ---------- */
#hud { position: absolute; inset: 0; pointer-events: none; }
#hud[hidden] { display: none !important; }
#status {
  position: absolute; left: var(--gut-l); top: var(--gut-t);
  width: min(340px, calc(100vw - 200px)); min-width: 200px;
  padding: 10px 12px 10px 14px; display: grid; gap: 6px;
}
#status .row1 { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
#pname { font-family: var(--font-title-ko); font-weight: 700; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
#plevel { color: var(--brass); font-family: var(--font-display); font-size: 14px; letter-spacing: 0.06em; margin-left: auto; white-space: nowrap; }
.bar { position: relative; height: 12px; background: rgba(0,0,0,0.5); border: 1px solid var(--line);
  clip-path: polygon(0 0, 100% 0, calc(100% - 8px) 100%, 0 100%); }
.bar > i { position: absolute; inset: 0 auto 0 0; width: 100%; background: var(--hp); transition: width 0.12s linear, background-color 0.3s; }
.bar > b { position: absolute; inset: 0 auto 0 0; width: 100%; background: rgba(255,255,255,0.35); transition: width 0.6s ease 0.25s; }
.bar.exp { height: 4px; clip-path: none; border: 0; }
.bar.exp > i { background: var(--exp); }
#hptext { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; display: flex; justify-content: space-between; gap: 8px; }
#buffs { display: flex; gap: 6px; flex-wrap: wrap; font-size: 11px; color: var(--muted); min-height: 0; }
#buffs span { border: 1px solid var(--line); padding: 1px 6px; }

#mapbox { position: absolute; right: var(--gut-r); top: var(--gut-t); width: 168px; display: grid; gap: 6px; justify-items: end; }
#minimap { width: 152px; height: 152px; border-radius: 50%; border: 1px solid var(--line-strong); background: rgba(5,8,12,0.7); display: block; }
#floorlabel { padding: 5px 10px; text-align: right; font-size: 12px; color: var(--muted); max-width: 168px; }
#floorlabel strong { display: block; color: var(--text); font-family: var(--font-title-ko); font-size: 14px; }

#skillbar { position: absolute; left: 50%; bottom: var(--gut-b); transform: translateX(-50%); display: flex; gap: 8px; align-items: flex-end; }
.slot { position: relative; width: 54px; height: 54px; display: grid; place-items: center; text-align: center; padding: 4px; font-size: 10.5px; line-height: 1.15; overflow: hidden; }
.slot .key { position: absolute; left: 5px; top: 3px; font-family: var(--font-display); color: var(--brass); font-size: 11px; }
.slot .nm { margin-top: 8px; }
.slot .cd { position: absolute; inset: auto 0 0 0; height: 0%; background: rgba(0,0,0,0.62); }
.slot .cdt { position: absolute; inset: 0; display: grid; place-items: center; font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; text-shadow: 0 1px 3px #000; }
.slot.off { opacity: 0.35; }
.slot.sel { border-color: var(--brass); }
.slot.potion .nm { font-size: 18px; margin-top: 6px; font-variant-numeric: tabular-nums; }

#crosshair { position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: rgba(255,255,255,0.8); box-shadow: 0 0 0 1px rgba(0,0,0,0.5); }
#callout { position: absolute; left: 50%; top: 40%; transform: translateX(-50%); font-family: var(--font-title-ko); font-weight: 700; font-size: clamp(20px, 2.6vw, 30px); letter-spacing: 0.08em; text-shadow: 0 0 14px currentColor, 0 2px 6px #000; opacity: 0; white-space: nowrap; }
#callout.show { animation: callout 0.9s ease-out; }
@keyframes callout { 0% { opacity: 0; transform: translate(-50%, 8px) scale(0.9); } 15% { opacity: 1; transform: translate(-50%, 0) scale(1.05); } 70% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -10px); } }
#prompt { position: absolute; left: 50%; top: 62%; transform: translateX(-50%); padding: 8px 14px; font-size: 14px; white-space: nowrap; }
#prompt kbd { font-family: var(--font-display); color: var(--ink); background: var(--brass); padding: 0 6px; margin-right: 6px; }

#bossbar { position: absolute; left: 50%; top: var(--gut-t); transform: translateX(-50%); width: min(560px, calc(100vw - 760px)); min-width: 240px; padding: 8px 12px; display: grid; gap: 5px; }
#bossname { font-family: var(--font-title-ko); font-weight: 700; display: flex; justify-content: space-between; gap: 10px; }
#bossname span:last-child { color: var(--muted); font-family: var(--font-ui); font-weight: 400; font-size: 12px; white-space: nowrap; }
#bossbars { display: flex; gap: 4px; }
#bossbars .bar { flex: 1; height: 10px; }
#bossbars .bar > i { background: var(--hp-low); }

#toasts { position: absolute; left: var(--gut-l); bottom: calc(var(--gut-b) + 84px); display: flex; flex-direction: column-reverse; gap: 4px; max-width: min(420px, 60vw); }
.toast { padding: 5px 10px; font-size: 13px; background: rgba(10,14,20,0.78); border-left: 2px solid var(--brass); animation: toastIn 0.25s ease; }
@keyframes toastIn { from { transform: translateX(-12px); opacity: 0 } to { transform: none; opacity: 1 } }

#banner { position: absolute; left: 0; right: 0; top: 24%; text-align: center; pointer-events: none; transition: opacity 0.5s; padding-left: var(--gut-l); padding-right: var(--gut-r); }
#banner .t { font-family: var(--font-title-ko); font-weight: 700; font-size: clamp(28px, 5vw, 54px); letter-spacing: 0.04em; text-shadow: 0 2px 18px rgba(0,0,0,0.7); text-wrap: balance; }
#banner .s { margin-top: 6px; font-family: var(--font-display); color: var(--brass); letter-spacing: 0.3em; font-size: clamp(12px, 1.6vw, 16px); text-shadow: 0 1px 8px #000; }
#vignette { position: absolute; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(ellipse at center, transparent 45%, rgba(170, 10, 10, 0.75) 100%); transition: opacity 0.15s; }
#fps { position: absolute; right: var(--gut-r); bottom: var(--gut-b); font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* ---------- Menu ---------- */
#menu { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(4,6,10,0.55); padding: var(--gut-t) var(--gut-r) var(--gut-b) var(--gut-l); }
#menu .panel { --cut: 14px; width: min(620px, 100%); max-height: min(86vh, 760px); display: flex; flex-direction: column; background: rgba(12,17,25,0.94); }
#menu header { padding: 18px 22px 12px; border-bottom: 1px solid var(--line); }
#menu h2 { margin: 0; font-family: var(--font-title-ko); font-size: 22px; text-wrap: balance; }
#menu header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
#menu .list { overflow-y: auto; padding: 8px 10px 12px; display: flex; flex-direction: column; gap: 2px; }
#menu .item { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; text-align: left; background: transparent; border: 1px solid transparent; padding: 9px 12px; cursor: pointer; }
#menu .item:hover:not(:disabled), #menu .item.focus { background: rgba(227,192,112,0.1); border-color: var(--line-strong); }
#menu .item:disabled { opacity: 0.4; cursor: default; }
#menu .item .l { font-size: 15px; min-width: 0; }
#menu .item .r { color: var(--brass); font-size: 13px; text-align: right; white-space: nowrap; align-self: center; font-variant-numeric: tabular-nums; }
#menu .item .d { grid-column: 1 / -1; color: var(--muted); font-size: 12.5px; }
#menu .text { padding: 6px 12px; color: var(--muted); font-size: 13.5px; line-height: 1.6; white-space: pre-wrap; }
#menu .text.head { color: var(--brass); font-family: var(--font-display); letter-spacing: 0.12em; font-size: 12px; padding-top: 12px; }
#menu textarea { width: 100%; box-sizing: border-box; min-height: 90px; background: #070a0f; color: var(--text); border: 1px solid var(--line); font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; padding: 8px; user-select: text; -webkit-user-select: text; }
#menu footer { padding: 10px 22px 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

/* ---------- Title ---------- */
#title { position: absolute; inset: 0; display: grid; align-content: center; justify-items: start; padding: var(--gut-t) var(--gut-r) var(--gut-b) var(--gut-l);
  background: linear-gradient(90deg, rgba(5,8,12,0.88) 0%, rgba(5,8,12,0.55) 38%, rgba(5,8,12,0) 70%); }
#title .inner { width: min(460px, 100%); padding-left: clamp(0px, 5vw, 64px); display: grid; gap: 22px; }
#title .eyebrow { font-family: var(--font-display); color: var(--brass); letter-spacing: 0.38em; font-size: 13px; }
#title h1 { margin: 6px 0 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(52px, 9vw, 104px); line-height: 1; letter-spacing: 0.02em; text-shadow: 0 4px 30px rgba(0,0,0,0.6); }
#title .sub { font-family: var(--font-title-ko); font-size: clamp(16px, 2vw, 20px); line-height: 1.5; color: #d5dde8; margin-top: 14px; text-wrap: balance; }
#title .btns { display: grid; gap: 8px; }
.tbtn { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 13px 18px; background: rgba(12,17,25,0.82); border: 1px solid var(--line); cursor: pointer; font-size: 15px; text-align: left;
  clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); }
.tbtn:hover:not(:disabled) { border-color: var(--brass); background: rgba(227,192,112,0.12); }
.tbtn small { color: var(--muted); font-size: 12px; }
.tbtn.primary { border-color: var(--line-strong); }
.tbtn:disabled { opacity: 0.4; cursor: default; }
#newgame { display: grid; gap: 10px; padding: 16px; }
#newgame label { display: grid; gap: 6px; font-size: 13px; color: var(--muted); }
#newgame input[type=text] { background: #070a0f; border: 1px solid var(--line); color: var(--text); font: inherit; font-size: 16px; padding: 10px 12px; user-select: text; -webkit-user-select: text; }
#newgame .chk { display: flex; gap: 10px; align-items: flex-start; grid-template-columns: none; color: var(--text); }
#newgame .chk input { margin-top: 3px; accent-color: var(--danger); }
#newgame .chk small { display: block; color: var(--muted); }
#title .foot { color: var(--muted); font-size: 12px; line-height: 1.6; }
#loading { position: absolute; inset: 0; display: grid; place-items: center; background: var(--ink); font-family: var(--font-title-ko); font-size: 18px; color: var(--muted); }
#loading .t { display: grid; gap: 8px; justify-items: center; }
#loading .t b { font-family: var(--font-display); color: var(--brass); letter-spacing: 0.3em; font-weight: 400; font-size: 13px; }

/* ---------- Touch ---------- */
#touch { position: absolute; inset: 0; pointer-events: none; }
#touch .pad { position: absolute; left: calc(var(--gut-l) + 8px); bottom: calc(var(--gut-b) + 8px); width: 128px; height: 128px; border-radius: 50%; border: 1px solid var(--line); background: rgba(10,14,20,0.35); pointer-events: auto; }
#touch .knob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: rgba(227,192,112,0.35); border: 1px solid var(--line-strong); }
#touch .tb { position: absolute; pointer-events: auto; width: 54px; height: 54px; border-radius: 50%; border: 1px solid var(--line); background: rgba(10,14,20,0.5); font-size: 12px; display: grid; place-items: center; padding: 0; }
#touch .tb.big { width: 78px; height: 78px; font-size: 15px; border-color: var(--line-strong); }
#touch .tb:active, #touch .tb.on { background: rgba(227,192,112,0.35); }
#touch .tb[hidden] { display: none !important; }
#touchtop { position: absolute; top: calc(var(--gut-t) + 160px); right: var(--gut-r); display: grid; gap: 8px; pointer-events: auto; }
#touchtop button { width: 46px; height: 34px; border: 1px solid var(--line); background: rgba(10,14,20,0.6); font-size: 12px; }

@media (max-width: 1100px) { #bossbar { top: calc(var(--gut-t) + 132px); width: min(560px, calc(100vw - 32px)); } }
@media (max-width: 720px) {
  #minimap { width: 104px; height: 104px; }
  #mapbox { width: 118px; }
  #floorlabel { font-size: 11px; }
  #status { width: calc(100vw - 150px); min-width: 0; padding: 7px 10px; }
  #bossbar { top: calc(var(--gut-t) + 92px); width: calc(100vw - 32px); min-width: 0; }
  #skillbar { left: auto; right: var(--gut-r); transform: none; bottom: calc(var(--gut-b) + 96px); flex-direction: column; gap: 6px; }
  #skillbar .slot { width: 46px; height: 46px; font-size: 9.5px; }
  #toasts { bottom: calc(var(--gut-b) + 150px); }
  body.touch #skillbar { display: none; }
}
body.touch #skillbar { display: none; }
body.touch #toasts { top: calc(var(--gut-t) + 128px); bottom: auto; flex-direction: column; max-width: min(360px, 55vw); }
body.touch #prompt { display: none; }
@media (max-height: 520px) {
  #title .inner { gap: 12px; }
  #title h1 { font-size: clamp(40px, 12vh, 64px); }
  #title .sub { margin-top: 6px; font-size: 14px; }
  .tbtn { padding: 9px 14px; font-size: 14px; }
  #title .foot { display: none; }
  #touchtop { top: var(--gut-t); right: calc(var(--gut-r) + 176px); grid-auto-flow: column; }
  body.touch #toasts { top: calc(var(--gut-t) + 120px); }
}
@media (prefers-reduced-motion: reduce) { .toast { animation: none; } }
</style>
</head>
<body>
<div id="app">
  <canvas id="view" tabindex="0" aria-label="게임 화면"></canvas>

  <div id="hud" hidden>
    <div id="vignette"></div>
    <div id="status" class="plate">
      <div class="row1"><span id="pname">-</span><span id="plevel">LV 1</span></div>
      <div class="bar" id="hpbar"><b></b><i></i></div>
      <div id="hptext"><span id="hpnum">100 / 100</span><span id="colnum">0 Col</span></div>
      <div class="bar exp" id="expbar"><i></i></div>
      <div id="buffs"></div>
    </div>
    <div id="mapbox">
      <canvas id="minimap" width="304" height="304"></canvas>
      <div id="floorlabel" class="plate"><strong id="floorname">제 1층</strong><span id="areaname">-</span></div>
    </div>
    <div id="bossbar" class="plate" hidden>
      <div id="bossname"><span id="bossnm">-</span><span id="bosslv">-</span></div>
      <div id="bossbars"></div>
    </div>
    <div id="crosshair"></div>
    <div id="callout"></div>
    <div id="prompt" class="plate" hidden></div>
    <div id="skillbar"></div>
    <div id="toasts"></div>
    <div id="banner" style="opacity:0"><div class="t"></div><div class="s"></div></div>
    <div id="fps" hidden></div>
  </div>

  <div id="touch" hidden>
    <div class="pad" id="tpad"><div class="knob" id="tknob"></div></div>
    <button class="tb big" id="t-atk" style="right:calc(var(--gut-r) + 18px);bottom:calc(var(--gut-b) + 26px)">공격</button>
    <button class="tb" id="t-s1" style="right:calc(var(--gut-r) + 110px);bottom:calc(var(--gut-b) + 14px)">1</button>
    <button class="tb" id="t-s2" style="right:calc(var(--gut-r) + 112px);bottom:calc(var(--gut-b) + 78px)">2</button>
    <button class="tb" id="t-s3" style="right:calc(var(--gut-r) + 62px);bottom:calc(var(--gut-b) + 124px)">3</button>
    <button class="tb" id="t-s4" style="right:calc(var(--gut-r) + 2px);bottom:calc(var(--gut-b) + 124px)">4</button>
    <button class="tb" id="t-dodge" style="right:calc(var(--gut-r) + 176px);bottom:calc(var(--gut-b) + 22px)">회피</button>
    <button class="tb" id="t-guard" style="right:calc(var(--gut-r) + 176px);bottom:calc(var(--gut-b) + 86px)">방어</button>
    <button class="tb" id="t-use" style="right:calc(var(--gut-r) + 34px);bottom:calc(var(--gut-b) + 190px)" hidden>대화</button>
    <div id="touchtop">
      <button id="t-menu">메뉴</button>
      <button id="t-pot">물약</button>
      <button id="t-map">지도</button>
      <button id="t-jump">점프</button>
    </div>
  </div>

  <div id="menu" hidden>
    <div class="panel plate" role="dialog" aria-modal="true" aria-labelledby="menutitle">
      <header><h2 id="menutitle">메뉴</h2><p id="menusub"></p></header>
      <div class="list" id="menulist"></div>
      <footer><span id="menuhint">↑↓ 선택 · Enter 확인 · Esc 뒤로</span><span id="menuright"></span></footer>
    </div>
  </div>

  <div id="title" hidden>
    <div class="inner">
      <div>
        <div class="eyebrow">THE HUNDRED FLOORS</div>
        <h1>Skyspire</h1>
        <div class="sub">구름 위에 떠 있는 100층의 성. 꼭대기까지 검 한 자루로 오른다.</div>
      </div>
      <div class="btns" id="titlebtns">
        <button class="tbtn primary" id="b-continue"><span>이어하기</span><small id="contInfo"></small></button>
        <button class="tbtn" id="b-new"><span>새로 시작</span><small>캐릭터 만들기</small></button>
        <button class="tbtn" id="b-vr" hidden><span>VR로 입장</span><small>WebXR 헤드셋</small></button>
        <button class="tbtn" id="b-help"><span>조작법</span><small>키보드 · 터치 · VR</small></button>
        <button class="tbtn" id="b-import"><span>저장 코드 불러오기</span><small>다른 기기에서 옮기기</small></button>
      </div>
      <form id="newgame" class="plate" hidden>
        <label for="ng-name">검사의 이름
          <input type="text" id="ng-name" maxlength="12" placeholder="예: 하늘검" autocomplete="off">
        </label>
        <label class="chk" for="ng-hard"><input type="checkbox" id="ng-hard"><span>하드코어<small>한 번 죽으면 저장 데이터가 삭제됩니다.</small></span></label>
        <button class="tbtn primary" type="submit" id="ng-go"><span>제 1층으로</span><small>시작</small></button>
        <button class="tbtn" type="button" id="ng-back"><span>돌아가기</span></button>
      </form>
      <div class="foot">PC: 클릭해서 시작, WASD 이동, 마우스 공격 · 휴대폰: 화면 버튼 · VR: Quest 브라우저 등 WebXR 지원 기기</div>
    </div>
  </div>

  <div id="loading"><div class="t"><b>SKYSPIRE</b><span id="loadtext">성을 불러오는 중…</span></div></div>
</div>
<script type="module">

import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const TAU = Math.PI * 2;
const DEG = Math.PI / 180;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const invLerp = (a, b, v) => clamp((v - a) / (b - a), 0, 1);
const smoothstep = (a, b, v) => { const t = invLerp(a, b, v); return t * t * (3 - 2 * t); };
const easeOut = (t) => 1 - (1 - t) * (1 - t);
const easeInOut = (t) => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
const angDiff = (a, b) => { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; };
const fmt = (n) => Math.round(n).toLocaleString('ko-KR');
const $ = (id) => document.getElementById(id);

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hashInt(n) {
  n = Math.imul(n ^ 0x9e3779b9, 0x85ebca6b);
  n ^= n >>> 13; n = Math.imul(n, 0xc2b2ae35); n ^= n >>> 16;
  return n >>> 0;
}
class RNG {
  constructor(seed) { this.f = mulberry32(seed >>> 0); }
  next() { return this.f(); }
  range(a, b) { return a + (b - a) * this.f(); }
  int(a, b) { return Math.floor(a + (b - a + 1) * this.f()); }
  pick(arr) { return arr[Math.floor(this.f() * arr.length)]; }
  chance(p) { return this.f() < p; }
  weighted(entries) { // [[value, weight], ...]
    let total = 0; for (const e of entries) total += e[1];
    let r = this.f() * total;
    for (const e of entries) { r -= e[1]; if (r <= 0) return e[0]; }
    return entries[entries.length - 1][0];
  }
}
const rng = new RNG((Date.now() ^ (Math.random() * 1e9)) >>> 0);

function makeNoise2D(seed) {
  const r = mulberry32(seed);
  const perm = new Uint8Array(512);
  const p = []; for (let i = 0; i < 256; i++) p.push(i);
  for (let i = 255; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = p[i]; p[i] = p[j]; p[j] = t; }
  for (let i = 0; i < 512; i++) perm[i] = p[i & 255];
  const grad = (h, x, y) => {
    switch (h & 7) {
      case 0: return x + y; case 1: return -x + y; case 2: return x - y; case 3: return -x - y;
      case 4: return x; case 5: return -x; case 6: return y; default: return -y;
    }
  };
  const fade = (t) => t * t * t * (t * (t * 6 - 15) + 10);
  return (x, y) => {
    let X = Math.floor(x), Y = Math.floor(y);
    x -= X; y -= Y; X &= 255; Y &= 255;
    const u = fade(x), v = fade(y);
    const a = perm[X] + Y, b = perm[X + 1] + Y;
    return lerp(lerp(grad(perm[a], x, y), grad(perm[b], x - 1, y), u),
      lerp(grad(perm[a + 1], x, y - 1), grad(perm[b + 1], x - 1, y - 1), u), v) * 0.9;
  };
}
function fbm(n, x, y, oct = 4, lac = 2, gain = 0.5) {
  let s = 0, a = 1, f = 1, norm = 0;
  for (let i = 0; i < oct; i++) { s += a * n(x * f, y * f); norm += a; a *= gain; f *= lac; }
  return s / norm;
}
function ridged(n, x, y, oct = 3) {
  let s = 0, a = 0.5, f = 1;
  for (let i = 0; i < oct; i++) { const v = 1 - Math.abs(n(x * f, y * f)); s += v * v * a; a *= 0.5; f *= 2.1; }
  return s;
}

}

const BAL = {
  rec: (f) => Math.round(2 + f * 1.6),             // 층별 권장 레벨
  enemyHP: (L) => 30 * (1 + 0.35 * L) * Math.pow(1.045, L) * (1 + 0.006 * L),
  enemyAtk: (L) => 10 * (1 + 0.3 * L) * Math.pow(1.04, L) * (1 + 0.004 * L),
  enemyDef: (L) => 4 * (1 + 0.3 * L) * Math.pow(1.045, L),
  enemyExp: (L) => 10 * (1 + 0.5 * L) * Math.pow(1.05, L),
  enemyCol: (L) => 5 * (1 + 0.4 * L) * Math.pow(1.045, L),
  expNext: (lv) => 50 * (1 + 0.6 * lv) * Math.pow(1.072, lv),
  playerHP: (lv) => 100 * (1 + 0.3 * lv) * Math.pow(1.04, lv),
  weaponAtk: (il) => 12 * (1 + 0.3 * il) * Math.pow(1.045, il),
  armorDef: (il) => 6 * (1 + 0.3 * il) * Math.pow(1.045, il),
  statPerLevel: 2,
  bossHP: 24, bossAtk: 1.5, bossDef: 1.3,
  eliteHP: 9, eliteAtk: 1.5,
  dropGear: 0.06, dropMat: 0.4, dropOre: 0.08,
  rarityWeights: [[0, 600], [1, 260], [2, 110], [3, 25], [4, 5]],
  enhanceRate: [1, 0.95, 0.9, 0.8, 0.7, 0.6, 0.5, 0.4, 0.3, 0.2], // +1..+10
};
// 공격력 대비 방어력으로 받는 피해를 줄인다.
function mitigate(atk, def) { return atk * (1.5 * atk) / (1.5 * atk + def); }

const MATERIAL_TIERS = [[1, '녹슨'], [6, '철제'], [14, '강철'], [26, '은빛'], [40, '미스릴'], [58, '흑요석'], [78, '용린'], [100, '성광'], [125, '천공'], [150, '영원']];

function makeName(r, syl, min, max) { const n = r.int(min, max); let s = ''; for (let i = 0; i < n; i++) s += r.pick(syl); return s; }

let uidCounter = 1;
function newUid() { return Date.now().toString(36) + (uidCounter++).toString(36) + Math.floor(Math.random() * 1e4).toString(36); }

function makeWeapon(il, r, type, legendName) {
  type = type || WEAPON_KEYS[Math.floor(Math.random() * WEAPON_KEYS.length)];
  const it = { uid: newUid(), kind: 'weapon', type, il: Math.max(1, Math.round(il)), r, plus: 0 };
  it.name = legendName || (r === 4 ? LEGEND_WEAPON[Math.floor(Math.random() * LEGEND_WEAPON.length)] : `${tierName(it.il)} ${WEAPONS[type].name}`);
  if (r >= 3) it.critB = r === 4 ? 0.06 : 0.03;
  return it;
}
function makeArmor(il, r) {
  const it = { uid: newUid(), kind: 'armor', il: Math.max(1, Math.round(il)), r, plus: 0 };
  it.name = r === 4 ? LEGEND_ARMOR[Math.floor(Math.random() * LEGEND_ARMOR.length)] : `${tierName(it.il)} ${ARMOR_NAMES[Math.floor(Math.random() * ARMOR_NAMES.length)]}`;
  if (r >= 3) it.hpB = r === 4 ? 0.1 : 0.05;
  return it;
}
function itemAtk(it) { return Math.round(BAL.weaponAtk(it.il) * WEAPONS[it.type].atk * RARITY[it.r].mult * (1 + 0.07 * it.plus)); }
function itemDef(it) { return Math.round(BAL.armorDef(it.il) * RARITY[it.r].mult * (1 + 0.07 * it.plus)); }
function itemPower(it) { return it.kind === 'weapon' ? itemAtk(it) : itemDef(it); }
function itemPrice(it) { return Math.round(BAL.enemyCol(it.il) * 6 * Math.pow(RARITY[it.r].mult, 3) * (1 + 0.15 * it.plus)); }
function itemLabel(it) { return `${it.name}${it.plus ? ' +' + it.plus : ''}`; }
function rollRarity(bonus = 0) {
  const w = BAL.rarityWeights.map(([r, wt]) => [r, r === 0 ? Math.max(50, wt - bonus * 10) : wt * (1 + bonus * 0.25 * r)]);
  return rng.weighted(w);
}
function potionPrice(lv) { return Math.max(10, Math.round(BAL.enemyCol(lv) * 2.5)); }
function orePrice(lv) { return Math.max(60, Math.round(BAL.enemyCol(lv) * 14)); }

// 층마다 고정된 퀘스트 3개
function floorQuests(f) {
  const r = new RNG(floorSeed(f) ^ 0xabc);
  const T = themeForFloor(f);
  const arch = r.pick(T.enemies);
  return [
    { id: `${f}-k`, type: 'kill', arch, count: r.int(8, 14) + Math.floor(f / 12), title: `${T.prefix} ${ARCH[arch].name} 토벌` },
    { id: `${f}-c`, type: 'collect', mat: T.mat, count: r.int(5, 9) + Math.floor(f / 15), title: `${T.mat} 모으기` },
    { id: `${f}-e`, type: 'elite', count: 1, title: '네임드 몬스터 처치' },
  ];
}

// ===== 02_audio.js =====
// ---------------------------------------------------------------------------
// 소리: 전부 Web Audio로 즉석 합성한다(외부 파일 없음).
// ---------------------------------------------------------------------------
const Sfx = {
  ctx: null, master: null, sfx: null, music: null, noiseBuf: null,
  musicState: { mode: null, timer: 0, chord: 0, nodes: [], nextNote: 0, beat: 0 },

  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { this.ctx = new AC(); } catch (e) { return; }
    const c = this.ctx;
    this.master = c.createGain();
    const comp = c.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 4;
    this.master.connect(comp); comp.connect(c.destination);
    this.sfx = c.createGain(); this.sfx.connect(this.master);
    this.music = c.createGain(); this.music.connect(this.master);
    // 리버브(짧은 잡음 임펄스)
    const len = c.sampleRate * 1.8;
    const ir = c.createBuffer(2, len, c.sampleRate);
    for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3); }
    this.reverb = c.createConvolver(); this.reverb.buffer = ir;
    this.revGain = c.createGain(); this.revGain.gain.value = 0.25;
    this.reverb.connect(this.revGain); this.revGain.connect(this.master);
    this.music.connect(this.reverb);
    const nb = c.createBuffer(1, c.sampleRate * 1.5, c.sampleRate);
    const nd = nb.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    this.noiseBuf = nb;
    this.applyVolume();
  },
  applyVolume() {
    if (!this.ctx) return;
    this.master.gain.value = G.settings.volume;
    this.music.gain.value = G.settings.music * 0.55;
  },
  now() { return this.ctx ? this.ctx.currentTime : 0; },
  pan(p) {
    if (!this.ctx.createStereoPanner) return this.sfx;
    const n = this.ctx.createStereoPanner(); n.pan.value = clamp(p, -1, 1); n.connect(this.sfx); return n;
  },
  noise(dur, o = {}) {
    if (!this.ctx) return;
    const c = this.ctx, t = this.now() + (o.delay || 0);
    const src = c.createBufferSource(); src.buffer = this.noiseBuf;
    const f = c.createBiquadFilter(); f.type = o.type || 'bandpass'; f.Q.value = o.q || 1;
    f.frequency.setValueAtTime(o.freq || 1000, t);
    if (o.to) f.frequency.exponentialRampToValueAtTime(o.to, t + dur);
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(o.gain || 0.3, t + (o.attack || 0.01));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(o.pan !== undefined ? this.pan(o.pan) : this.sfx);
    if (o.rev) g.connect(this.reverb);
    src.start(t, Math.random() * 0.5); src.stop(t + dur + 0.05);
  },
  tone(freq, dur, o = {}) {
    if (!this.ctx) return;
    const c = this.ctx, t = this.now() + (o.delay || 0);
    const osc = c.createOscillator(); osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(freq, t);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + dur);
    if (o.detune) osc.detune.value = o.detune;
    const g = c.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(o.gain || 0.2, t + (o.attack || 0.008));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g); g.connect(o.pan !== undefined ? this.pan(o.pan) : (o.dest || this.sfx));
    if (o.rev) g.connect(this.reverb);
    osc.start(t); osc.stop(t + dur + 0.05);
  },
  swing(power = 1) { this.noise(0.2 + 0.08 * power, { freq: 600, to: 2400 + 800 * power, q: 1.2, gain: 0.16 * power, attack: 0.05 }); },
  hit(crit, pan = 0) {
    this.noise(0.12, { freq: 1800, to: 500, q: 0.8, gain: 0.5, pan });
    this.tone(crit ? 180 : 120, 0.14, { type: 'triangle', to: 50, gain: 0.5, pan });
    if (crit) this.tone(1800, 0.25, { type: 'square', to: 900, gain: 0.08, pan, rev: true });
  },
  block() { this.tone(900, 0.18, { type: 'square', to: 600, gain: 0.12 }); this.noise(0.1, { freq: 3000, gain: 0.25 }); },
  parry() { this.tone(1500, 0.5, { type: 'triangle', gain: 0.25, rev: true }); this.tone(2250, 0.5, { type: 'sine', gain: 0.15, rev: true }); },
  hurt() { this.tone(160, 0.25, { type: 'sawtooth', to: 70, gain: 0.25 }); this.noise(0.18, { freq: 500, gain: 0.35 }); },
  shatter(pan = 0) {
    for (let i = 0; i < 5; i++) this.tone(1200 + Math.random() * 2600, 0.35 + Math.random() * 0.4, { type: 'triangle', gain: 0.06, delay: i * 0.03, pan, rev: true });
    this.noise(0.5, { freq: 5000, to: 9000, q: 0.5, gain: 0.2, pan, rev: true });
  },
  skill(color = 0) {
    const base = 400 + (color % 7) * 60;
    this.tone(base, 0.4, { type: 'sawtooth', to: base * 2.5, gain: 0.08, rev: true });
    this.noise(0.35, { freq: 1500, to: 6000, q: 2, gain: 0.15 });
  },
  levelUp() { [0, 4, 7, 12, 16].forEach((s, i) => this.tone(440 * Math.pow(2, s / 12), 0.6, { type: 'triangle', gain: 0.16, delay: i * 0.09, rev: true })); },
  pickup() { this.tone(880, 0.12, { type: 'sine', gain: 0.12 }); this.tone(1320, 0.18, { type: 'sine', gain: 0.1, delay: 0.06 }); },
  click() { this.tone(660, 0.06, { type: 'square', gain: 0.05 }); },
  error() { this.tone(200, 0.2, { type: 'square', gain: 0.08 }); },
  portal() { this.tone(220, 1.4, { type: 'sine', to: 880, gain: 0.15, rev: true }); this.noise(1.2, { freq: 400, to: 4000, q: 3, gain: 0.12, rev: true }); },
  roar() { this.tone(90, 1.2, { type: 'sawtooth', to: 45, gain: 0.35 }); this.noise(1.0, { freq: 300, to: 120, q: 0.7, gain: 0.4 }); },
  step() { this.noise(0.07, { freq: 300 + Math.random() * 200, q: 1, gain: 0.05, type: 'lowpass' }); },
  enemyWindup(pan = 0) { this.tone(300, 0.3, { type: 'sawtooth', to: 500, gain: 0.04, pan }); },
  coin() { this.tone(1600, 0.08, { type: 'square', gain: 0.04 }); this.tone(2400, 0.12, { type: 'square', gain: 0.03, delay: 0.05 }); },
  enhance(ok) { if (ok) { this.tone(700, 0.3, { type: 'triangle', gain: 0.2 }); this.tone(1400, 0.6, { type: 'triangle', gain: 0.2, delay: 0.12, rev: true }); } else { this.noise(0.4, { freq: 800, to: 200, gain: 0.3 }); this.tone(150, 0.4, { type: 'square', gain: 0.1 }); } },

  // 배경 음악: 층 테마의 음계로 화음 패드와 짧은 아르페지오를 만든다.
  SCALES: { major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10], dorian: [0, 2, 3, 5, 7, 9, 10], phrygian: [0, 1, 3, 5, 7, 8, 10], lydian: [0, 2, 4, 6, 7, 9, 11] },
  setMusic(mode, theme) {
    const m = this.musicState;
    const key = mode + (theme ? theme.key : '');
    if (m.key === key) return;
    m.key = key; m.mode = mode; m.theme = theme; m.timer = 0; m.chord = 0; m.nextNote = 0; m.beat = 0;
    this.stopPad();
  },
  stopPad() {
    const m = this.musicState;
    if (!this.ctx) { m.nodes = []; return; }
    const t = this.now();
    for (const n of m.nodes) { try { n.g.gain.cancelScheduledValues(t); n.g.gain.setTargetAtTime(0.0001, t, 0.6); n.o.stop(t + 3); } catch (e) { /* 무시 */ } }
    m.nodes = [];
  },
  midi(n) { return 440 * Math.pow(2, (n - 69) / 12); },
  updateMusic(dt) {
    if (!this.ctx || G.settings.music <= 0) return;
    const m = this.musicState;
    if (!m.mode || !m.theme) return;
    const sc = this.SCALES[m.theme.music.scale] || this.SCALES.major;
    let root = m.theme.music.root;
    if (m.mode === 'dungeon') root -= 5;
    const prog = m.mode === 'boss' ? [0, 5, 3, 4] : m.mode === 'town' ? [0, 3, 4, 0] : [0, 5, 3, 4];
    const chordLen = m.mode === 'boss' ? 3.4 : 7;
    m.timer -= dt;
    if (m.timer <= 0) {
      m.timer = chordLen;
      this.stopPad();
      const deg = prog[m.chord % prog.length]; m.chord++;
      const notes = [0, 2, 4].map((k) => { const i = deg + k; return root + sc[i % 7] + 12 * Math.floor(i / 7); });
      notes.push(notes[0] - 12);
      const c = this.ctx, t = this.now();
      for (const n of notes) {
        for (const det of [-6, 6]) {
          const o = c.createOscillator(); o.type = m.mode === 'boss' ? 'sawtooth' : 'triangle';
          o.frequency.value = this.midi(n); o.detune.value = det;
          const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = m.mode === 'boss' ? 900 : 700;
          const g = c.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.setTargetAtTime(m.mode === 'boss' ? 0.03 : 0.035, t, 1.2);
          o.connect(f); f.connect(g); g.connect(this.music); o.start(t);
          m.nodes.push({ o, g });
        }
      }
      m.chordNotes = notes;
    }
    // 아르페지오 / 보스전 북소리
    m.nextNote -= dt;
    if (m.nextNote <= 0 && m.chordNotes) {
      if (m.mode === 'boss') {
        m.nextNote = 0.21; m.beat++;
        const n = m.chordNotes[m.beat % 3] + 12;
        this.tone(this.midi(n), 0.18, { type: 'square', gain: 0.03, dest: this.music });
        if (m.beat % 4 === 0) this.tone(60, 0.25, { type: 'sine', to: 35, gain: 0.35, dest: this.music });
        if (m.beat % 4 === 2) this.noiseTo(this.music, 0.12, 2500, 0.12);
      } else {
        m.nextNote = m.mode === 'town' ? 0.45 + Math.random() * 0.5 : 0.9 + Math.random() * 1.4;
        if (Math.random() < 0.75) {
          const i = Math.floor(Math.random() * 7);
          const n = root + 12 + sc[i];
          this.tone(this.midi(n), 1.6, { type: 'sine', gain: m.mode === 'dungeon' ? 0.025 : 0.04, dest: this.music, attack: 0.02 });
        }
      }
    }
  },
  noiseTo(dest, dur, freq, gain) {
    const c = this.ctx, t = this.now();
    const src = c.createBufferSource(); src.buffer = this.noiseBuf;
    const f = c.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = freq;
    const g = c.createGain(); g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f); f.connect(g); g.connect(dest); src.start(t); src.stop(t + dur + 0.05);
  },
};

// ===== 03_render.js =====
// ---------------------------------------------------------------------------
// 렌더러, 카메라, 하늘, 효과(파편, 불꽃, 검기 잔상, 피해 숫자)
// ---------------------------------------------------------------------------
const R = {
  renderer: null, scene: null, camera: null, rig: null, sun: null, hemi: null,
  sky: null, ceiling: null, timeU: { value: 0 }, envRT: null,
  quality: 'high',

  init() {
    const canvas = $('view');
    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
    } catch (e) {
      $('loadtext').textContent = 'WebGL을 사용할 수 없습니다. 하드웨어 가속을 켠 최신 브라우저에서 열어 주세요.';
      throw e;
    }
    this.renderer = renderer;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.xr.enabled = true;
    renderer.xr.setReferenceSpaceType('local-floor');

    this.scene = new THREE.Scene();
    this.camera = new THREE.PerspectiveCamera(72, 1, 0.05, 1400);
    this.rig = new THREE.Group();
    this.rig.add(this.camera);
    this.scene.add(this.rig);

    this.hemi = new THREE.HemisphereLight(0xffffff, 0x445533, 0.9);
    this.scene.add(this.hemi);
    this.sun = new THREE.DirectionalLight(0xffffff, 2.5);
    this.sun.castShadow = true;
    this.sun.shadow.bias = -0.0004;
    this.sun.shadow.normalBias = 0.04;
    const sc = this.sun.shadow.camera; sc.left = -45; sc.right = 45; sc.top = 45; sc.bottom = -45; sc.near = 1; sc.far = 260;
    this.scene.add(this.sun); this.scene.add(this.sun.target);
    // 플레이어 주변을 은은하게 밝히는 등불 (미궁에서 사용)
    this.lantern = new THREE.PointLight(0xffc890, 0, 16, 1.6);
    this.camera.add(this.lantern);

    this.buildSky();
    this.buildCeiling();
    FX.init(this.scene);
    this.applyQuality();
    window.addEventListener('resize', () => this.resize());
    this.resize();
  },

  detectQuality() {
    const mobile = /Android|iPhone|iPad|Quest|Mobile/i.test(navigator.userAgent);
    return mobile || G.touch ? 'low' : 'high';
  },
  applyQuality() {
    const q = G.settings.quality === 'auto' ? this.detectQuality() : G.settings.quality;
    this.quality = q;
    const pr = Math.min(window.devicePixelRatio || 1, q === 'high' ? 2 : q === 'medium' ? 1.5 : 1);
    this.renderer.setPixelRatio(pr);
    const size = q === 'high' ? 2048 : q === 'medium' ? 1536 : 1024;
    const shadows = q !== 'low';
    if (this.renderer.shadowMap.enabled !== shadows) {
      this.renderer.shadowMap.enabled = shadows;
      this.scene.traverse((o) => { if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach((m) => { m.needsUpdate = true; }); });
    }
    if (this.sun.shadow.mapSize.x !== size) {
      this.sun.shadow.mapSize.set(size, size);
      if (this.sun.shadow.map) { this.sun.shadow.map.dispose(); this.sun.shadow.map = null; }
    }
  },
  resize() {
    const w = window.innerWidth, h = window.innerHeight;
    this.renderer.setSize(w, h, false);
    this.camera.aspect = w / h;
    this.camera.updateProjectionMatrix();
  },

  buildSky() {
    const mat = new THREE.ShaderMaterial({
      side: THREE.BackSide, depthWrite: false, fog: false,
      uniforms: {
        top: { value: new THREE.Color() }, horizon: { value: new THREE.Color() }, bottom: { value: new THREE.Color() },
        cloud: { value: new THREE.Color() }, sunDir: { value: new THREE.Vector3(0, 1, 0) }, sunColor: { value: new THREE.Color() },
        time: this.timeU,
      },
      vertexShader: `varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
      fragmentShader: `
        uniform vec3 top, horizon, bottom, cloud, sunDir, sunColor; uniform float time; varying vec3 vDir;
        float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }
        float noise(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.0-2.0*f);
          return mix(mix(hash(i),hash(i+vec2(1,0)),u.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),u.x), u.y); }
        float fbm(vec2 p){ float s=0.0, a=0.5; for(int i=0;i<5;i++){ s+=a*noise(p); p*=2.03; a*=0.5; } return s; }
        void main(){
          vec3 d = normalize(vDir); float h = d.y;
          vec3 col = h > 0.0 ? mix(horizon, top, pow(clamp(h,0.0,1.0), 0.5)) : mix(horizon, bottom, pow(clamp(-h,0.0,1.0), 0.35));
          float sd = max(dot(d, normalize(sunDir)), 0.0);
          col += sunColor * (pow(sd, 900.0) * 6.0 + pow(sd, 10.0) * 0.22);
          // 발아래 구름 바다
          if (h < 0.06) {
            vec2 uv = d.xz / (abs(d.y) + 0.05) * 0.35 + vec2(time * 0.006, time * 0.003);
            float c = fbm(uv);
            float m = smoothstep(0.42, 0.75, c) * smoothstep(0.06, -0.12, h);
            col = mix(col, cloud * (0.75 + 0.35 * c), m * 0.92);
          }
          // 높은 구름
          if (h > 0.0) {
            vec2 uv = d.xz / (d.y + 0.25) * 1.2 + vec2(time * 0.01, 0.0);
            float c = fbm(uv * 1.3);
            col = mix(col, cloud, smoothstep(0.55, 0.85, c) * 0.45 * smoothstep(0.0, 0.2, h));
          }
          gl_FragColor = vec4(col, 1.0);
          #include <tonemapping_fragment>
          #include <colorspace_fragment>
        }`,
    });
    this.sky = new THREE.Mesh(new THREE.SphereGeometry(1100, 48, 24), mat);
    this.sky.renderOrder = -10;
    this.sky.frustumCulled = false;
    this.scene.add(this.sky);
  },

  // 위층의 바닥(부유성의 천장). 가장자리로 갈수록 투명해져 하늘이 보인다.
  buildCeiling() {
    const mat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, fog: false, side: THREE.DoubleSide,
      uniforms: { rock: { value: new THREE.Color(0x2a2a32) }, tint: { value: new THREE.Color(0x88aacc) }, vein: { value: new THREE.Color(0x88ddff) }, time: this.timeU },
      vertexShader: `varying vec2 vP; void main(){ vP = position.xy; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
      fragmentShader: `
        uniform vec3 rock, tint, vein; uniform float time; varying vec2 vP;
        float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }
        float noise(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.0-2.0*f);
          return mix(mix(hash(i),hash(i+vec2(1,0)),u.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),u.x), u.y); }
        float fbm(vec2 p){ float s=0.0, a=0.5; for(int i=0;i<5;i++){ s+=a*noise(p); p*=2.1; a*=0.5; } return s; }
        void main(){
          float r = length(vP);
          float n = fbm(vP * 0.008);
          float n2 = fbm(vP * 0.03 + 7.0);
          float v = 1.0 - smoothstep(0.0, 0.012, abs(fbm(vP * 0.015 + 3.0) - 0.5));
          vec3 col = mix(rock * (0.55 + n2 * 0.5), tint, 0.55 + n * 0.25);
          col += vein * v * 0.18 * (0.7 + 0.3 * sin(time * 0.6 + r * 0.02));
          float a = (1.0 - smoothstep(260.0, 520.0, r)) * 0.85;
          gl_FragColor = vec4(col, a);
          #include <tonemapping_fragment>
          #include <colorspace_fragment>
        }`,
    });
    this.ceiling = new THREE.Mesh(new THREE.CircleGeometry(600, 64), mat);
    this.ceiling.rotation.x = Math.PI / 2;
    this.ceiling.position.y = 320;
    this.ceiling.renderOrder = -9;
    this.scene.add(this.ceiling);
  },

  applyTheme(T, indoor) {
    const s = this.sky.material.uniforms;
    s.top.value.setHex(T.sky.top); s.horizon.value.setHex(T.sky.horizon); s.bottom.value.setHex(T.sky.bottom); s.cloud.value.setHex(T.sky.cloud);
    const el = T.sun.elev, az = T.sun.az;
    this.sunDir = new THREE.Vector3(Math.cos(az) * Math.cos(el), Math.sin(el), Math.sin(az) * Math.cos(el)).normalize();
    s.sunDir.value.copy(this.sunDir);
    s.sunColor.value.setHex(T.sun.color);
    const c = this.ceiling.material.uniforms;
    c.tint.value.setHex(T.sky.top).lerp(new THREE.Color(T.fog.color), 0.4);
    c.vein.value.setHex(T.dungeon.torch);
    this.ceiling.visible = !indoor && G.settings.ceiling;
    this.sky.visible = !indoor;
    if (indoor) {
      this.scene.fog = new THREE.Fog(T.dungeon.fog, 10, 60);
      this.scene.background = new THREE.Color(T.dungeon.fog);
      this.hemi.color.setHex(T.hemi.sky).lerp(new THREE.Color(T.dungeon.torch), 0.3); this.hemi.groundColor.setHex(T.dungeon.floor).multiplyScalar(1.4); this.hemi.intensity = 1.05;
      this.renderer.toneMappingExposure = 1.2;
      this.sun.intensity = 0.0; this.sun.castShadow = false;
      this.lantern.intensity = 4.5; this.lantern.distance = 24; this.lantern.color.setHex(T.dungeon.torch).lerp(new THREE.Color(0xffffff), 0.6);
      this.scene.environment = null;
    } else {
      this.scene.fog = new THREE.FogExp2(T.fog.color, T.fog.density);
      this.scene.background = new THREE.Color(T.fog.color);
      this.hemi.color.setHex(T.hemi.sky); this.hemi.groundColor.setHex(T.hemi.ground); this.hemi.intensity = T.hemi.intensity;
      this.sun.color.setHex(T.sun.color); this.sun.intensity = T.sun.intensity; this.sun.castShadow = true;
      this.lantern.intensity = 0;
      this.renderer.toneMappingExposure = 1.0;
      this.makeEnv();
    }
  },

  // 하늘을 환경맵으로 구워 금속 검과 갑옷에 반사가 생기게 한다.
  makeEnv() {
    try {
      const pm = new THREE.PMREMGenerator(this.renderer);
      const sc = new THREE.Scene();
      const sky = new THREE.Mesh(new THREE.SphereGeometry(10, 32, 16), this.sky.material);
      sc.add(sky);
      if (this.envRT) this.envRT.dispose();
      this.envRT = pm.fromScene(sc, 0.04);
      this.scene.environment = this.envRT.texture;
      sky.geometry.dispose(); pm.dispose();
    } catch (e) { this.scene.environment = null; }
  },

  followSun(px, pz) {
    if (!this.sunDir) return;
    const d = this.sunDir;
    this.sun.position.set(px + d.x * 120, d.y * 120 + 20, pz + d.z * 120);
    this.sun.target.position.set(px, 0, pz);
  },
};

// ---------------------------------------------------------------------------
// 텍스처 도우미
// ---------------------------------------------------------------------------
const Tex = {
  cache: new Map(),
  canvas(w, h, draw, repeat) {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const g = c.getContext('2d'); draw(g, w, h);
    const t = new THREE.CanvasTexture(c);
    t.colorSpace = THREE.SRGBColorSpace;
    if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat, repeat); }
    t.anisotropy = 4;
    return t;
  },
  grain(seed = 1) {
    const r = mulberry32(seed);
    return this.canvas(256, 256, (g, w, h) => {
      const img = g.createImageData(w, h);
      const n = makeNoise2D(seed);
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
        const v = 0.82 + 0.12 * fbm(n, x / 32, y / 32, 3) + (r() - 0.5) * 0.1;
        const i = (y * w + x) * 4; const c = clamp(v * 255, 0, 255);
        img.data[i] = img.data[i + 1] = img.data[i + 2] = c; img.data[i + 3] = 255;
      }
      g.putImageData(img, 0, 0);
    });
  },
  stone(base = '#8a8478', seed = 3) {
    const r = mulberry32(seed);
    return this.canvas(256, 256, (g, w, h) => {
      g.fillStyle = base; g.fillRect(0, 0, w, h);
      const rows = 8, rh = h / rows;
      for (let y = 0; y < rows; y++) {
        let x = (y % 2) * -24;
        while (x < w) {
          const bw = 36 + r() * 30; const l = 0.78 + r() * 0.3;
          g.fillStyle = `rgba(${Math.floor(255 * l * 0.55)},${Math.floor(255 * l * 0.53)},${Math.floor(255 * l * 0.5)},0.55)`;
          g.fillRect(x + 2, y * rh + 2, bw - 4, rh - 4);
          x += bw;
        }
      }
      g.strokeStyle = 'rgba(0,0,0,0.35)'; g.lineWidth = 3;
      for (let y = 0; y <= rows; y++) { g.beginPath(); g.moveTo(0, y * rh); g.lineTo(w, y * rh); g.stroke(); }
      for (let i = 0; i < 1500; i++) { g.fillStyle = `rgba(0,0,0,${r() * 0.12})`; g.fillRect(r() * w, r() * h, 2, 2); }
    });
  },
  tiles(base = '#5a564e', seed = 5) {
    const r = mulberry32(seed);
    return this.canvas(256, 256, (g, w, h) => {
      g.fillStyle = base; g.fillRect(0, 0, w, h);
      const n = 4, s = w / n;
      for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
        const l = 0.8 + r() * 0.35;
        g.fillStyle = `rgba(255,255,255,${(l - 0.8) * 0.25})`; g.fillRect(x * s + 3, y * s + 3, s - 6, s - 6);
        g.fillStyle = `rgba(0,0,0,${0.1 + r() * 0.15})`; g.fillRect(x * s, y * s, s, 3); g.fillRect(x * s, y * s, 3, s);
      }
      for (let i = 0; i < 2500; i++) { g.fillStyle = `rgba(0,0,0,${r() * 0.1})`; g.fillRect(r() * w, r() * h, 2, 2); }
    });
  },
  // 이름표·피해 숫자용 글자 텍스처
  text(str, color = '#ffffff', size = 48, stroke = true) {
    const key = str + '|' + color + '|' + size;
    let t = this.cache.get(key);
    if (t) return t;
    const c = document.createElement('canvas');
    const g = c.getContext('2d');
    g.font = `700 ${size}px "IBM Plex Sans KR", system-ui, sans-serif`;
    const w = Math.ceil(g.measureText(str).width + size * 0.6), h = Math.ceil(size * 1.35);
    c.width = w; c.height = h;
    g.font = `700 ${size}px "IBM Plex Sans KR", system-ui, sans-serif`;
    g.textAlign = 'center'; g.textBaseline = 'middle';
    if (stroke) { g.lineWidth = size * 0.16; g.strokeStyle = 'rgba(0,0,0,0.85)'; g.strokeText(str, w / 2, h / 2); }
    g.fillStyle = color; g.fillText(str, w / 2, h / 2);
    t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
    t.userData = { w, h };
    if (this.cache.size > 400) { for (const [k, v] of this.cache) { v.dispose(); this.cache.delete(k); if (this.cache.size < 300) break; } }
    this.cache.set(key, t);
    return t;
  },
};

// ---------------------------------------------------------------------------
// 효과
// ---------------------------------------------------------------------------
const FX = {
  scene: null,
  init(scene) {
    this.scene = scene;
    this.initSparks();
    this.initShards();
    this.initWeather();
    this.texts = [];
    this.decals = [];
    this.rings = [];
    this.pillars = [];
  },

  // 불꽃 입자 (Points + 가산 혼합)
  initSparks() {
    const N = 900;
    this.spN = N; this.spI = 0;
    this.spPos = new Float32Array(N * 3); this.spVel = new Float32Array(N * 3);
    this.spCol = new Float32Array(N * 3); this.spLife = new Float32Array(N); this.spMax = new Float32Array(N); this.spSize = new Float32Array(N);
    this.spGrav = new Float32Array(N);
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(this.spPos, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(this.spCol, 3));
    geo.setAttribute('size', new THREE.BufferAttribute(this.spSize, 1));
    const mat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
      uniforms: { scale: { value: 600 } },
      vertexShader: `attribute float size; attribute vec3 color; varying vec3 vC; uniform float scale;
        void main(){ vC = color; vec4 mv = modelViewMatrix * vec4(position,1.0); gl_PointSize = size * scale / -mv.z; gl_Position = projectionMatrix * mv; }`,
      fragmentShader: `varying vec3 vC; void main(){ float r = length(gl_PointCoord - 0.5) * 2.0; float a = pow(max(1.0 - r, 0.0), 2.2); if (a < 0.01) discard; gl_FragColor = vec4(vC * a * 1.6, a); }`,
    });
    this.sparks = new THREE.Points(geo, mat);
    this.sparks.frustumCulled = false;
    this.scene.add(this.sparks);
  },
  burst(pos, color, count = 16, speed = 6, size = 0.18, life = 0.6, grav = 9) {
    const c = new THREE.Color(color);
    for (let k = 0; k < count; k++) {
      const i = this.spI; this.spI = (this.spI + 1) % this.spN;
      this.spPos[i * 3] = pos.x; this.spPos[i * 3 + 1] = pos.y; this.spPos[i * 3 + 2] = pos.z;
      const u = Math.random() * 2 - 1, th = Math.random() * TAU, s = speed * (0.35 + Math.random() * 0.65);
      const rr = Math.sqrt(1 - u * u);
      this.spVel[i * 3] = rr * Math.cos(th) * s; this.spVel[i * 3 + 1] = u * s + speed * 0.3; this.spVel[i * 3 + 2] = rr * Math.sin(th) * s;
      const l = 0.7 + Math.random() * 0.6;
      this.spCol[i * 3] = c.r * l; this.spCol[i * 3 + 1] = c.g * l; this.spCol[i * 3 + 2] = c.b * l;
      this.spLife[i] = this.spMax[i] = life * (0.6 + Math.random() * 0.6);
      this.spSize[i] = size * (0.6 + Math.random() * 0.8);
      this.spGrav[i] = grav;
    }
  },
  rise(pos, color, count, radius, height, life = 1.4) {
    const c = new THREE.Color(color);
    for (let k = 0; k < count; k++) {
      const i = this.spI; this.spI = (this.spI + 1) % this.spN;
      const a = Math.random() * TAU, r = Math.random() * radius;
      this.spPos[i * 3] = pos.x + Math.cos(a) * r; this.spPos[i * 3 + 1] = pos.y + Math.random() * 0.5; this.spPos[i * 3 + 2] = pos.z + Math.sin(a) * r;
      this.spVel[i * 3] = 0; this.spVel[i * 3 + 1] = height / life * (0.5 + Math.random()); this.spVel[i * 3 + 2] = 0;
      this.spCol[i * 3] = c.r; this.spCol[i * 3 + 1] = c.g; this.spCol[i * 3 + 2] = c.b;
      this.spLife[i] = this.spMax[i] = life * (0.5 + Math.random() * 0.5);
      this.spSize[i] = 0.12 + Math.random() * 0.12; this.spGrav[i] = 0;
    }
  },
  updateSparks(dt) {
    const N = this.spN;
    for (let i = 0; i < N; i++) {
      if (this.spLife[i] <= 0) { if (this.spSize[i] !== 0) this.spSize[i] = 0; continue; }
      this.spLife[i] -= dt;
      const t = Math.max(this.spLife[i], 0) / this.spMax[i];
      this.spVel[i * 3 + 1] -= this.spGrav[i] * dt;
      this.spVel[i * 3] *= 0.97; this.spVel[i * 3 + 2] *= 0.97;
      this.spPos[i * 3] += this.spVel[i * 3] * dt; this.spPos[i * 3 + 1] += this.spVel[i * 3 + 1] * dt; this.spPos[i * 3 + 2] += this.spVel[i * 3 + 2] * dt;
      if (this.spLife[i] <= 0) this.spSize[i] = 0;
      else this.spSize[i] *= 0.985 + 0.015 * t;
    }
    const g = this.sparks.geometry;
    g.attributes.position.needsUpdate = true; g.attributes.color.needsUpdate = true; g.attributes.size.needsUpdate = true;
    this.sparks.material.uniforms.scale.value = R.renderer.domElement.height * 0.45;
  },

  // 몬스터가 쓰러질 때 빛나는 다각형 조각으로 흩어지는 효과
  initShards() {
    const N = 600;
    const geo = new THREE.TetrahedronGeometry(0.16);
    const mat = new THREE.MeshBasicMaterial({ transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false });
    this.shards = new THREE.InstancedMesh(geo, mat, N);
    this.shards.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    this.shards.frustumCulled = false;
    this.shardData = [];
    const m = new THREE.Matrix4().makeScale(0, 0, 0);
    for (let i = 0; i < N; i++) {
      this.shards.setMatrixAt(i, m);
      this.shards.setColorAt(i, new THREE.Color(1, 1, 1));
      this.shardData.push({ life: 0, max: 1, p: new THREE.Vector3(), v: new THREE.Vector3(), q: new THREE.Quaternion(), w: new THREE.Vector3(), s: 1 });
    }
    this.shI = 0;
    this.scene.add(this.shards);
    this._m = new THREE.Matrix4(); this._q = new THREE.Quaternion(); this._s = new THREE.Vector3(); this._e = new THREE.Euler();
  },
  shatter(center, radius, height, color, count = 50) {
    const c = new THREE.Color(color);
    for (let k = 0; k < count; k++) {
      const i = this.shI; this.shI = (this.shI + 1) % this.shardData.length;
      const d = this.shardData[i];
      d.p.set(center.x + (Math.random() - 0.5) * radius * 1.6, center.y + Math.random() * height, center.z + (Math.random() - 0.5) * radius * 1.6);
      d.v.set(d.p.x - center.x, (Math.random() * 0.8 + 0.4) * 2, d.p.z - center.z).normalize().multiplyScalar(2 + Math.random() * 5);
      d.w.set(Math.random() * 8 - 4, Math.random() * 8 - 4, Math.random() * 8 - 4);
      d.q.random();
      d.life = d.max = 0.9 + Math.random() * 0.8;
      d.s = (0.6 + Math.random() * 1.2) * Math.max(0.7, radius * 0.8);
      const l = 0.7 + Math.random() * 0.6;
      this.shards.setColorAt(i, new THREE.Color(c.r * l + 0.2, c.g * l + 0.2, c.b * l + 0.25));
    }
    this.shards.instanceColor.needsUpdate = true;
  },
  updateShards(dt) {
    let any = false;
    for (let i = 0; i < this.shardData.length; i++) {
      const d = this.shardData[i];
      if (d.life <= 0) continue;
      any = true;
      d.life -= dt;
      d.v.y -= 2.5 * dt; d.v.multiplyScalar(0.985);
      d.p.addScaledVector(d.v, dt);
      this._e.set(d.w.x * dt, d.w.y * dt, d.w.z * dt); this._q.setFromEuler(this._e); d.q.multiply(this._q);
      const t = Math.max(d.life, 0) / d.max;
      this._s.setScalar(d.life > 0 ? d.s * t : 0);
      this._m.compose(d.p, d.q, this._s);
      this.shards.setMatrixAt(i, this._m);
    }
    if (any || this._shardDirty) { this.shards.instanceMatrix.needsUpdate = true; this._shardDirty = any; }
  },

  // 검기 잔상(리본)
  makeTrail(color) {
    const SEG = 16;
    const pos = new Float32Array(SEG * 2 * 3);
    const alpha = new Float32Array(SEG * 2);
    const idx = [];
    for (let i = 0; i < SEG - 1; i++) { const a = i * 2, b = a + 1, c = a + 2, d = a + 3; idx.push(a, b, c, b, d, c); }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('alpha', new THREE.BufferAttribute(alpha, 1));
    geo.setIndex(idx);
    const mat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
      uniforms: { color: { value: new THREE.Color(color) }, strength: { value: 0 } },
      vertexShader: `attribute float alpha; varying float vA; void main(){ vA = alpha; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
      fragmentShader: `uniform vec3 color; uniform float strength; varying float vA; void main(){ gl_FragColor = vec4(color * vA * strength, vA * strength); }`,
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.frustumCulled = false;
    mesh.renderOrder = 5;
    this.scene.add(mesh);
    return { mesh, SEG, pts: [], strength: 0 };
  },
  updateTrail(tr, base, tip, active, dt) {
    tr.pts.unshift([base.clone(), tip.clone()]);
    if (tr.pts.length > tr.SEG) tr.pts.length = tr.SEG;
    tr.strength = active ? Math.min(1, tr.strength + dt * 12) : Math.max(0, tr.strength - dt * 5);
    const pos = tr.mesh.geometry.attributes.position.array, al = tr.mesh.geometry.attributes.alpha.array;
    for (let i = 0; i < tr.SEG; i++) {
      const p = tr.pts[Math.min(i, tr.pts.length - 1)];
      pos.set([p[0].x, p[0].y, p[0].z], i * 6); pos.set([p[1].x, p[1].y, p[1].z], i * 6 + 3);
      const a = Math.pow(1 - i / tr.SEG, 2.0) * 0.55;
      al[i * 2] = 0; al[i * 2 + 1] = a;
    }
    tr.mesh.geometry.attributes.position.needsUpdate = true; tr.mesh.geometry.attributes.alpha.needsUpdate = true;
    tr.mesh.material.uniforms.strength.value = tr.strength;
    tr.mesh.visible = tr.strength > 0.01;
  },

  // 떠오르는 글자 (피해 숫자 등)
  text(str, pos, color = '#ffffff', size = 0.5, opts = {}) {
    const tex = Tex.text(str, color, 64);
    const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false, depthWrite: false });
    const sp = new THREE.Sprite(mat);
    const asp = tex.userData.w / tex.userData.h;
    sp.scale.set(size * asp, size, 1);
    sp.position.copy(pos);
    sp.renderOrder = 20;
    this.scene.add(sp);
    this.texts.push({ sp, life: opts.life || 0.9, max: opts.life || 0.9, vy: opts.vy ?? 1.6, vx: (Math.random() - 0.5) * 0.8, base: size });
    if (this.texts.length > 60) { const t = this.texts.shift(); this.scene.remove(t.sp); t.sp.material.dispose(); }
  },
  updateTexts(dt) {
    for (let i = this.texts.length - 1; i >= 0; i--) {
      const t = this.texts[i];
      t.life -= dt;
      t.sp.position.y += t.vy * dt; t.sp.position.x += t.vx * dt; t.vy *= 0.95;
      const k = t.life / t.max;
      t.sp.material.opacity = Math.min(1, k * 2.5);
      const pop = 1 + Math.max(0, (k - 0.8)) * 2;
      const asp = t.sp.material.map.userData.w / t.sp.material.map.userData.h;
      t.sp.scale.set(t.base * pop * asp, t.base * pop, 1);
      if (t.life <= 0) { this.scene.remove(t.sp); t.sp.material.dispose(); this.texts.splice(i, 1); }
    }
  },

  // 바닥 경고 표시 (원, 선, 지정 위치)
  decal(type, opts) {
    let geo;
    if (type === 'circle') geo = new THREE.RingGeometry(0, 1, 48);
    else geo = new THREE.PlaneGeometry(1, 1);
    const mat = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, side: THREE.DoubleSide,
      polygonOffset: true, polygonOffsetFactor: -4,
      uniforms: { prog: { value: 0 }, color: { value: new THREE.Color(opts.color || 0xff3a2a) }, kind: { value: type === 'circle' ? 0 : 1 } },
      vertexShader: `varying vec2 vUv; varying vec3 vP; void main(){ vUv = uv; vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
      fragmentShader: `uniform float prog; uniform vec3 color; uniform float kind; varying vec2 vUv; varying vec3 vP;
        void main(){
          float d = kind < 0.5 ? length(vP.xy) : vUv.y;
          float edge = kind < 0.5 ? smoothstep(0.9, 1.0, d) : (smoothstep(0.04, 0.0, vUv.x) + smoothstep(0.96, 1.0, vUv.x) + smoothstep(0.97, 1.0, vUv.y));
          float fill = step(d, prog) * 0.35;
          float a = clamp(edge * 0.8 + fill + 0.12, 0.0, 0.85);
          gl_FragColor = vec4(color, a);
        }`,
    });
    const m = new THREE.Mesh(geo, mat);
    m.rotation.x = -Math.PI / 2;
    m.renderOrder = 3;
    if (type === 'circle') { m.scale.set(opts.radius, opts.radius, 1); }
    else {
      // 선: 시작점에서 진행 방향으로 len, 폭 width
      m.geometry.translate(0, 0.5, 0);
      m.scale.set(opts.width, opts.len, 1);
      // yaw는 (sin, cos) 방향 규약. X축 -90° 회전 뒤 로컬 +Y가 그 방향을 향하도록.
      m.rotation.z = opts.yaw + Math.PI;
    }
    m.position.set(opts.x, opts.y + 0.08, opts.z);
    this.scene.add(m);
    const d = { m, t: 0, dur: opts.dur, followGround: opts.followGround };
    this.decals.push(d);
    return d;
  },
  removeDecal(d) {
    if (!d) return;
    const i = this.decals.indexOf(d); if (i >= 0) this.decals.splice(i, 1);
    this.scene.remove(d.m); d.m.geometry.dispose(); d.m.material.dispose();
  },
  updateDecals(dt) {
    for (let i = this.decals.length - 1; i >= 0; i--) {
      const d = this.decals[i];
      d.t += dt;
      d.m.material.uniforms.prog.value = clamp(d.t / d.dur, 0, 1);
      if (d.t > d.dur + 0.15) this.removeDecal(d);
    }
  },

  // 퍼지는 충격파 고리
  ring(pos, color, maxR = 5, dur = 0.5, y = 0.15) {
    const m = new THREE.Mesh(new THREE.RingGeometry(0.85, 1, 48), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }));
    m.rotation.x = -Math.PI / 2; m.position.set(pos.x, pos.y + y, pos.z);
    this.scene.add(m);
    this.rings.push({ m, t: 0, dur, maxR });
  },
  // 레벨 업 빛기둥
  pillar(pos, color) {
    const g = new THREE.CylinderGeometry(0.9, 0.9, 30, 24, 1, true); g.translate(0, 15, 0);
    const m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.5, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide }));
    m.position.copy(pos);
    this.scene.add(m);
    this.pillars.push({ m, t: 0, dur: 1.6 });
  },
  updateMisc(dt) {
    for (let i = this.rings.length - 1; i >= 0; i--) {
      const r = this.rings[i]; r.t += dt; const k = r.t / r.dur;
      r.m.scale.setScalar(0.2 + r.maxR * easeOut(Math.min(k, 1)));
      r.m.material.opacity = 0.9 * (1 - k);
      if (k >= 1) { this.scene.remove(r.m); r.m.geometry.dispose(); r.m.material.dispose(); this.rings.splice(i, 1); }
    }
    for (let i = this.pillars.length - 1; i >= 0; i--) {
      const p = this.pillars[i]; p.t += dt; const k = p.t / p.dur;
      p.m.scale.set(1 + k * 0.6, 1, 1 + k * 0.6);
      p.m.material.opacity = 0.55 * (1 - k);
      if (k >= 1) { this.scene.remove(p.m); p.m.geometry.dispose(); p.m.material.dispose(); this.pillars.splice(i, 1); }
    }
  },

  // 날씨: 플레이어 주위를 감싸는 입자 상자
  initWeather() {
    const N = 1400;
    const pos = new Float32Array(N * 3), seed = new Float32Array(N);
    for (let i = 0; i < N; i++) { pos[i * 3] = Math.random() * 60 - 30; pos[i * 3 + 1] = Math.random() * 30; pos[i * 3 + 2] = Math.random() * 60 - 30; seed[i] = Math.random(); }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('seed', new THREE.BufferAttribute(seed, 1));

      snow: [0xffffff, 2.0, 0.6, 0.1, false], spores: [0xd0ff80, 0.25, 0.4, 0.08, true], sparkle: [0x9ae8ff, 0.2, 0.3, 0.07, true],
      embers: [0xff7a2a, -1.2, 0.8, 0.08, true], petals: [0xffb8d8, 0.9, 1.2, 0.11, false], motes: [0xc890ff, -0.3, 0.4, 0.07, true],

// 지오메트리 병합 도우미: 여러 부품을 하나로 합치고 부품별 정점 색을 굽는다.
// ---------------------------------------------------------------------------
function mergeParts(parts) {
  // parts: [{geo, color, matrix}] -> 비색인 지오메트리 하나
  let total = 0;
  const prepared = parts.map((p) => {
    let g = p.geo.index ? p.geo.toNonIndexed() : p.geo.clone();
    if (p.matrix) g.applyMatrix4(p.matrix);
    total += g.attributes.position.count;
    return { g, color: new THREE.Color(p.color), emissive: p.emissive || 0, top: p.topColor ? new THREE.Color(p.topColor) : null };
  });
  const pos = new Float32Array(total * 3), col = new Float32Array(total * 3), em = new Float32Array(total);
  let o = 0;
  for (const p of prepared) {
    const a = p.g.attributes.position;
    let minY = Infinity, maxY = -Infinity;
    if (p.top) for (let i = 0; i < a.count; i++) { minY = Math.min(minY, a.getY(i)); maxY = Math.max(maxY, a.getY(i)); }
    for (let i = 0; i < a.count; i++) {
      pos[(o + i) * 3] = a.getX(i); pos[(o + i) * 3 + 1] = a.getY(i); pos[(o + i) * 3 + 2] = a.getZ(i);
      let c = p.color;
      if (p.top) { const k = (a.getY(i) - minY) / Math.max(1e-4, maxY - minY); c = p.color.clone().lerp(p.top, smoothstep(0.55, 0.95, k)); }
      col[(o + i) * 3] = c.r; col[(o + i) * 3 + 1] = c.g; col[(o + i) * 3 + 2] = c.b;
      em[o + i] = p.emissive;
    }
    o += a.count;
    p.g.dispose();
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  geo.setAttribute('emissiveMask', new THREE.BufferAttribute(em, 1));
  geo.computeVertexNormals();
  return geo;
}
function M4(x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0, sx = 1, sy = 1, sz = 1) {
  const m = new THREE.Matrix4();
  m.compose(new THREE.Vector3(x, y, z), new THREE.Quaternion().setFromEuler(new THREE.Euler(rx, ry, rz)), new THREE.Vector3(sx, sy, sz));
  return m;
}
// 정점별 emissiveMask 속성으로 일부만 빛나게 하는 재질
function glowMaterial(params = {}, glowColor = 0xffffff, glowStrength = 1.5) {
  const mat = new THREE.MeshStandardMaterial(Object.assign({ vertexColors: true, roughness: 0.85, metalness: 0.0, flatShading: true }, params));
  mat.onBeforeCompile = (sh) => {
    sh.uniforms.glowColor = { value: new THREE.Color(glowColor) };
    sh.uniforms.glowStrength = { value: glowStrength };
    sh.uniforms.uTime = R.timeU;
    sh.vertexShader = 'attribute float emissiveMask;\nvarying float vEm;\n' + sh.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\nvEm = emissiveMask;');
    sh.fragmentShader = 'uniform vec3 glowColor;\nuniform float glowStrength;\nuniform float uTime;\nvarying float vEm;\n' +
      sh.fragmentShader.replace('#include <emissivemap_fragment>', '#include <emissivemap_fragment>\ntotalEmissiveRadiance += vColor.rgb * vEm * glowStrength * (0.85 + 0.15 * sin(uTime * 2.0));');
  };
  return mat;
}
