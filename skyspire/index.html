// 몬스터
// ---------------------------------------------------------------------------
class Enemy {
  constructor(key, level, x, z, o = {}) {
    const A = ARCH[key], T = G.floor ? G.floor.T : THEMES[0];
    this.key = key; this.A = A; this.level = level;
    this.boss = !!o.boss; this.elite = !!o.elite; this.rare = !!o.rare; this.mini = !!o.mini; this.minion = !!o.minion;
    this.name = o.name || (this.boss ? o.bossName : `${T.prefix} ${A.name}`) + (this.mini ? ' (소)' : '') + (this.rare ? ' ✦' : '');
    this.scale = this.boss ? 2.5 : this.elite ? 1.55 : this.mini ? 0.55 : 1;
    const tint = new THREE.Color(T.ground.mid);
    const cols = A.colors.map((c, i) => (i < 2 ? new THREE.Color(c).lerp(tint, 0.18).getHex() : c));
    if (this.rare) { cols[0] = 0xffd24a; cols[1] = 0xb88a20; }
    if (this.elite) { cols[2] = 0xff3a3a; }
    this.rig = Ents.buildModel(key, cols, this.scale, { boss: this.boss, rare: this.rare });
    this.mult = this.boss ? BAL.bossHP : this.elite ? BAL.eliteHP : this.rare ? 2.5 : this.mini ? 0.35 : this.minion ? 0.6 : 1;
    this.maxHp = Math.round(BAL.enemyHP(level) * A.hp * this.mult);
    this.hp = this.maxHp;
    this.atk = BAL.enemyAtk(level) * A.atk * (this.boss ? BAL.bossAtk : this.elite ? BAL.eliteAtk : this.mini ? 0.6 : 1);
    this.def = BAL.enemyDef(level) * A.def * (this.boss ? BAL.bossDef : 1);
    this.speed = A.speed * (this.boss ? 1.1 : 1) * (this.mini ? 1.2 : 1);
    this.radius = A.radius * this.scale; this.height = A.height * this.scale;
    this.hpBars = this.boss ? 3 + Math.floor((G.floor ? G.floor.f : 1) / 25) : this.elite ? 2 : 1;
    this.phase = 0;
    this.pos = new THREE.Vector3(x, World.ground(x, z), z);
    this.home = this.pos.clone();
    this.vel = new THREE.Vector3();
    this.yaw = Math.random() * TAU;
    this.state = 'idle'; this.t = 0; this.cool = {};
    this.attacks = [...A.attacks];
    if (this.boss) this.attacks.push('bslam', 'bcharge');
    this.flying = !!A.flags.flying; this.floating = !!A.flags.floating;
    this.walkPhase = Math.random() * 10; this.moveAmt = 0;
    this.flash = 0; this.aggro = false; this.wander = null; this.wanderT = 0;
    this.arena = o.arena || null;
    this.lastHitBy = {};
    this.rig.root.position.copy(this.pos);
    R.scene.add(this.rig.root);
    this.plate = new Nameplate(this);
    this.cur = null; // 진행 중인 공격
  }
  // 떠 있는 높이(월드 단위). 보스·네임드는 몸이 커도 너무 높이 뜨지 않게 한다.
  hoverWorld() { const h = this.rig.hover || 0; if (!h) return 0; return h * (this.boss ? 0.55 : this.elite ? 0.8 : 1) * (this.dashing ? 0.25 : 1) * (this.state === 'windup' || this.state === 'act' ? 0.7 : 1); }
  get center() { return this._c || (this._c = new THREE.Vector3()), this._c.set(this.pos.x, this.pos.y + this.height * 0.5 + this.hoverWorld(), this.pos.z); }
  forward() { return [Math.sin(this.yaw), Math.cos(this.yaw)]; }
  faceTo(x, z, dt, rate = 6) {
    const want = Math.atan2(x - this.pos.x, z - this.pos.z);
    this.yaw += clamp(angDiff(this.yaw, want), -rate * dt, rate * dt);
  }
  playerAngle() {
    const [fx, fz] = this.forward();
    const dx = Player.pos.x - this.pos.x, dz = Player.pos.z - this.pos.z, d = Math.hypot(dx, dz) || 1;
    return Math.acos(clamp((fx * dx + fz * dz) / d, -1, 1));
  }

  setState(s, t = 0) { this.state = s; this.t = 0; this.stateDur = t; }

  update(dt) {
    if (this.dead) return;
    this.t += dt;
    for (const k in this.cool) this.cool[k] -= dt;
    this.flash = Math.max(0, this.flash - dt * 6);
    const P = Player;
    const dx = P.pos.x - this.pos.x, dz = P.pos.z - this.pos.z, dist = Math.hypot(dx, dz);
    const reach = dist - this.radius;
    const alive = P.alive && G.state === 'play';
    const safe = P.inSafeZone;
    let move = 0, mx = 0, mz = 0;

    switch (this.state) {
      case 'idle': {
        this.wanderT -= dt;
        if (!this.wander || this.wanderT <= 0) {
          const a = Math.random() * TAU, r = Math.random() * 7;
          this.wander = { x: this.home.x + Math.cos(a) * r, z: this.home.z + Math.sin(a) * r };
          this.wanderT = 3 + Math.random() * 4;
        }
        const wx = this.wander.x - this.pos.x, wz = this.wander.z - this.pos.z, wd = Math.hypot(wx, wz);
        if (wd > 0.8) { mx = wx / wd; mz = wz / wd; move = 0.35; this.faceTo(this.wander.x, this.wander.z, dt, 3); }
        const aggroR = this.boss ? 0 : this.elite ? 16 : (this.flying ? 13 : 11);
        if (alive && !safe && (dist < aggroR || this.aggro)) { this.aggro = true; this.setState('chase'); if (this.elite) Sfx.roar(); }
        if (this.boss && this.aggro && alive) this.setState('chase');
        break;
      }
      case 'chase': {
        if (!alive || (safe && !this.boss)) { this.aggro = false; this.setState('return'); break; }
        const fromHome = Math.hypot(this.pos.x - this.home.x, this.pos.z - this.home.z);
        if (!this.boss && (fromHome > (this.elite ? 60 : 45) || dist > 55)) { this.aggro = false; this.setState('return'); break; }
        if (this.boss && this.arena && Math.hypot(P.pos.x - this.arena.x, P.pos.z - this.arena.z) > this.arena.r + 3) { this.aggro = false; this.setState('return'); break; }
        this.faceTo(P.pos.x, P.pos.z, dt, this.boss ? 3.5 : 6);
        // 공격 선택
        const choice = this.pickAttack(reach);
        if (choice) { this.beginAttack(choice); break; }
        const keep = this.A.flags.keepAway;
        let want = keep ? 9 : Math.min(...this.attacks.map((k) => ATTACKS[k].range)) * 0.8;
        if (reach > want) { mx = dx / dist; mz = dz / dist; move = 1; }
        else if (keep && reach < 6) { mx = -dx / dist; mz = -dz / dist; move = 0.8; }
        if (this.A.flags.sidestep || keep || this.boss) {
          this.strafeT = (this.strafeT || 0) - dt;
          if (this.strafeT <= 0) { this.strafeDir = Math.random() < 0.5 ? -1 : 1; this.strafeT = 1 + Math.random() * 2; }
          if (reach < want + 2) { mx += (-dz / dist) * this.strafeDir * 0.7; mz += (dx / dist) * this.strafeDir * 0.7; move = Math.max(move, 0.6); }
        }
        break;
      }
      case 'windup': this.updateWindup(dt, dist); break;
      case 'act': { const r = this.updateAct(dt, dist); if (r) { mx = r[0]; mz = r[1]; move = r[2]; } break; }
      case 'recover': if (this.t >= this.stateDur) this.setState('chase'); break;
      case 'stagger': if (this.t >= this.stateDur) this.setState('chase'); break;
      case 'return': {
        const hx = this.home.x - this.pos.x, hz = this.home.z - this.pos.z, hd = Math.hypot(hx, hz);
        this.hp = Math.min(this.maxHp, this.hp + this.maxHp * 0.25 * dt);
        if (this.hp < this.maxHp && Math.random() < dt * 4) this.plate.draw();
        if (hd < 1.5) { this.setState('idle'); this.hp = this.maxHp; this.plate.draw(); if (this.boss) UI.boss(this); }
        else { mx = hx / hd; mz = hz / hd; move = 1.3; this.faceTo(this.home.x, this.home.z, dt, 6); }
        if (alive && !safe && dist < 6 && this.t > 1.5) this.setState('chase');
        break;
      }
    }

    // 이동
    const sp = this.speed * move * (this.state === 'act' ? 1 : this.boss && this.phase >= 2 ? 1.15 : 1);
    if (this.state !== 'act' || !this.dashing) { this.vel.x = lerp(this.vel.x, mx * sp, Math.min(1, dt * 8)); this.vel.z = lerp(this.vel.z, mz * sp, Math.min(1, dt * 8)); }
    const nx = this.pos.x + this.vel.x * dt, nz = this.pos.z + this.vel.z * dt;
    if (World.passable(nx, nz) && (!World.liquidAt(nx, nz) || this.flying || this.floating)) { this.pos.x = nx; this.pos.z = nz; }
    else { this.vel.multiplyScalar(0.2); if (this.dashing) this.dashBlocked = true; }
    if (World.active) {
      const t = { x: this.pos.x, z: this.pos.z };
      if (World.active.colliders.resolve(t, this.radius * 0.8) && this.dashing) this.dashBlocked = true;
      this.pos.x = t.x; this.pos.z = t.z;
    }
    if (this.arena) {
      const ax = this.pos.x - this.arena.x, az = this.pos.z - this.arena.z, ad = Math.hypot(ax, az), lim = this.arena.r - this.radius - 0.5;
      if (ad > lim) { this.pos.x = this.arena.x + ax / ad * lim; this.pos.z = this.arena.z + az / ad * lim; }
    }
    // 서로 겹치지 않게
    for (const o of Ents.list) {
      if (o === this || o.dead) continue;
      const ox = this.pos.x - o.pos.x, oz = this.pos.z - o.pos.z, od = Math.hypot(ox, oz), rr = (this.radius + o.radius) * 0.8;
      if (od < rr && od > 1e-4) { const p = (rr - od) * 0.5; this.pos.x += ox / od * p; this.pos.z += oz / od * p; }
    }
    // 플레이어와 겹치지 않게
    if (dist < this.radius + 0.45 && dist > 1e-4) { const p = this.radius + 0.45 - dist; this.pos.x -= dx / dist * p; this.pos.z -= dz / dist * p; }
    this.pos.y = World.ground(this.pos.x, this.pos.z);
    if (World.active && World.active.water && (this.flying || this.floating)) this.pos.y = Math.max(this.pos.y, World.active.water.level);
    this.moveAmt = lerp(this.moveAmt, Math.min(1, Math.hypot(this.vel.x, this.vel.z) / Math.max(1, this.speed)), Math.min(1, dt * 10));
    this.animate(dt);
    this.plate.update();
  }

  pickAttack(reach) {
    let best = null;
    const order = this.boss ? [...this.attacks].sort(() => Math.random() - 0.5) : this.attacks;
    for (const k of order) {
      const a = ATTACKS[k];
      if ((this.cool[k] || 0) > 0) continue;
      if (reach > a.range || reach < (a.minRange || 0) - this.radius * 0.3) continue;
      if (k === 'bsummon' && Ents.list.filter((e) => e.minion && !e.dead).length >= 3) continue;
      if ((a.dash || a.proj) && World.active && World.active.colliders.blocked(this.pos.x, this.pos.z, Player.pos.x, Player.pos.z)) continue;
      best = k;
      if (this.boss && k.startsWith('b')) break;
      if (!this.boss) break;
    }
    return best;
  }

  beginAttack(k) {
    const a = ATTACKS[k];
    this.cur = { k, a, hit: false, n: 0 };
    this.cool[k] = a.cd * (this.boss && this.phase >= 2 ? 0.75 : 1) + Math.random() * 0.4;
    let windup = a.windup * (this.boss && this.phase >= 1 ? 0.85 : 1);
    if (this.mini) windup *= 0.8;
    this.setState('windup', windup);
    const pan = this.panToPlayer();
    if (a.dmg > 0) Sfx.enemyWindup(pan);
    if (k === 'bsummon') Sfx.roar();
    const gy = this.pos.y;
    if (a.tele === 'circle') {
      const r = (k === 'bwave' ? 3 : a.radius) * (k === 'slam' ? this.scale : 1);
      this.cur.decal = FX.decal('circle', { x: this.pos.x, y: gy, z: this.pos.z, radius: r, dur: windup });
      this.cur.radius = r;
    } else if (a.tele === 'atTarget') {
      this.cur.tx = Player.pos.x; this.cur.tz = Player.pos.z;
      const h = { type: 'root', t: windup + a.delay, x: Player.pos.x, z: Player.pos.z, r: a.radius, dmg: this.atk * a.dmg, src: this, color: ARCH[this.key].colors[2] };
      h.decal = FX.decal('circle', { x: h.x, y: World.ground(h.x, h.z), z: h.z, radius: h.r, dur: h.t, color: 0xff6a2a });
      Ents.hazards.push(h);
    }
  }

  updateWindup(dt, dist) {
    const c = this.cur, a = c.a;
    const lockAt = a.dash ? 0.75 : 0.95;
    if (this.t < this.stateDur * lockAt) this.faceTo(Player.pos.x, Player.pos.z, dt, this.boss ? 4 : 8);
    if (a.tele === 'line' && !c.decal && this.t >= this.stateDur * lockAt) {
      c.decal = FX.decal('line', { x: this.pos.x, y: this.pos.y, z: this.pos.z, yaw: this.yaw, len: a.dash * a.dashTime + this.radius, width: this.radius * 2 + 0.6, dur: this.stateDur * (1 - lockAt) + 0.05 });
    }
    if (c.decal && a.tele === 'circle') { c.decal.m.position.set(this.pos.x, this.pos.y + 0.08, this.pos.z); }
    if (this.t >= this.stateDur) this.execute(dist);
  }

  execute(dist) {
    const c = this.cur, a = c.a, k = c.k;
    const reach = dist - this.radius;
    switch (k) {
      case 'melee': case 'heavy': case 'combo': {
        this.setState('act', a.hits ? a.gap * a.hits : 0.15);
        this.strike();
        c.n = 1;
        break;
      }
      case 'lunge': case 'charge': case 'dive': case 'bcharge': {
        this.dashing = true; this.dashBlocked = false;
        const [fx, fz] = this.forward();
        this.vel.set(fx * a.dash, 0, fz * a.dash);
        this.setState('act', a.dashTime);
        Sfx.swing(1.2);
        break;
      }
      case 'slam': case 'bslam': {
        const r = c.radius;
        if (reach < r - this.radius + 0.4 || dist < r) Player.hurt(this.atk * a.dmg, this, { from: this.pos });
        FX.ring(this.pos, ARCH[this.key].colors[2], r, 0.4);
        FX.burst(this.pos.clone().setY(this.pos.y + 0.3), 0xd8c8a0, 40, 8, 0.3, 0.7);
        if (Player.distTo(this.pos.x, this.pos.z) < r + 10) Player.shake(this.boss ? 0.6 : 0.3);
        Sfx.hit(false, this.panToPlayer());
        this.setState('recover', a.recover);
        break;
      }
      case 'bwave': {
        const ring = new THREE.Mesh(new THREE.RingGeometry(0.92, 1, 64), new THREE.MeshBasicMaterial({ color: 0xff5a3a, transparent: true, opacity: 0.85, side: THREE.DoubleSide, depthWrite: false, blending: THREE.AdditiveBlending }));
        ring.rotation.x = -Math.PI / 2; ring.position.set(this.pos.x, this.pos.y + 0.3, this.pos.z);
        R.scene.add(ring);
        Ents.hazards.push({ type: 'wave', x: this.pos.x, z: this.pos.z, r: 1, max: 26, speed: 11, dmg: this.atk * a.dmg, src: this, ring });
        Player.shake(0.4); Sfx.roar();
        UI.toast('충격파! 점프(Space)나 회피로 넘으세요.', '#ff8a6a');
        this.setState('recover', a.recover);
        break;
      }
      case 'ranged': case 'bfan': {
        const from = this.center.clone(); from.y += this.height * 0.15;
        const tgt = Player.pos.clone(); tgt.y += 1.1;
        tgt.addScaledVector(Player.vel, 0.25);
        const n = a.count || 1;
        for (let i = 0; i < n; i++) Ents.fireProjectile(this, from, tgt, a.proj, this.atk * a.dmg, ARCH[this.key].colors[2], n > 1 ? (i - (n - 1) / 2) * 0.16 : 0);
        Sfx.swing(0.8);
        this.setState('recover', a.recover);
        break;
      }
      case 'root': this.setState('recover', a.recover); break;
      case 'blink': {
        const f = Player.forwardXZ();
        const tx = Player.pos.x - f[0] * 2.4, tz = Player.pos.z - f[1] * 2.4;
        FX.burst(this.center, 0x8ae8ff, 24, 4, 0.25, 0.5, 0);
        const t = { x: tx, z: tz };
        if (World.passable(tx, tz)) { if (World.active) World.active.colliders.resolve(t, this.radius); this.pos.x = t.x; this.pos.z = t.z; }
        this.yaw = Math.atan2(Player.pos.x - this.pos.x, Player.pos.z - this.pos.z);
        FX.burst(this.center, 0x8ae8ff, 24, 4, 0.25, 0.5, 0);
        this.cool.melee = 0;
        this.beginAttack('melee');
        this.stateDur = 0.5;
        break;
      }
      case 'bsummon': {
        const T = G.floor.T;
        for (let i = 0; i < 2 + (this.phase >= 3 ? 1 : 0); i++) {
          const ang = Math.random() * TAU;
          const e = Ents.spawn(T.enemies[i % T.enemies.length], Math.max(1, this.level - 3), this.pos.x + Math.cos(ang) * 5, this.pos.z + Math.sin(ang) * 5, { minion: true, arena: this.arena });
          e.aggro = true; e.setState('chase'); e.home.set(this.arena.x, 0, this.arena.z);
          FX.burst(e.center, 0xc87aff, 30, 5, 0.25, 0.7, 0);
        }
        this.setState('recover', a.recover);
        break;
      }
      default: this.setState('recover', a.recover || 0.5);
    }
  }

  strike() {
    const a = this.cur.a;
    const dist = Player.distTo(this.pos.x, this.pos.z);
    const ang = this.playerAngle() / DEG;
    Sfx.swing(this.boss ? 1.5 : 1);
    if (dist - this.radius <= a.range + 0.5 && ang <= (a.arc || 110) / 2 + 10) Player.hurt(this.atk * a.dmg, this, { from: this.pos });
  }

  updateAct(dt, dist) {
    const c = this.cur, a = c.a;
    if (c.k === 'combo') {
      if (this.t >= a.gap * c.n && c.n < a.hits) { c.n++; this.faceTo(Player.pos.x, Player.pos.z, 1, 1); this.strike(); }
      if (this.t >= this.stateDur) this.setState('recover', a.recover);
      return null;
    }
    if (this.dashing) {
      if (!c.hit && dist < this.radius + 0.75 && Math.abs((Player.pos.y + 1) - this.center.y) < this.height + 1.2) {
        c.hit = true;
        Player.hurt(this.atk * a.dmg, this, { from: this.pos, knock: c.k === 'charge' || c.k === 'bcharge' ? 9 : 4 });
      }
      if (Math.random() < 0.5) FX.burst(this.pos.clone().setY(this.pos.y + 0.2), 0xc8b89a, 2, 2, 0.25, 0.4);
      if (this.t >= this.stateDur || this.dashBlocked) {
        this.dashing = false; this.vel.multiplyScalar(0.1);
        const stun = this.dashBlocked && (c.k === 'charge' || c.k === 'bcharge');
        if (stun) { Player.shake(0.3); FX.burst(this.center, 0xffffff, 20, 5, 0.2, 0.5); UI.floatText('기절', this.center, '#9ad8ff'); }
        this.setState('recover', a.recover * (stun ? 1.8 : 1));
      }
      return null;
    }
    if (this.t >= this.stateDur) this.setState('recover', a.recover);
    return null;
  }

  panToPlayer() {
    const f = Player.forwardXZ();
    const dx = this.pos.x - Player.pos.x, dz = this.pos.z - Player.pos.z, d = Math.hypot(dx, dz) || 1;
    return clamp((dx * -f[1] + dz * f[0]) / d * -1, -1, 1) * 0.8;
  }

  // 플레이어에게 맞음
  damage(amount, info = {}) {
    if (this.dead) return 0;
    let blocked = false;
    if ((this.A.flags.shield || this.A.flags.armorFront) && !info.skill && this.state !== 'recover' && this.state !== 'stagger' && this.playerAngle() < 1.0) {
      amount *= 0.35; blocked = true;
    }
    amount = Math.max(1, Math.round(amount));
    this.hp -= amount;
    this.flash = 1;
    if (!this.aggro) { this.aggro = true; if (this.state === 'idle' || this.state === 'return') this.setState('chase'); }
    // 경직
    const canStagger = !this.boss || (info.stagger && this.state === 'windup' && Math.random() < 0.35);
    if (canStagger && (info.stagger || (info.skill && this.state === 'windup') || (info.crit && !this.elite && Math.random() < 0.5))) {
      this.interrupt(info.stagger ? 0.9 : 0.5);
    }
    if (!this.boss && !this.dashing) {
      const kb = info.knock ?? (info.skill ? 2.5 : 1.2);
      const dx = this.pos.x - Player.pos.x, dz = this.pos.z - Player.pos.z, d = Math.hypot(dx, dz) || 1;
      this.vel.x += dx / d * kb * (this.elite ? 0.4 : 1); this.vel.z += dz / d * kb * (this.elite ? 0.4 : 1);
    }
    // 보스 단계 변화
    if (this.boss) {
      const per = this.maxHp / this.hpBars;
      const ph = this.hpBars - Math.ceil(Math.max(this.hp, 0) / per);
      if (ph > this.phase && this.hp > 0) {
        this.phase = ph;
        Sfx.roar(); Player.shake(0.5);
        FX.ring(this.pos, 0xff3a3a, 12, 0.8);
        if (ph === 1) { this.attacks.push(this.key === 'imp' || this.key === 'wasp' ? 'bfan' : 'bwave'); UI.toast(`${this.name}이(가) 격노했다!`, '#ff8a6a'); }
        if (ph === 2) { this.attacks.push('bsummon'); if (!this.attacks.includes('bfan')) this.attacks.push('bfan'); UI.toast('보스가 부하를 부른다!', '#ff8a6a'); }
        if (ph >= 3 && !this.attacks.includes('bwave')) this.attacks.push('bwave');
      }
      UI.boss(this);
    }
    this.plate.draw();
    if (this.hp <= 0) this.die(info);
    return { amount, blocked };
  }
  interrupt(t) {
    if (this.cur && this.cur.decal) { FX.removeDecal(this.cur.decal); this.cur.decal = null; }
    this.dashing = false;
    this.setState('stagger', t);
  }
  die(info) {
    this.dead = true;
    if (this.cur && this.cur.decal) FX.removeDecal(this.cur.decal);
    const col = this.rare ? 0xffe070 : this.boss ? 0xffffff : new THREE.Color(this.A.colors[0]).lerp(new THREE.Color(0x9ae8ff), 0.5).getHex();
    FX.shatter(this.center, this.radius, this.height, col, this.boss ? 400 : this.elite ? 150 : 55);
    FX.burst(this.center, 0xbfeaff, this.boss ? 120 : 30, this.boss ? 10 : 5, 0.22, 0.8, 1);
    Sfx.shatter(this.panToPlayer());
    if (this.A.flags.splits && !this.mini && !this.boss) {
      for (let i = 0; i < 2; i++) {
        const a = Math.random() * TAU;
        const m = Ents.spawn(this.key, Math.max(1, this.level - 1), this.pos.x + Math.cos(a) * 1.2, this.pos.z + Math.sin(a) * 1.2, { mini: true });
        m.aggro = true; m.setState('chase'); m.home.copy(this.home);
        if (this.spawnRef) { m.spawnRef = this.spawnRef; this.spawnRef.enemies.push(m); }
      }
    }
    Game.onKill(this, info);
    this.remove();
  }
  remove() {
    this.removed = true; this.dead = true;
    this.rig.root.removeFromParent();
    for (const m of this.rig.mats) m.dispose();
    this.rig.eyeMat.dispose();
    this.plate.remove();
  }

  animate(dt) {
    const rig = this.rig, t = G.time;
    rig.root.position.copy(this.pos);
    rig.root.rotation.y = this.yaw;
    this._hv = lerp(this._hv ?? this.hoverWorld(), this.hoverWorld(), Math.min(1, dt * 6));
    const hover = this._hv / this.scale;
    rig.body.position.y = hover + (hover ? Math.sin(t * 3 + this.walkPhase) * 0.12 : 0);
    this.walkPhase += dt * (2 + this.moveAmt * this.speed * 1.6);
    const wp = this.walkPhase, amt = this.moveAmt;
    for (let i = 0; i < rig.legs.length; i++) {
      const s = Math.sin(wp + rig.legPhase[i]) * 0.7 * amt;
      if (rig.crabLegs) rig.legs[i].rotation.y = s * 0.6; else rig.legs[i].rotation.x = s;
    }
    if (!rig.hover && rig.legs.length) rig.body.position.y += Math.abs(Math.sin(wp)) * 0.05 * amt;
    for (const w of rig.wings) w.rotation.z = Math.sin(t * 38) * 0.7 * Math.sign(w.position.x);
    if (rig.tail) rig.tail.rotation.y = Math.sin(t * 4 + wp) * 0.35;
    if (rig.blob) { const s = 1 + Math.sin(wp * 1.4) * 0.09 * (0.4 + amt); rig.blob.scale.set(1.6 / Math.sqrt(s), 1.15 * s, 1.6 / Math.sqrt(s)); }
    // 공격 자세
    let lean = 0, armR = Math.sin(wp) * 0.5 * amt, armL = -Math.sin(wp) * 0.5 * amt;
    if (this.state === 'windup') {
      const w = clamp(this.t / Math.max(0.01, this.stateDur), 0, 1);
      lean = -0.22 * w; armR = -2.3 * easeOut(w); armL = -0.6 * w;
      const glow = 0.5 + 0.5 * Math.sin(t * 30);
      for (const m of rig.mats) if (m.emissive) { m.emissive.setRGB(0.6 * glow * w, 0.05, 0.02); }
    } else if (this.state === 'act') {
      lean = 0.28; armR = 0.9; armL = 0.3;
    } else if (this.state === 'stagger') {
      lean = -0.3 + Math.sin(t * 40) * 0.08;
    }
    if (this.state !== 'windup') {
      for (const m of rig.mats) if (m.emissive) m.emissive.setScalar(this.flash * 0.9);
    }
    rig.body.rotation.x = lerp(rig.body.rotation.x, lean, Math.min(1, dt * 14));
    if (rig.arms[1]) rig.arms[1].rotation.x = lerp(rig.arms[1].rotation.x, armR, Math.min(1, dt * 16));
    if (rig.arms[0]) rig.arms[0].rotation.x = lerp(rig.arms[0].rotation.x, rig.shield && this.state !== 'recover' ? -1.2 : armL, Math.min(1, dt * 12));
    if (rig.crabLegs) { for (const a of rig.arms) a.rotation.y = Math.sin(t * 3) * 0.15 + (this.state === 'windup' ? -0.5 : 0); }
    if (rig.head) rig.head.rotation.x = Math.sin(t * 1.3 + wp) * 0.05;
    if (rig.handGlow) rig.handGlow.scale.setScalar(this.state === 'windup' ? 0.3 + 0.15 * Math.sin(t * 20) : 0.18);
  }
}

// 플레이어: 이동, 1인칭 검, 공격·검술, 회피·방어, 피해, 성장, VR 조작
// ---------------------------------------------------------------------------
// 선분-선분 최단거리의 제곱 (VR 칼날 vs 몬스터 몸통 판정)
function segSegDist2(p1, q1, p2, q2) {
  const d1 = q1.clone().sub(p1), d2 = q2.clone().sub(p2), r = p1.clone().sub(p2);
  const a = d1.dot(d1), e = d2.dot(d2), f = d2.dot(r);
  let s, t;
  if (a <= 1e-8 && e <= 1e-8) return r.dot(r);
  if (a <= 1e-8) { s = 0; t = clamp(f / e, 0, 1); }
  else {
    const c = d1.dot(r);
    if (e <= 1e-8) { t = 0; s = clamp(-c / a, 0, 1); }
    else {
      const b = d1.dot(d2), den = a * e - b * b;
      s = den !== 0 ? clamp((b * f - c * e) / den, 0, 1) : 0;
      t = (b * s + f) / e;
      if (t < 0) { t = 0; s = clamp(-c / a, 0, 1); } else if (t > 1) { t = 1; s = clamp((b - c) / a, 0, 1); }
    }
  }
  const c1 = p1.clone().addScaledVector(d1, s), c2 = p2.clone().addScaledVector(d2, t);
  return c1.distanceToSquared(c2);
}

// 1인칭 검 동작의 자세 (카메라 기준). rot = [yaw, pitch, roll], 순서 YXZ
const POSES = {
  idle: { p: [0.32, -0.22, -0.58], r: [0.25, 0.65, -0.15] },
  guard: { p: [0.2, -0.18, -0.5], r: [1.35, 0.15, 1.57] },
  r2l: { s: { p: [0.4, -0.2, -0.45], r: [-0.95, 0.15, 0] }, e: { p: [-0.3, -0.28, -0.5], r: [0.95, -0.05, 0] } },
  l2r: { s: { p: [-0.3, -0.18, -0.45], r: [0.95, 0.15, 0] }, e: { p: [0.4, -0.3, -0.5], r: [-0.95, -0.05, 0] } },
  down: { s: { p: [0.14, 0.1, -0.42], r: [-0.05, 1.35, 1.57] }, e: { p: [0.05, -0.3, -0.6], r: [0, -0.4, 1.57] } },
  up: { s: { p: [0.08, -0.32, -0.55], r: [0.1, -0.45, 1.57] }, e: { p: [0.18, 0.08, -0.42], r: [-0.15, 1.25, 1.57] } },
  thrust: { s: { p: [0.2, -0.2, -0.4], r: [0.05, 0.04, 0] }, e: { p: [0.06, -0.15, -0.72], r: [0, 0, 0] } },
  spin: { s: { p: [0.45, -0.2, -0.38], r: [-1.45, 0.1, 0] }, e: { p: [-0.42, -0.26, -0.42], r: [1.5, -0.05, 0] } },
  raise: { s: { p: [0.32, -0.22, -0.58], r: [0.25, 0.65, -0.15] }, e: { p: [0.18, 0.1, -0.38], r: [-0.1, 1.35, 1.57] } },
};
const _e = new THREE.Euler(0, 0, 0, 'YXZ');
function poseQuat(r, out) { _e.set(r[1], r[0], r[2], 'YXZ'); return out.setFromEuler(_e); }

const Player = {
  pos: new THREE.Vector3(), vel: new THREE.Vector3(), yaw: 0, pitch: 0, groundY: 0, onGround: true,
  hp: 100, maxHp: 100, alive: true,
  atk: 10, def: 0, crit: 0.05, cdr: 0, moveMul: 1, atkSpeed: 1, wtype: 'sword',
  dodgeT: 0, dodgeCd: 0, dodgeDir: [0, 0], iframe: 0, guarding: false, guardT: 0,
  act: null, comboStep: 0, comboTimer: 0, queued: false,
  skillCd: {}, skillCdMax: {}, potionCd: 0, healLeft: 0, combatT: 0,
  shakeAmt: 0, bobPhase: 0, inSafeZone: false, interact: null,
  sword: null, trail: null, skillSel: 0, xrInit: false,
  _q1: new THREE.Quaternion(), _q2: new THREE.Quaternion(), _v: new THREE.Vector3(), _v2: new THREE.Vector3(),

  level() { return G.save ? G.save.level : 1; },
  weapon() { const s = G.save; return s ? s.inv.find((i) => i.uid === s.equip.weapon) : null; },
  armor() { const s = G.save; return s ? s.inv.find((i) => i.uid === s.equip.armor) : null; },
  distTo(x, z) { return Math.hypot(this.pos.x - x, this.pos.z - z); },
  forwardXZ() {
    if (G.xr) { const d = R.camera.getWorldDirection(this._v2); const l = Math.hypot(d.x, d.z) || 1; return [d.x / l, d.z / l]; }
    return [-Math.sin(this.yaw), -Math.cos(this.yaw)];
  },
  shake(a) { this.shakeAmt = Math.min(1, this.shakeAmt + a); },
  locked() { return !this.alive || (this.act && (this.act.kind === 'skill' || this.act.t < this.act.dur * 0.75)) || this.dodgeT > 0; },

  recalc() {
    const s = G.save; if (!s) return;
    const w = this.weapon(), a = this.armor();
    const wAtk = w ? itemAtk(w) : 8;
    this.atk = wAtk * (1 + s.str * 0.008) * (1 + s.level * 0.01);
    this.def = a ? itemDef(a) : 0;
    this.maxHp = Math.round(BAL.playerHP(s.level) * (1 + s.vit * 0.008) * (1 + ((a && a.hpB) || 0)));
    this.crit = Math.min(0.6, 0.05 + s.agi * 0.002 + (w ? WEAPONS[w.type].crit + (w.critB || 0) : 0));
    this.cdr = Math.min(0.35, s.agi * 0.0015);
    this.moveMul = 1 + Math.min(0.3, s.agi * 0.001);
    this.atkSpeed = (w ? WEAPONS[w.type].speed : 1) * (1 + Math.min(0.3, s.agi * 0.0008));
    const nt = w ? w.type : 'sword';
    const changed = nt !== this.wtype || !this.sword || this.swordUid !== (w && w.uid + ':' + w.plus);
    this.wtype = nt;
    if (this.hp > this.maxHp) this.hp = this.maxHp;
    if (changed) this.buildSword(w);
  },

  // ------------------------------------------------------------------ 검 모델
  buildSword(item) {
    if (this.sword) { this.sword.pivot.removeFromParent(); this.sword.pivot.traverse((o) => { if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose(); }); }
    const type = item ? item.type : 'sword', W = WEAPONS[type];
    const rar = item ? RARITY[item.r] : RARITY[0];
    this.swordUid = item ? item.uid + ':' + item.plus : 'none';
    const pivot = new THREE.Group();
    const g = new THREE.Group(); pivot.add(g);
    const steel = new THREE.MeshStandardMaterial({ color: item && item.r === 4 ? 0xf0d8a0 : 0xc4cad2, metalness: 0.92, roughness: 0.26, envMapIntensity: 1.0, emissive: 0x000000 });
    const dark = new THREE.MeshStandardMaterial({ color: 0x3a2a20, roughness: 0.8 });
    const goldM = new THREE.MeshStandardMaterial({ color: item && item.r >= 3 ? 0xffcf5a : 0x8a8f99, metalness: 0.9, roughness: 0.3 });
    const len = W.len, wd = W.width;
    const addBlade = (L, x0, z0, ang) => {
      const geo = new THREE.BoxGeometry(wd, 0.014, L, 1, 1, 4);
      const p = geo.attributes.position;
      for (let i = 0; i < p.count; i++) { const z = p.getZ(i); const t = (z + L / 2) / L; p.setX(i, p.getX(i) * (0.55 + 0.45 * t)); }
      geo.computeVertexNormals();
      const m = new THREE.Mesh(geo, steel); m.position.set(x0, 0, z0 - L / 2); m.rotation.y = ang; g.add(m); return m;
    };
    if (type === 'scimitar') {
      let z = -0.04, x = 0; const segs = 4, L = len / segs;
      for (let i = 0; i < segs; i++) { const ang = -i * 0.09; const b = addBlade(L + 0.01, x, z, ang); void b; z -= Math.cos(ang) * L; x -= Math.sin(ang) * L; }
      this._tipLocal = new THREE.Vector3(x, 0, z - 0.05);
    } else {
      addBlade(len, 0, -0.04, 0);
      const tip = new THREE.Mesh(new THREE.ConeGeometry(wd * 0.55 * 0.72, wd * 1.4, 4), steel);
      tip.rotation.x = -Math.PI / 2; tip.rotation.y = Math.PI / 4; tip.scale.set(1, 1, 0.2); tip.position.z = -0.04 - len - wd * 0.6;
      g.add(tip);
      this._tipLocal = new THREE.Vector3(0, 0, -0.06 - len - wd);
    }
    // 홈(풀러)
    if (type !== 'dagger' && type !== 'rapier') { const f = new THREE.Mesh(new THREE.BoxGeometry(wd * 0.18, 0.016, len * 0.7), new THREE.MeshStandardMaterial({ color: 0x8a96a8, metalness: 1, roughness: 0.3 })); f.position.z = -0.04 - len * 0.38; if (type !== 'scimitar') g.add(f); }
    // 날 끝 빛 (희귀 이상)
    const glowCol = new THREE.Color(rar.hex);
    this.edge = new THREE.Mesh(new THREE.BoxGeometry(wd * 1.25, 0.004, len * 0.96), new THREE.MeshBasicMaterial({ color: glowCol, transparent: true, opacity: item && item.r >= 2 ? 0.35 : 0, blending: THREE.AdditiveBlending, depthWrite: false }));
    this.edge.position.z = -0.04 - len * 0.5;
    if (type !== 'scimitar') g.add(this.edge);
    const guardW = type === 'rapier' ? 0.16 : type === 'greatsword' ? 0.42 : type === 'dagger' ? 0.12 : 0.26;
    const guard = new THREE.Mesh(new THREE.BoxGeometry(guardW, 0.035, 0.05), goldM); guard.position.z = 0; g.add(guard);
    if (type === 'rapier') { const cup = new THREE.Mesh(new THREE.SphereGeometry(0.06, 12, 6, 0, TAU, 0, Math.PI / 2), goldM); cup.rotation.x = -Math.PI / 2; cup.position.z = 0.0; g.add(cup); }
    const gripL = type === 'greatsword' ? 0.32 : type === 'dagger' ? 0.1 : 0.18;
    const grip = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.02, gripL, 8), dark); grip.rotation.x = Math.PI / 2; grip.position.z = gripL / 2 + 0.02; g.add(grip);
    const pom = new THREE.Mesh(new THREE.IcosahedronGeometry(0.032, 0), goldM); pom.position.z = gripL + 0.04; g.add(pom);
    g.position.z = gripL * 0.35; // 손잡이 가운데를 쥔다
    // 장갑 낀 손과 소매
    const glove = new THREE.MeshStandardMaterial({ color: 0x4a3426, roughness: 0.75, flatShading: true });
    const cloth = new THREE.MeshStandardMaterial({ color: 0x2a3446, roughness: 0.9, flatShading: true });
    const hand = new THREE.Group(); hand.position.z = gripL * 0.35 + 0.02;
    const fist = new THREE.Mesh(new THREE.BoxGeometry(0.075, 0.085, 0.1), glove); fist.position.set(0.012, -0.004, 0); hand.add(fist);
    for (let i = 0; i < 4; i++) { const k = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.026, 0.022), glove); k.position.set(-0.03, 0.012 - i * 0.004, -0.036 + i * 0.024); hand.add(k); }
    const thumb = new THREE.Mesh(new THREE.BoxGeometry(0.022, 0.024, 0.05), glove); thumb.position.set(-0.026, 0.045, -0.02); thumb.rotation.x = 0.4; hand.add(thumb);
    const cuff = new THREE.Mesh(new THREE.CylinderGeometry(0.048, 0.05, 0.07, 8), glove); cuff.rotation.x = Math.PI / 2; cuff.position.set(0.012, -0.01, 0.08); hand.add(cuff);
    const sleeve = new THREE.Mesh(new THREE.CylinderGeometry(0.052, 0.058, 0.12, 8), cloth); sleeve.rotation.x = Math.PI / 2; sleeve.position.set(0.012, -0.01, 0.17); hand.add(sleeve);
    pivot.add(hand);
    g.traverse((o) => { if (o.isMesh) o.castShadow = false; });
    this._baseLocal = new THREE.Vector3(0, 0, -0.06 - len * 0.45);
    this.sword = { pivot, blade: g, steel, tipLocal: this._tipLocal.clone().add(new THREE.Vector3(0, 0, g.position.z)), baseLocal: this._baseLocal.clone().add(new THREE.Vector3(0, 0, g.position.z)) };
    if (!this.trail) this.trail = FX.makeTrail(0xffffff);
    this.attachSword();
  },
  attachSword() {
    if (!this.sword) return;
    const piv = this.sword.pivot;
    piv.removeFromParent();
    if (G.xr && this.rightGrip) {
      this.rightGrip.add(piv);
      piv.scale.setScalar(1);
      piv.position.set(0, -0.01, 0.03);
      piv.quaternion.identity(); // 주먹을 관통하는 축(-Z)이 칼날 방향
    } else {
      R.camera.add(piv);
      piv.scale.setScalar(0.8);
      const id = POSES.idle; piv.position.set(...id.p); poseQuat(id.r, piv.quaternion);
    }
  },
  swordTip(out) { return this.sword.pivot.localToWorld(out.copy(this.sword.tipLocal)); },
  swordBase(out) { return this.sword.pivot.localToWorld(out.copy(this.sword.baseLocal)); },

  // ------------------------------------------------------------------ 입장/배치
  placeAt(x, z, yaw) {
    this.pos.set(x, World.ground(x, z), z);
    this.vel.set(0, 0, 0);
    if (yaw !== undefined) { const f = [Math.cos(yaw), Math.sin(yaw)]; this.yaw = Math.atan2(-f[0], -f[1]); }
    this.pitch = 0;
    if (G.xr) {
      const cam = R.renderer.xr.getCamera();
      const head = new THREE.Vector3().setFromMatrixPosition(cam.matrixWorld);
      R.rig.position.x += x - head.x; R.rig.position.z += z - head.z;
      R.rig.position.y = this.pos.y;
    }
  },

  // ------------------------------------------------------------------ 매 프레임
  update(dt) {
    const s = G.save;
    if (!s) return;
    this.iframe = Math.max(0, this.iframe - dt);
    this.dodgeCd = Math.max(0, this.dodgeCd - dt);
    this.potionCd = Math.max(0, this.potionCd - dt);
    this.combatT = Math.max(0, this.combatT - dt);
    this.comboTimer -= dt; if (this.comboTimer <= 0) this.comboStep = 0;
    for (const k in this.skillCd) this.skillCd[k] = Math.max(0, this.skillCd[k] - dt);
    this.shakeAmt = Math.max(0, this.shakeAmt - dt * 1.8);

    if (this.alive) {
      if (G.xr) this.inputXR(dt); else this.inputDesktop(dt);
      this.updateAct(dt);
      this.move(dt);
      this.regen(dt);
      this.findInteract();
    }
    this.updateCamera(dt);
    this.updateSwordPose(dt);
    if (G.xr) { this.updateXRHits(dt); this.updateWrist(dt); }
  },

  inputDesktop(dt) {
    const sens = 0.0022 * G.settings.sens;
    this.yaw -= (Input.mouseDX + Input.lookDX * 2.2) * sens;
    this.pitch -= (Input.mouseDY + Input.lookDY * 2.2) * sens * (G.settings.invertY ? -1 : 1);
    this.pitch = clamp(this.pitch, -1.45, 1.45);
    if (Input.clickL || (Input.mouseL && !this.act && G.pointerLocked) || (Input.touchAtk && !this.act)) this.attack();
    for (let i = 0; i < 4; i++) if (Input.hit('Digit' + (i + 1))) this.useSkill(i);
    if (Input.hit('KeyQ') || Input.hit('KeyC') || Input.hit('ControlLeft')) this.dodge();
    if (Input.hit('Space') && this.onGround && !this.locked()) { this.vel.y = 7.2; this.onGround = false; }
    if (Input.hit('KeyR')) this.drinkPotion();
    if (Input.hit('KeyE') && this.interact) Game.interact(this.interact);
    const g = (Input.mouseR || Input.touchGuard) && !this.act && this.dodgeT <= 0;
    if (g && !this.guarding) this.guardT = 0;
    this.guarding = g;
    if (g) this.guardT += dt;
  },

  wishDir() {
    if (G.xr) return this.xrMove || [0, 0];
    let ix = (Input.down('KeyD') ? 1 : 0) - (Input.down('KeyA') ? 1 : 0) + Input.joy.x;
    let iz = (Input.down('KeyW') ? 1 : 0) - (Input.down('KeyS') ? 1 : 0) - Input.joy.y;
    if (Input.down('ArrowUp')) iz += 1; if (Input.down('ArrowDown')) iz -= 1;
    if (Input.down('ArrowLeft')) ix -= 1; if (Input.down('ArrowRight')) ix += 1;
    const l = Math.hypot(ix, iz); if (l > 1) { ix /= l; iz /= l; }
    const f = this.forwardXZ(), r = [-f[1], f[0]];
    return [f[0] * iz + r[0] * ix, f[1] * iz + r[1] * ix];
  },

  move(dt) {
    const wish = this.wishDir();
    const liquid = World.liquidAt(this.pos.x, this.pos.z);
    const sprint = (Input.down('ShiftLeft') || Input.down('ShiftRight') || (G.touch && Math.hypot(Input.joy.x, Input.joy.y) > 0.92)) && !this.guarding && !this.act;
    let speed = (sprint ? 8.8 : 5.4) * this.moveMul;
    if (this.act) speed *= this.act.kind === 'skill' ? 0 : 0.4;
    if (this.guarding) speed *= 0.45;
    if (liquid && liquid.kind !== 'ice') speed *= 0.55;
    this.sprinting = sprint && Math.hypot(wish[0], wish[1]) > 0.1;
    let vx, vz;
    if (this.dodgeT > 0) {
      this.dodgeT -= dt;
      vx = this.dodgeDir[0] * 13; vz = this.dodgeDir[1] * 13;
    } else if (this.act && this.act.kind === 'skill' && this.act.S.move && !this.act.vr) {
      const m = this.act.S.move, t = this.act.t;
      if (t >= m.t0 && t <= m.t1) { const sp = m.dist / (m.t1 - m.t0); vx = this.act.dir[0] * sp; vz = this.act.dir[1] * sp; if (m.leap && !this.act.leapt) { this.act.leapt = true; this.vel.y = 6.5; this.onGround = false; } }
      else { vx = this.vel.x * 0.8; vz = this.vel.z * 0.8; }
    } else {
      const k = Math.min(1, dt * (this.onGround ? 12 : 3));
      vx = lerp(this.vel.x, wish[0] * speed, k); vz = lerp(this.vel.z, wish[1] * speed, k);
    }
    this.vel.x = vx; this.vel.z = vz;
    // 수평 이동 + 충돌
    let nx = this.pos.x + vx * dt, nz = this.pos.z + vz * dt;
    if (!World.passable(nx, nz)) {
      if (World.passable(nx, this.pos.z)) nz = this.pos.z;
      else if (World.passable(this.pos.x, nz)) nx = this.pos.x;
      else { nx = this.pos.x; nz = this.pos.z; }
    }
    const p = { x: nx, z: nz };
    if (World.active) World.active.colliders.resolve(p, 0.42);
    this.pos.x = p.x; this.pos.z = p.z;
    // 수직
    const gy = World.ground(this.pos.x, this.pos.z);
    this.groundY = gy;
    if (G.xr) { this.pos.y = gy; this.onGround = true; this.vel.y = 0; }
    else {
      this.vel.y -= 22 * dt;
      this.pos.y += this.vel.y * dt;
      if (this.pos.y <= gy || (this.onGround && this.pos.y - gy < 0.35 && this.vel.y <= 0)) {
        if (!this.onGround && this.vel.y < -9) { this.shake(0.15); Sfx.step(); }
        this.pos.y = gy; this.vel.y = 0; this.onGround = true;
      } else this.onGround = false;
    }
    // 액체 피해
    if (liquid && this.pos.y - gy < 0.3) {
      if (liquid.kind === 'lava' || liquid.kind === 'void') this.trueDamage(this.maxHp * 0.06 * dt, liquid.kind === 'lava' ? '용암' : '공허');
      else if (liquid.kind === 'poison') this.trueDamage(this.maxHp * 0.015 * dt, '독');
    }
    // 안전 지대(마을)
    this.inSafeZone = G.area === 'town' || (G.area === 'field' && G.floor && Math.hypot(this.pos.x - G.floor.town.x, this.pos.z - G.floor.town.z) < 33);
    // 발소리
    const hs = Math.hypot(vx, vz);
    if (this.onGround && hs > 1) {
      const prev = this.bobPhase;
      this.bobPhase += dt * hs * 1.25;
      if (Math.floor(prev / Math.PI) !== Math.floor(this.bobPhase / Math.PI)) Sfx.step();
    }
  },

  regen(dt) {
    if (this.healLeft > 0) { const h = Math.min(this.healLeft, this.maxHp * 0.3 * dt); this.healLeft -= h; this.hp = Math.min(this.maxHp, this.hp + h); }
    const rate = this.inSafeZone ? 0.1 : this.combatT <= 0 ? 0.02 : 0;
    this.hp = Math.min(this.maxHp, this.hp + this.maxHp * rate * dt);
  },

  findInteract() {
    let best = null, bd = 1e9;
    const lists = [World.active ? World.active.interactables : []];
    for (const list of lists) for (const it of list) {
      if (it.hidden) continue;
      if (it.kind === 'chest' && it.chest.opened) continue;
      if (it.kind === 'bossdoor' && World.dungeon && World.dungeon.doorOpen) continue;
      const d = Math.hypot(it.x - this.pos.x, it.z - this.pos.z);
      if (d < it.r && d < bd) { bd = d; best = it; }
    }
    this.interact = best;
  },

  // ------------------------------------------------------------------ 공격
  attack() {
    if (!this.alive || G.xr) return;
    if (this.act) { if (this.act.kind === 'combo' && this.act.t > this.act.dur * 0.35) this.queued = true; return; }
    if (this.dodgeT > 0) return;
    const W = WEAPONS[this.wtype];
    const step = this.comboStep % 3;
    const dur = (0.48 / this.atkSpeed) * (step === 2 ? 1.2 : 1);
    this.act = { kind: 'combo', anims: [[W.combo[step], dur]], t: 0, dur, hitAt: dur * 0.42, hitDone: false, mult: step === 2 ? 1.35 : 1, color: 0xffffff };
    this.comboStep++;
    this.comboTimer = dur + 0.55;
    this.guarding = false;
    setTimeout(() => Sfx.swing(this.wtype === 'greatsword' ? 1.4 : 1), dur * 250);
  },
  useSkill(slot) {
    const id = G.save.slots[slot];
    if (!id || !this.alive) return;
    const S = SKILLS[id];
    if (!skillUsable(id, this.wtype)) { UI.toast(`${S.name}은(는) ${WEAPONS[this.wtype].name}으로 쓸 수 없습니다.`, '#ff9a8a'); Sfx.error(); return; }
    if ((this.skillCd[id] || 0) > 0) return;
    if (this.act && this.act.kind === 'skill') return;

  updateAct(dt) {

  // 범위 안의 몬스터를 찾아 공격 판정
  sweep(o) {
    const f = this.forwardXZ(), px = this.pos.x, pz = this.pos.z;
    const W = WEAPONS[this.wtype];
    let hits = 0;
    for (const e of Ents.list) {
      if (e.dead) continue;
      const dx = e.pos.x - px, dz = e.pos.z - pz, d = Math.hypot(dx, dz);
      const dy = e.center.y - (this.pos.y + 1.2);
      if (Math.abs(dy) > e.height * 0.5 + 2.8) continue;
      let hit = false;
      if (o.aoe) {

        else {

      if (hit && World.active && !o.aoe && World.active.colliders.blocked(px, pz, e.pos.x, e.pos.z)) hit = false;
      if (hit) { this.hitEnemy(e, o.mult, o); hits++; }

  hitEnemy(e, mult, o = {}) {

    const c = e.center.clone();
    const toP = this._v.copy(this.pos).setY(c.y).sub(c).normalize();

    const numPos = c.clone(); numPos.y += 0.5;
    if (res.blocked) { FX.text('막힘', numPos, '#9aa4b0', 0.4); Sfx.block(); }
    FX.text(fmt(res.amount), numPos, crit ? '#ffd24a' : o.skill ? '#' + new THREE.Color(o.color).getHexString() : '#ffffff', crit ? 0.7 : 0.5);
    Sfx.hit(crit, e.panToPlayer());

  // ------------------------------------------------------------------ 카메라와 검 자세
  updateCamera(dt) {

    const hs = Math.hypot(this.vel.x, this.vel.z);

    cam.rotation.set(this.pitch + Math.sin(t * 0.9) * sh * 0.02, 0, Math.sin(t * 0.7) * sh * 0.03, 'YXZ');

  updateSwordPose(dt) {

      let pos = new THREE.Vector3(...tp);

        for (let i = 0; i < a.anims.length; i++) { const d = a.anims[i][1]; if (a.t < acc + d) { idx = i; local = (a.t - acc) / d; break; } acc += d; }

        else { const rk = inSkill && overAll ? clamp((a.t - a.total) / Math.max(0.05, a.S.post), 0, 1) : (local - sEnd) / (1 - sEnd); const k = easeInOut(clamp(rk, 0, 1)); pos.set(...P.e.p).lerp(new THREE.Vector3(...POSES.idle.p), k); poseQuat(P.e.r, tq).slerp(poseQuat(POSES.idle.r, this._q2), k); }

  inputXR(dt) {

    if (Math.hypot(mx, my) < 0.15) { mx = 0; my = 0; }
    const f = this.forwardXZ(), r = [-f[1], f[0]];
    this.xrMove = [f[0] * -my + r[0] * mx, f[1] * -my + r[1] * mx];
    // 오른쪽 스틱: 스냅 회전
    let rx = 0; if (Rg && Rg.axes.length >= 4) rx = Rg.axes[2]; else if (Rg && Rg.axes.length >= 2) rx = Rg.axes[0];
    if (Math.abs(rx) > 0.7 && !this.snapLatch) { this.snapLatch = true; this.snapTurn(rx > 0 ? -Math.PI / 6 : Math.PI / 6); }
    if (Math.abs(rx) < 0.3) this.snapLatch = false;
    if (G.state !== 'play') return;
    // 버튼: xr-standard 매핑 (0 트리거, 1 그립, 4 A/X, 5 B/Y)
    if (this.btnDown('right', 4) && this.interact) Game.interact(this.interact);
    if (this.btnDown('right', 5)) Game.openMainMenu();
    if (this.btnDown('left', 4)) this.drinkPotion();
    if (this.btnDown('left', 5)) { this.skillSel = (this.skillSel + 1) % 4; Sfx.click(); this.wrist && (this.wrist.t = 0); }
    if (this.btnDown('left', 1)) this.dodge();
    const g = this.btn('left', 0);
    if (g && !this.guarding) this.guardT = 0;
    this.guarding = g; if (g) this.guardT += dt;
    // 오른쪽 트리거 + 빠른 휘두르기 = 검술
    const trig = this.btn('right', 0);
    if (trig && this.swingSpeed > 3 && !(this.act && this.act.kind === 'skill')) this.useSkill(this.skillSel);
  },
  snapTurn(a) {
    const cam = R.renderer.xr.getCamera();
    const head = new THREE.Vector3().setFromMatrixPosition(cam.matrixWorld);
    const rp = R.rig.position;
    const dx = rp.x - head.x, dz = rp.z - head.z, c = Math.cos(a), s = Math.sin(a);
    rp.x = head.x + dx * c + dz * s; rp.z = head.z - dx * s + dz * c;
    R.rig.rotation.y += a;
  },
  // VR: 머리 위치를 플레이어 위치로 삼고, 이동 결과만큼 rig를 옮긴다
  syncXRBefore() {
    const cam = R.renderer.xr.getCamera();
    if (cam.matrixWorld.elements[13] === 0) { this._xrHead = null; return; } // 아직 첫 자세를 받지 못함
    const head = new THREE.Vector3().setFromMatrixPosition(cam.matrixWorld);
    const p = { x: head.x, z: head.z };
    if (World.active) World.active.colliders.resolve(p, 0.3);
    if (!World.passable(p.x, p.z)) { p.x = this.pos.x; p.z = this.pos.z; }
    R.rig.position.x += p.x - head.x; R.rig.position.z += p.z - head.z;
    this.pos.x = p.x; this.pos.z = p.z;
    this._xrHead = new THREE.Vector3(p.x, 0, p.z);
  },
  syncXRAfter() {
    if (!this._xrHead) return;
    const head = this._xrHead;
    const dx = this.pos.x - head.x, dz = this.pos.z - head.z;
    R.rig.position.x += dx; R.rig.position.z += dz;
    R.rig.position.y = this.pos.y;
    this._xrHead = null;
  },
  updateXRHits(dt) {
    if (!this.sword || !this.rightGrip) return;
    const tip = this.swordTip(new THREE.Vector3()), base = this.swordBase(new THREE.Vector3());
    const sp = this._lastTip ? tip.distanceTo(this._lastTip) / Math.max(dt, 1e-3) : 0;
    this.swingSpeed = lerp(this.swingSpeed || 0, sp, 0.5);
    this._lastTip = tip.clone();
    if (G.state !== 'play' || !this.alive) return;
    if (sp > 2.2) {
      if (!this._swingSnd || G.time - this._swingSnd > 0.35) { this._swingSnd = G.time; Sfx.swing(clamp(sp / 5, 0.6, 1.4)); }
      for (const e of Ents.list) {
        if (e.dead) continue;
        if (e.pos.distanceTo(this.pos) > 6 + e.radius) continue;
        if (e.lastHitBy.vr && G.time - e.lastHitBy.vr < 0.35) continue;
        const hv = e._hv || 0;
        const a = this._v.set(e.pos.x, e.pos.y + 0.2 + hv, e.pos.z);
        const b = this._v2.set(e.pos.x, e.pos.y + e.height - 0.1 + hv, e.pos.z);
        const r = e.radius + 0.12;
        if (segSegDist2(base, tip, a, b) < r * r) {
          e.lastHitBy.vr = G.time;
          const skill = this.act && this.act.kind === 'skill';
          const mult = clamp(sp / 5, 0.6, 1.5) * (skill ? 1.3 : 1);
          this.hitEnemy(e, mult, { skill, color: skill ? this.act.S.color : 0xffffff });
        }
      }
    }
  },
};

const UI = {
  stack: [], focus: 0, vr: null, hudT: 0, mapT: 0,

  init() {

  // ------------------------------------------------------------------ HUD
  showHUD(on) { this.el.hud.hidden = !on; $('touch').hidden = !(on && G.touch && !G.xr); },
  update(dt) {
    const s = G.save; if (!s) return;
    const P = Player;
    this.hudT -= dt;
    const k = clamp(P.hp / P.maxHp, 0, 1);
    const bar = this.el.hpbar.children;
    bar[1].style.width = (k * 100).toFixed(2) + '%';
    bar[1].style.backgroundColor = k > 0.5 ? 'var(--hp)' : k > 0.2 ? 'var(--hp-mid)' : 'var(--hp-low)';
    bar[0].style.width = (k * 100).toFixed(2) + '%';
    this.el.vignette.style.opacity = Math.max(this.flashV || 0, k < 0.25 && P.alive ? 0.35 + Math.sin(G.time * 5) * 0.15 : 0);
    this.flashV = Math.max(0, (this.flashV || 0) - dt * 2.5);
    if (this.vrFlash) this.vrFlash.material.opacity = Math.max(this.flashV * 0.5, k < 0.25 && P.alive ? 0.12 : 0);
    // 스킬 쿨다운
    for (let i = 0; i < 4; i++) {
      const id = s.slots[i], d = this.slots[i];
      const nm = d.children[1], cd = d.children[2], cdt = d.children[3];
      const label = id ? SKILLS[id].name : '';
      if (nm.textContent !== label) nm.textContent = label;
      const usable = id && skillUsable(id, P.wtype);
      d.classList.toggle('off', !usable);
      const rem = id ? P.skillCd[id] || 0 : 0, max = id ? P.skillCdMax[id] || 1 : 1;
      cd.style.height = (rem > 0 ? (rem / max) * 100 : 0) + '%';
      const tx = rem > 0 ? (rem >= 10 ? Math.ceil(rem) : rem.toFixed(1)) : '';

    const pn = this.potSlot.children[1]; if (pn.textContent !== String(s.potions)) pn.textContent = s.potions;

    if (this.hudT <= 0) {
      this.hudT = 0.15;

      this.el.plevel.textContent = 'LV ' + s.level;
      this.el.hpnum.textContent = `${fmt(P.hp)} / ${fmt(P.maxHp)}`;
      this.el.colnum.textContent = `${fmt(s.col)} Col`;
      this.el.expbar.children[0].style.width = clamp(s.exp / BAL.expNext(s.level), 0, 1) * 100 + '%';
      const buffs = [];
      if (P.inSafeZone) buffs.push('안전 지대');
      if (s.statPts > 0) buffs.push(`능력치 포인트 ${s.statPts}`);
      if (P.guarding) buffs.push('방어 중');

      // 상호작용 안내
      const it = P.interact;
      if (it && G.state === 'play') {
        const key = G.touch ? '' : '<kbd>E</kbd>';
        const html = key + it.label;
        if (this.el.prompt.innerHTML !== html) this.el.prompt.innerHTML = html;
        this.el.prompt.hidden = G.touch;
        $('t-use').hidden = !G.touch; $('t-use').textContent = it.kind === 'npc' ? '대화' : it.kind === 'chest' ? '열기' : '사용';
      } else { this.el.prompt.hidden = true; $('t-use').hidden = true; }
      if (G.settings.fps) { this.el.fps.hidden = false; this.el.fps.textContent = `${Math.round(Game.fps)} FPS · ${R.quality}`; } else this.el.fps.hidden = true;
    }

  },
  setFloorLabel() {
    const F = G.floor; if (!F) return;
    this.el.floorname.textContent = `제 ${F.f}층`;
    this.el.areaname.textContent = G.area === 'dungeon' || G.area === 'boss' ? '미궁' : G.area === 'town' || Player.inSafeZone ? F.townName : F.areaName;
  },
  drawMinimap() {
    const F = G.floor; if (!F) return;
    const g = this.mmCtx, S = 304, P = Player;
    g.save();
    g.clearRect(0, 0, S, S);
    g.beginPath(); g.arc(S / 2, S / 2, S / 2, 0, TAU); g.clip();
    g.fillStyle = '#05080c'; g.fillRect(0, 0, S, S);
    const f = P.forwardXZ();
    const heading = Math.atan2(f[0], -f[1]); // 위쪽이 바라보는 방향
    g.translate(S / 2, S / 2);
    g.rotate(-heading);
    if (World.active === World.dungeon && World.dungeon) {
      const D = World.dungeon, sc = 3.2;
      g.scale(sc, sc);
      g.translate(-P.pos.x, -P.pos.z);
      g.fillStyle = 'rgba(160,150,130,0.35)';
      for (let j = 0; j < D.H; j++) for (let i = 0; i < D.W; i++) if (D.explored[j][i]) g.fillRect(D.ox + i * D.CS, j * D.CS, D.CS, D.CS);
      g.strokeStyle = 'rgba(230,220,200,0.85)'; g.lineWidth = 0.9;
      g.beginPath();
      for (let j = 0; j <= D.H; j++) for (let i = 0; i < D.W; i++) if (D.hw[j][i] && ((D.explored[j] && D.explored[j][i]) || (D.explored[j - 1] && D.explored[j - 1][i]))) { g.moveTo(D.ox + i * D.CS, j * D.CS); g.lineTo(D.ox + (i + 1) * D.CS, j * D.CS); }
      for (let j = 0; j < D.H; j++) for (let i = 0; i <= D.W; i++) if (D.vw[j][i] && (D.explored[j][i] || D.explored[j][i - 1])) { g.moveTo(D.ox + i * D.CS, j * D.CS); g.lineTo(D.ox + i * D.CS, (j + 1) * D.CS); }
      g.stroke();
      g.strokeStyle = 'rgba(255,90,70,0.8)'; g.beginPath(); g.arc(D.arena.x, D.arena.z, D.arena.r, 0, TAU); g.stroke();
      for (const c of D.chests) if (!c.opened && this.cellExplored(D, c.x, c.z)) { g.fillStyle = '#ffd24a'; g.fillRect(c.x - 1.5, c.z - 1.5, 3, 3); }
      g.lineWidth = 1;
      for (const e of Ents.list) { if (e.dead) continue; g.fillStyle = e.boss ? '#ff3a3a' : '#ff7a6a'; g.beginPath(); g.arc(e.pos.x, e.pos.z, e.boss ? 3 : 1.4, 0, TAU); g.fill(); }
    } else {
      const sc = 1.5;
      g.scale(sc, sc);
      g.translate(-P.pos.x, -P.pos.z);
      g.drawImage(F.minimap, -F.SIZE / 2, -F.SIZE / 2, F.SIZE, F.SIZE);
      for (const sp of F.spawns) if (sp.elite && sp.enemies.length) { g.fillStyle = '#ff3a3a'; g.beginPath(); g.arc(sp.x, sp.z, 4, 0, TAU); g.fill(); }
      for (const e of Ents.list) { if (e.dead) continue; g.fillStyle = e.rare ? '#ffd24a' : e.elite ? '#ff3a3a' : '#ff8a7a'; g.beginPath(); g.arc(e.pos.x, e.pos.z, e.elite ? 3 : 1.6, 0, TAU); g.fill(); }
      for (const n of F.npcs) { g.fillStyle = '#7ad0ff'; g.beginPath(); g.arc(n.group.position.x, n.group.position.z, 1.8, 0, TAU); g.fill(); }
    }
    g.restore();
    // 플레이어 화살표 (항상 위를 향함)
    g.fillStyle = '#ffffff'; g.strokeStyle = '#000'; g.lineWidth = 2;
    g.beginPath(); g.moveTo(S / 2, S / 2 - 12); g.lineTo(S / 2 + 8, S / 2 + 9); g.lineTo(S / 2, S / 2 + 4); g.lineTo(S / 2 - 8, S / 2 + 9); g.closePath(); g.stroke(); g.fill();
    // 북쪽 표시
    g.save(); g.translate(S / 2, S / 2); g.rotate(-heading);
    g.fillStyle = '#e3c070'; g.font = '700 22px "Marcellus SC", serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText('N', 0, -S / 2 + 18); g.restore();
  },
  cellExplored(D, x, z) { const c = World.dungeonCell(D, x, z); return c && D.explored[c[1]][c[0]]; },
  // 지도 전체 화면 (메뉴 안에 그린다)
  bigMap() {
    const F = G.floor, S = 900, c = document.createElement('canvas'); c.width = c.height = S;
    const g = c.getContext('2d');
    g.fillStyle = '#05080c'; g.fillRect(0, 0, S, S);
    const P = Player;
    if (World.active === World.dungeon && World.dungeon) {
      const D = World.dungeon, ext = Math.max(D.W * D.CS, D.arena.z + D.arena.r) + 10, sc = S / ext;
      g.translate(S / 2 - 0 * sc, 10); g.scale(sc, sc);
      g.translate(0, 0);
      g.strokeStyle = 'rgba(230,220,200,0.9)'; g.lineWidth = 0.8;
      g.fillStyle = 'rgba(160,150,130,0.3)';
      for (let j = 0; j < D.H; j++) for (let i = 0; i < D.W; i++) if (D.explored[j][i]) g.fillRect(D.ox + i * D.CS, j * D.CS, D.CS, D.CS);
      g.beginPath();
      for (let j = 0; j <= D.H; j++) for (let i = 0; i < D.W; i++) if (D.hw[j][i] && ((D.explored[j] && D.explored[j][i]) || (D.explored[j - 1] && D.explored[j - 1][i]))) { g.moveTo(D.ox + i * D.CS, j * D.CS); g.lineTo(D.ox + (i + 1) * D.CS, j * D.CS); }
      for (let j = 0; j < D.H; j++) for (let i = 0; i <= D.W; i++) if (D.vw[j][i] && (D.explored[j][i] || D.explored[j][i - 1])) { g.moveTo(D.ox + i * D.CS, j * D.CS); g.lineTo(D.ox + i * D.CS, (j + 1) * D.CS); }
      g.stroke();
      g.strokeStyle = '#ff5a4a'; g.beginPath(); g.arc(D.arena.x, D.arena.z, D.arena.r, 0, TAU); g.stroke();
      g.fillStyle = '#fff'; g.beginPath(); g.arc(P.pos.x, P.pos.z, 2.2, 0, TAU); g.fill();
    } else {
      g.drawImage(F.minimap, 0, 0, S, S);
      const toPx = (v) => (v / F.SIZE + 0.5) * S;
      g.font = '600 22px "IBM Plex Sans KR", sans-serif'; g.textAlign = 'center';
      g.fillStyle = '#fff'; g.strokeStyle = '#000'; g.lineWidth = 4;
      const label = (t, x, z) => { g.strokeText(t, toPx(x), toPx(z)); g.fillText(t, toPx(x), toPx(z)); };
      label(F.townName, F.town.x, F.town.z - 44);
      label('미궁탑', F.tower.x, F.tower.z - 24);
      for (const sp of F.spawns) if (sp.elite) { g.fillStyle = '#ff3a3a'; g.beginPath(); g.arc(toPx(sp.x), toPx(sp.z), 7, 0, TAU); g.fill(); g.fillStyle = '#fff'; label('네임드', sp.x, sp.z - 9); }
      const f = P.forwardXZ();
      g.save(); g.translate(toPx(P.pos.x), toPx(P.pos.z)); g.rotate(Math.atan2(f[0], -f[1]));
      g.fillStyle = '#fff'; g.beginPath(); g.moveTo(0, -14); g.lineTo(10, 10); g.lineTo(0, 4); g.lineTo(-10, 10); g.closePath(); g.fill(); g.stroke(); g.restore();
    }
    return c;
  },

  toast(text, color) {
    const d = document.createElement('div'); d.className = 'toast'; d.textContent = text;
    if (color) d.style.borderLeftColor = color;
    this.el.toasts.prepend(d);
    while (this.el.toasts.children.length > 6) this.el.toasts.lastChild.remove();
    setTimeout(() => { d.style.transition = 'opacity 0.5s'; d.style.opacity = '0'; setTimeout(() => d.remove(), 500); }, 3800);
    if (G.xr) this.vrNote(text, color);
  },
  banner(t, s, ms = 2500) {
    const b = this.el.banner;
    b.children[0].textContent = t; b.children[1].textContent = s || '';
    b.style.opacity = '1';
    clearTimeout(this._bT);
    this._bT = setTimeout(() => { b.style.opacity = '0'; }, ms);

  },
  floatText(text, pos, color = '#ffffff') {
    if (!pos) {
      const f = Player.forwardXZ();
      pos = G.xr ? new THREE.Vector3().setFromMatrixPosition(R.renderer.xr.getCamera().matrixWorld) : Player.pos.clone().setY(Player.pos.y + 1.65);
      pos.x += f[0] * 2.2; pos.z += f[1] * 2.2; pos.y += 0.45;
    }
    FX.text(text, pos, color, 0.42, { life: 1.1, vy: 0.5 });
  },
  callout(text, color) {
    if (G.xr) { this.floatText(text, null, color); return; }
    const c = $('callout');
    c.textContent = text; c.style.color = color;
    c.classList.remove('show'); void c.offsetWidth; c.classList.add('show');
  },
  hurtFlash(v = 0.8) { this.flashV = Math.max(this.flashV || 0, v); },
  boss(e) {
    const bb = this.el.bossbar;
    if (!e || e.dead) { bb.hidden = true; this._bossBars = 0; return; }
    bb.hidden = false;
    this.el.bossnm.textContent = e.name;
    this.el.bosslv.textContent = `Lv.${e.level} · ${fmt(Math.max(0, e.hp))} / ${fmt(e.maxHp)}`;
    if (this._bossBars !== e.hpBars) {
      this._bossBars = e.hpBars;
      this.el.bossbars.innerHTML = '';
      for (let i = 0; i < e.hpBars; i++) { const d = document.createElement('div'); d.className = 'bar'; d.innerHTML = '<b></b><i></i>'; this.el.bossbars.appendChild(d); }
    }
    const per = e.maxHp / e.hpBars;
    [...this.el.bossbars.children].forEach((d, i) => {
      const lo = (e.hpBars - 1 - i) * per; // 왼쪽 막대가 마지막에 깎인다
      const k = clamp((e.hp - lo) / per, 0, 1);
      d.children[1].style.width = k * 100 + '%'; d.children[0].style.width = k * 100 + '%';
    });
  },

  // ------------------------------------------------------------------ 메뉴
  openMenu(builder) {
    if (!this.stack.length) { this.prevState = G.state === 'menu' ? 'play' : G.state; }
    this.stack.push(builder);
    this.focus = 0;
    G.state = 'menu';
    if (document.pointerLockElement) document.exitPointerLock();
    this.render();
    Sfx.click();
  },
  replaceMenu(builder) { this.stack.pop(); this.stack.push(builder); this.focus = 0; this.render(); },
  back() {
    const top = this.stack[this.stack.length - 1];
    const def = top && top();
    if (def && def.noBack) return;
    this.stack.pop();
    Sfx.click();
    if (!this.stack.length) this.closeMenu(); else { this.focus = 0; this.render(); }
  },
  closeMenu() {
    this.stack = [];
    this.el.menu.hidden = true;
    if (this.vr) this.vr.mesh.visible = false;
    if (Player.ctrls) for (const c of Player.ctrls) if (c.userData.ray) c.userData.ray.visible = false;
    G.state = this.prevState === 'title' ? 'title' : 'play';
    this.prevState = null;
    if (G.state === 'play' && !G.touch && !G.xr) this.el.crosshair.title = '';
  },
  refresh() { if (this.stack.length) this.render(true); },
  render(keepFocus) {
    const def = this.stack[this.stack.length - 1]();
    this.cur = def;
    const items = def.items.filter(Boolean);
    this.curItems = items;
    if (!keepFocus) { this.focus = items.findIndex((it) => it.onSelect && !it.disabled); if (this.focus < 0) this.focus = 0; }
    if (G.xr) { this.renderVR(def, items); return; }
    const E = this.el;

  },
  markFocus() {
    [...this.el.menulist.querySelectorAll('.item')].forEach((b) => b.classList.toggle('focus', b.id === 'mi-' + this.focus));
    const f = $('mi-' + this.focus); if (f) f.scrollIntoView({ block: 'nearest' });
  },
  select() {
    const it = this.curItems && this.curItems[this.focus];

    Sfx.click();
    it.onSelect();

  },
  menuKey(e) {
    if (G.state !== 'menu' || G.xr) return;

  },

  // ------------------------------------------------------------------ VR 메뉴
  ensureVR() {
    if (this.vr) return this.vr;
    const c = document.createElement('canvas'); c.width = 1024; c.height = 820;
    const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(1.25, 1.0), new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthTest: false }));
    mesh.renderOrder = 50; mesh.visible = false;
    R.scene.add(mesh);

  },
  renderVR(def, items) {
    const V = this.ensureVR();
    if (!V.mesh.visible) {
      const cam = R.renderer.xr.getCamera();
      const head = new THREE.Vector3().setFromMatrixPosition(cam.matrixWorld);
      const f = Player.forwardXZ();
      V.mesh.position.set(head.x + f[0] * 1.4, head.y - 0.1, head.z + f[1] * 1.4);
      V.mesh.lookAt(head.x, head.y - 0.1, head.z);

    }
    if (Player.ctrls) for (const c of Player.ctrls) if (c.userData.ray) c.userData.ray.visible = true;
    V.def = def; V.items = items;

  },
  drawVR() {
    const V = this.vr, g = V.canvas.getContext('2d'), W = 1024, H = 820, def = V.def;
    const per = 8;
    const pages = Math.max(1, Math.ceil(V.items.length / per));
    V.page = clamp(V.page, 0, pages - 1);
    const rows = V.items.slice(V.page * per, V.page * per + per);
    g.clearRect(0, 0, W, H);
    g.fillStyle = 'rgba(12,17,25,0.96)'; g.fillRect(0, 0, W, H);
    g.strokeStyle = 'rgba(227,192,112,0.7)'; g.lineWidth = 4; g.strokeRect(3, 3, W - 6, H - 6);
    g.fillStyle = '#e8edf4'; g.font = '700 44px "Gowun Batang", serif'; g.textBaseline = 'middle';
    g.fillText(def.title, 34, 50);
    g.fillStyle = '#95a3b4'; g.font = '400 24px "IBM Plex Sans KR", sans-serif';
    g.fillText((def.sub || '').slice(0, 60), 36, 92);
    V.rows = [];
    let y = 128;
    for (const it of rows) {
      const h = it.canvas ? 0 : it.detail ? 78 : 62;
      if (it.canvas) { g.drawImage(it.canvas, 312, y, 400, 400); V.rows.push({ y0: y, y1: y + 400, it: null }); y += 404; continue; }
      const idx = V.rows.length;
      const sel = it.onSelect && !it.disabled;
      if (sel && V.hover === idx) { g.fillStyle = 'rgba(227,192,112,0.18)'; g.fillRect(20, y, W - 40, h - 4); }
      g.globalAlpha = it.disabled ? 0.4 : 1;
      g.fillStyle = it.color || (it.onSelect ? '#e8edf4' : '#95a3b4');
      g.font = (it.onSelect ? '600 30px' : it.head ? '700 24px' : '400 26px') + ' "IBM Plex Sans KR", sans-serif';
      g.fillText(String(it.text ?? it.label ?? '').slice(0, 44), 40, y + 26);
      if (it.right) { g.textAlign = 'right'; g.fillStyle = '#e3c070'; g.font = '600 26px "IBM Plex Sans KR", sans-serif'; g.fillText(it.right, W - 40, y + 26); g.textAlign = 'left'; }
      if (it.detail) { g.fillStyle = '#95a3b4'; g.font = '400 22px "IBM Plex Sans KR", sans-serif'; g.fillText(it.detail.slice(0, 58), 40, y + 58); }
      g.globalAlpha = 1;

    }
    // 아래쪽 버튼
    const navY = H - 70;
    V.nav = [];
    const btn = (label, x, w, fn) => { const i = V.nav.length; const hov = V.hover === 100 + i; g.fillStyle = hov ? 'rgba(227,192,112,0.3)' : 'rgba(255,255,255,0.06)'; g.fillRect(x, navY, w, 54); g.fillStyle = '#e8edf4'; g.font = '600 26px "IBM Plex Sans KR", sans-serif'; g.textAlign = 'center'; g.fillText(label, x + w / 2, navY + 27); g.textAlign = 'left'; V.nav.push({ x0: x, x1: x + w, fn }); };
    if (pages > 1) { btn('◀ 이전', 30, 200, () => { V.page--; this.drawVR(); }); btn(`${V.page + 1} / ${pages}`, 412, 200, () => {}); btn('다음 ▶', 794, 200, () => { V.page++; this.drawVR(); }); }
    btn(this.stack.length > 1 ? '뒤로' : '닫기', pages > 1 ? 240 : 412, pages > 1 ? 160 : 200, () => this.back());
    V.tex.needsUpdate = true;
  },
  updateVRMenu() {
    if (!G.xr || G.state !== 'menu' || !this.vr || !this.vr.mesh.visible) return;
    const c = Player.rightCtrl || (Player.ctrls && Player.ctrls[0]); if (!c) return;
    const ray = new THREE.Raycaster();
    const m = c.matrixWorld;
    const o = new THREE.Vector3().setFromMatrixPosition(m), d = new THREE.Vector3(0, 0, -1).transformDirection(m);
    ray.set(o, d);
    const hit = ray.intersectObject(this.vr.mesh)[0];
    let hov = -1;
    if (hit && hit.uv) {
      const px = hit.uv.x * 1024, py = (1 - hit.uv.y) * 820;
      if (py > 820 - 70) { this.vr.nav.forEach((n, i) => { if (px >= n.x0 && px <= n.x1) hov = 100 + i; }); }
      else this.vr.rows.forEach((r, i) => { if (r.it && py >= r.y0 && py < r.y1) hov = i; });
    }

  },
  vrSelect() {
    const V = this.vr; if (!V || V.hover < 0) return;
    if (V.hover >= 100) { const n = V.nav[V.hover - 100]; if (n) { Sfx.click(); n.fn(); } return; }
    const r = V.rows[V.hover]; if (!r || !r.it) return;

  },
  vrBanner(t, s, ms) {
    if (!this._vrB) {

    g.textAlign = 'center'; g.fillStyle = '#fff'; g.font = '700 84px "Gowun Batang", serif'; g.shadowColor = '#000'; g.shadowBlur = 16;
    g.fillText(t, 512, 110); g.fillStyle = '#e3c070'; g.font = '600 40px "IBM Plex Sans KR", sans-serif'; g.fillText(s || '', 512, 190);

    this._vrB.material.map = new THREE.CanvasTexture(c); this._vrB.material.map.colorSpace = THREE.SRGBColorSpace; this._vrB.material.needsUpdate = true;

  },
  vrNote(text, color) {

  },
  updateVRBanner(dt) {

  setupVRFlash() {
    if (this.vrFlash) return;
    this.vrFlash = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 8), new THREE.MeshBasicMaterial({ color: 0xaa0a0a, transparent: true, opacity: 0, side: THREE.BackSide, depthTest: false }));

  // ------------------------------------------------------------------ 터치
  initTouch() {
    const pad = $('tpad'), knob = $('tknob');
    let padId = null, cx = 0, cy = 0;
    const setKnob = (x, y) => { knob.style.transform = `translate(${x}px, ${y}px)`; };
    pad.addEventListener('pointerdown', (e) => { padId = e.pointerId; const r = pad.getBoundingClientRect(); cx = r.left + r.width / 2; cy = r.top + r.height / 2; pad.setPointerCapture(e.pointerId); move(e); e.preventDefault(); });
    const move = (e) => {
      if (e.pointerId !== padId) return;
      let dx = e.clientX - cx, dy = e.clientY - cy; const l = Math.hypot(dx, dy), m = 52;
      if (l > m) { dx = dx / l * m; dy = dy / l * m; }
      Input.joy.x = dx / m; Input.joy.y = dy / m; setKnob(dx, dy);
    };
    pad.addEventListener('pointermove', move);
    const end = (e) => { if (e.pointerId !== padId) return; padId = null; Input.joy.x = Input.joy.y = 0; setKnob(0, 0); };
    pad.addEventListener('pointerup', end); pad.addEventListener('pointercancel', end);
