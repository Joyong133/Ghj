plugins {
    id 'com.android.application'
}

android {
    namespace 'com.joyong.line1vr'
    compileSdk 34
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'com.joyong.line1vr'
        minSdk 29
        targetSdk 32
        versionCode 1
        versionName '1.0'
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    signingConfigs {
        // Throw-away key kept in the repository so that every build can be
        // installed over the previous one. Not for store releases.
        sideload {
            storeFile file('../sideload.keystore')
            storePassword 'android'
            keyAlias 'sideload'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.sideload
        }
        debug {
            signingConfig signingConfigs.sideload
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildFeatures {
        prefab true
    }

    lint {
        // Sideloaded Quest app, not a Google Play release: 32 is the level Meta targets.
        disable 'ExpiredTargetSdkVersion'
    }
}

dependencies {
    implementation 'org.khronos.openxr:openxr_loader_for_android:1.1.49'
}
