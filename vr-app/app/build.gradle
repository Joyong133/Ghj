plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ghj.vrblack'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ghj.vrblack'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        // 저장소에 들어 있는 디버그 키로 서명해서, 새 빌드를 받아도 지우지 않고 덮어 설치할 수 있게 합니다.
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
